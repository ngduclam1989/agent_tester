<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wave 7 · Booking relay · Sequence</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1100px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 840px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · Wave 07 · Garage Automation Testing Kit</p>
    <h1>Booking relay — Driver Plus ↔ gf-sales ↔ Garage</h1>

    <svg viewBox="0 0 960 850" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="w07-booking-relay-seq-title w07-booking-relay-seq-desc">
      <title id="w07-booking-relay-seq-title">Wave 7 Booking relay sequence</title>
      <desc id="w07-booking-relay-seq-desc">Driver Plus creates a booking that gf-sales parses and relays into the garage's booking list, then sends a cancellation that gf-sales only honors while the booking is still NEW or CONFIRMED with no service order, always answering Driver Plus with a correlated response.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
        </marker>
        <marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- LIFELINES — Driver Plus 160 · gf-sales 480 · Garage 800 -->
      <line x1="160" y1="128" x2="160" y2="660" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="480" y1="128" x2="480" y2="660" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="800" y1="128" x2="800" y2="660" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- ACTIVATION BARS — Garage list call/return -->
      <rect x="476" y="312" width="8" height="56" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="796" y="312" width="8" height="56" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

      <!-- M1: Driver Plus -> gf-sales  BOOKING.CREATE.REQUEST (async) -->
      <line x1="160" y1="176" x2="480" y2="176" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
      <rect x="246" y="156" width="148" height="12" rx="2" fill="#f5f5f5"/>
      <text x="320" y="165" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BOOKING.CREATE.REQUEST</text>

      <!-- M2: gf-sales self  parse 14 fields + dedupe -->
      <path d="M 480 224 h 40 v 20 h -40" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="528" y="228" width="160" height="12" rx="2" fill="#f5f5f5"/>
      <text x="608" y="237" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PARSE 14 FIELDS + DEDUPE</text>

      <!-- M3: gf-sales -> Driver Plus  BOOKING.CREATE.RESPONSE (headline) -->
      <line x1="480" y1="272" x2="160" y2="272" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <rect x="242" y="252" width="156" height="12" rx="2" fill="#f5f5f5"/>
      <text x="320" y="261" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BOOKING.CREATE.RESPONSE</text>

      <!-- M4: Garage -> gf-sales  GET /bookings -->
      <line x1="800" y1="320" x2="480" y2="320" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="590" y="300" width="100" height="12" rx="2" fill="#f5f5f5"/>
      <text x="640" y="309" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GET /BOOKINGS</text>

      <!-- M5: gf-sales --> Garage  200 · list (return) -->
      <line x1="480" y1="360" x2="800" y2="360" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="600" y="340" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="640" y="349" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">200 · LIST</text>

      <!-- M6: Driver Plus -> gf-sales  BOOKING.CANCELLED (async) -->
      <line x1="160" y1="408" x2="480" y2="408" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
      <rect x="256" y="388" width="128" height="12" rx="2" fill="#f5f5f5"/>
      <text x="320" y="397" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BOOKING.CANCELLED</text>

      <!-- OPT COMBINED FRAGMENT — spans Driver Plus · gf-sales -->
      <rect x="120" y="440" width="420" height="120" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <rect x="120" y="440" width="40" height="16" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="140" y="452" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">OPT</text>
      <text x="132" y="464" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[NEW/CONFIRMED, NO SO]</text>

      <!-- M7 (in OPT): gf-sales self  CANCELLED -->
      <path d="M 480 480 h 40 v 20 h -40" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="528" y="484" width="76" height="12" rx="2" fill="#f5f5f5"/>
      <text x="566" y="493" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CANCELLED</text>

      <!-- M8 (in OPT): gf-sales -> Driver Plus  BOOKING.CANCEL.RESPONSE -->
      <line x1="480" y1="536" x2="160" y2="536" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
      <rect x="242" y="516" width="156" height="12" rx="2" fill="#f5f5f5"/>
      <text x="320" y="525" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BOOKING.CANCEL.RESPONSE</text>

      <!-- M9: gf-sales -> Driver Plus  BOOKING.CHANGE.STATUS (async, outside fragment) -->
      <line x1="480" y1="608" x2="160" y2="608" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
      <rect x="248" y="588" width="144" height="12" rx="2" fill="#f5f5f5"/>
      <text x="320" y="597" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BOOKING.CHANGE.STATUS</text>

      <!-- ANNOTATION CALLOUTS (max 2) -->
      <text x="904" y="36" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">retry cùng event không tạo bản trùng</text>
      <path d="M 820 44 Q 650 140 480 250" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="480" cy="250" r="2" fill="#2d3142"/>

      <text x="56" y="700" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="start">else: giữ nguyên, đồng bộ trạng thái thực</text>
      <path d="M 56 692 Q 70 580 108 448" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="108" cy="448" r="2" fill="#2d3142"/>

      <!-- ACTOR BOXES — drawn after arrows -->
      <!-- Driver Plus (external) -->
      <rect x="88" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="88" y="72" width="144" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="96" y="80" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="112" y="89" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
      <text x="160" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Driver Plus</text>
      <text x="160" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">external partner</text>

      <!-- gf-sales (focal) -->
      <rect x="408" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="408" y="72" width="144" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="416" y="80" width="32" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="432" y="89" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SYS</text>
      <text x="480" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">gf-sales</text>
      <text x="480" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">booking relay owner</text>

      <!-- Garage Web/Mobile (input) -->
      <rect x="728" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="728" y="72" width="144" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="736" y="80" width="32" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="752" y="89" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">APP</text>
      <text x="800" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Garage</text>
      <text x="800" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">web / mobile via BFF</text>

      <!-- LEGEND -->
      <line x1="56" y1="768" x2="904" y2="768" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="56" y="784" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <line x1="56" y1="804" x2="84" y2="804" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="92" y="808" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">REST call</text>

      <line x1="196" y1="804" x2="224" y2="804" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="232" y="808" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Return</text>

      <line x1="320" y1="804" x2="348" y2="804" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
      <text x="356" y="808" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Kafka async</text>

      <line x1="464" y1="804" x2="492" y2="804" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="500" y="808" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Headline event</text>

      <path d="M 636 798 h 20 v 10 h -20" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="664" y="808" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Internal step</text>

      <rect x="784" y="796" width="28" height="18" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="792" y="808" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace">OPT</text>
      <text x="820" y="808" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Fragment</text>
    </svg>
  </div>
</body>
</html>
