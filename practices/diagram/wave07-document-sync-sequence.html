<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wave 7 · Document sync · Sequence</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1100px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 840px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · Wave 07 · Garage Automation Testing Kit</p>
    <h1>Document sync — gf-sales ↔ gf-accounting ↔ Driver Plus</h1>

    <svg viewBox="0 0 960 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="w07-document-sync-seq-title w07-document-sync-seq-desc">
      <title id="w07-document-sync-seq-title">Wave 7 Document sync sequence</title>
      <desc id="w07-document-sync-seq-desc">After a Driver Plus-sourced service order completes, gf-sales renders and uploads the document then sends Driver Plus a service-order sync event; gf-accounting reads a settlement snapshot from gf-sales, renders its own document, and sends Driver Plus two independent settlement sync events.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
        </marker>
        <marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- LIFELINES — gf-sales 160 · gf-accounting 480 · Driver Plus 800 -->
      <line x1="160" y1="128" x2="160" y2="600" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="480" y1="128" x2="480" y2="600" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="800" y1="128" x2="800" y2="600" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- ACTIVATION BARS — settlement snapshot call/return -->
      <rect x="156" y="360" width="8" height="56" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="476" y="360" width="8" height="56" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

      <!-- M1: gf-sales self  SO complete (D+ source) -->
      <path d="M 160 176 h 40 v 20 h -40" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="208" y="180" width="120" height="12" rx="2" fill="#f5f5f5"/>
      <text x="268" y="189" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SO COMPLETE (D+)</text>

      <!-- M2: gf-sales self  render + upload PDF -->
      <path d="M 160 224 h 40 v 20 h -40" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="208" y="228" width="136" height="12" rx="2" fill="#f5f5f5"/>
      <text x="276" y="237" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RENDER + UPLOAD PDF</text>

      <!-- M3: gf-sales -> Driver Plus  DOCUMENT.SERVICE_ORDER.SYNC (headline) -->
      <line x1="160" y1="272" x2="800" y2="272" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <rect x="388" y="252" width="184" height="12" rx="2" fill="#f5f5f5"/>
      <text x="480" y="261" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DOCUMENT.SERVICE_ORDER.SYNC</text>

      <!-- M4: gf-accounting self  create settlement -->
      <path d="M 480 320 h 40 v 20 h -40" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="528" y="324" width="128" height="12" rx="2" fill="#f5f5f5"/>
      <text x="592" y="333" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CREATE SETTLEMENT</text>

      <!-- M5: gf-accounting -> gf-sales  GET /for-settlement -->
      <line x1="480" y1="368" x2="160" y2="368" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="252" y="348" width="136" height="12" rx="2" fill="#f5f5f5"/>
      <text x="320" y="357" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GET /FOR-SETTLEMENT</text>

      <!-- M6: gf-sales --> gf-accounting  200 · snapshot (return) -->
      <line x1="160" y1="408" x2="480" y2="408" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="268" y="388" width="104" height="12" rx="2" fill="#f5f5f5"/>
      <text x="320" y="397" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">200 · SNAPSHOT</text>

      <!-- M7: gf-accounting self  render + upload PDF -->
      <path d="M 480 456 h 40 v 20 h -40" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="528" y="460" width="136" height="12" rx="2" fill="#f5f5f5"/>
      <text x="596" y="469" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RENDER + UPLOAD PDF</text>

      <!-- M8: gf-accounting -> Driver Plus  DOCUMENT.SETTLEMENT.SYNC #1 -->
      <line x1="480" y1="504" x2="800" y2="504" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
      <rect x="548" y="484" width="184" height="12" rx="2" fill="#f5f5f5"/>
      <text x="640" y="493" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DOCUMENT.SETTLEMENT.SYNC #1</text>

      <!-- M9: gf-accounting -> Driver Plus  DOCUMENT.SETTLEMENT.SYNC #2 -->
      <line x1="480" y1="552" x2="800" y2="552" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
      <rect x="548" y="532" width="184" height="12" rx="2" fill="#f5f5f5"/>
      <text x="640" y="541" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DOCUMENT.SETTLEMENT.SYNC #2</text>

      <!-- ANNOTATION CALLOUTS (max 2) -->
      <text x="904" y="36" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">không có step thu hồi (REVOKED)</text>
      <path d="M 820 44 Q 700 150 620 280" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="620" cy="280" r="2" fill="#2d3142"/>

      <text x="56" y="624" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="start">2 phiếu phát riêng, không ghi đè nhau</text>
      <path d="M 56 616 Q 300 560 600 508" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="600" cy="508" r="2" fill="#2d3142"/>

      <!-- ACTOR BOXES — drawn after arrows -->
      <!-- gf-sales (backend) -->
      <rect x="88" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="88" y="72" width="144" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="96" y="80" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="112" y="89" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SVC</text>
      <text x="160" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">gf-sales</text>
      <text x="160" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">service order doc</text>

      <!-- gf-accounting (backend) -->
      <rect x="408" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="408" y="72" width="144" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="416" y="80" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="432" y="89" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SVC</text>
      <text x="480" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">gf-accounting</text>
      <text x="480" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">settlement doc</text>

      <!-- Driver Plus (external) -->
      <rect x="728" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="728" y="72" width="144" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="736" y="80" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="752" y="89" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
      <text x="800" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Driver Plus</text>
      <text x="800" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">external partner</text>

      <!-- LEGEND -->
      <line x1="56" y1="656" x2="904" y2="656" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="56" y="672" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <line x1="56" y1="692" x2="84" y2="692" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="92" y="696" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">REST call</text>

      <line x1="196" y1="692" x2="224" y2="692" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="232" y="696" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Return</text>

      <line x1="320" y1="692" x2="348" y2="692" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
      <text x="356" y="696" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Kafka async</text>

      <line x1="464" y1="692" x2="492" y2="692" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="500" y="696" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Headline event</text>

      <path d="M 636 686 h 20 v 10 h -20" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="664" y="696" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Internal step</text>
    </svg>
  </div>
</body>
</html>
