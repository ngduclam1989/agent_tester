<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wave 7 · Partner Link lifecycle · Sequence</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1100px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 840px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · Wave 07 · Garage Automation Testing Kit</p>
    <h1>Partner Link lifecycle — Driver Plus ↔ gf-system ↔ Garage</h1>

    <svg viewBox="0 0 960 820" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="w07-partner-link-seq-title w07-partner-link-seq-desc">
      <title id="w07-partner-link-seq-title">Wave 7 Partner Link lifecycle sequence</title>
      <desc id="w07-partner-link-seq-desc">Driver Plus sends a link request, garage approves it through gf-system which auto-rejects other pending requests and publishes profile sync and status events back to Driver Plus, then Driver Plus withdraws the link without triggering a return notification.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
        </marker>
        <marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- LIFELINES — Driver Plus 160 · gf-system 480 · Garage 800 -->
      <line x1="160" y1="128" x2="160" y2="700" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="480" y1="128" x2="480" y2="700" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="800" y1="128" x2="800" y2="700" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- ACTIVATION BARS — sync REST pairs only -->
      <rect x="476" y="264" width="8" height="56" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="796" y="264" width="8" height="56" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="476" y="352" width="8" height="112" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="796" y="352" width="8" height="112" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

      <!-- M1: Driver Plus -> gf-system  REQUEST.CREATE (async) -->
      <line x1="160" y1="176" x2="480" y2="176" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
      <rect x="228" y="156" width="184" height="12" rx="2" fill="#f5f5f5"/>
      <text x="320" y="165" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PARTNER_LINK.REQUEST.CREATE</text>

      <!-- M2: gf-system self  create PENDING -->
      <path d="M 480 224 h 40 v 20 h -40" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="528" y="228" width="104" height="12" rx="2" fill="#f5f5f5"/>
      <text x="580" y="237" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CREATE PENDING</text>

      <!-- M3: Garage -> gf-system  GET /partner-links -->
      <line x1="800" y1="272" x2="480" y2="272" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="574" y="252" width="132" height="12" rx="2" fill="#f5f5f5"/>
      <text x="640" y="261" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GET /PARTNER-LINKS</text>

      <!-- M4: gf-system --> Garage  200 · PENDING (return) -->
      <line x1="480" y1="312" x2="800" y2="312" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="590" y="292" width="100" height="12" rx="2" fill="#f5f5f5"/>
      <text x="640" y="301" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">200 · PENDING</text>

      <!-- M5: Garage -> gf-system  POST /approve -->
      <line x1="800" y1="360" x2="480" y2="360" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="590" y="340" width="100" height="12" rx="2" fill="#f5f5f5"/>
      <text x="640" y="349" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">POST /APPROVE</text>

      <!-- M6: gf-system self  LINKED + auto-reject other pending -->
      <path d="M 480 408 h 40 v 20 h -40" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="528" y="412" width="136" height="12" rx="2" fill="#f5f5f5"/>
      <text x="596" y="421" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LINKED + AUTO-REJECT</text>

      <!-- M7: gf-system --> Garage  200 · LINKED (return) -->
      <line x1="480" y1="456" x2="800" y2="456" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="594" y="436" width="92" height="12" rx="2" fill="#f5f5f5"/>
      <text x="640" y="445" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">200 · LINKED</text>

      <!-- M8: gf-system -> Driver Plus  PROFILE.SYNC (headline success) -->
      <line x1="480" y1="504" x2="160" y2="504" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <rect x="234" y="484" width="172" height="12" rx="2" fill="#f5f5f5"/>
      <text x="320" y="493" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PARTNER_LINK.PROFILE.SYNC</text>

      <!-- M9: gf-system -> Driver Plus  STATUS.CHANGED (async) -->
      <line x1="480" y1="552" x2="160" y2="552" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
      <rect x="228" y="532" width="184" height="12" rx="2" fill="#f5f5f5"/>
      <text x="320" y="541" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PARTNER_LINK.STATUS.CHANGED</text>

      <!-- M10: Driver Plus -> gf-system  UNLINK (async) -->
      <line x1="160" y1="600" x2="480" y2="600" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
      <rect x="252" y="580" width="136" height="12" rx="2" fill="#f5f5f5"/>
      <text x="320" y="589" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PARTNER_LINK.UNLINK</text>

      <!-- M11: gf-system self  UNLINKED, no notify back -->
      <path d="M 480 648 h 40 v 20 h -40" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="528" y="652" width="136" height="12" rx="2" fill="#f5f5f5"/>
      <text x="596" y="661" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">UNLINKED · NO NOTIFY</text>

      <!-- ANNOTATION CALLOUT -->
      <text x="904" y="36" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">chỉ 1 liên kết LINKED tại 1 thời điểm</text>
      <path d="M 820 44 Q 660 200 480 432" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="480" cy="432" r="2" fill="#2d3142"/>

      <!-- ACTOR BOXES — drawn after arrows -->
      <!-- Driver Plus (external) -->
      <rect x="88" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="88" y="72" width="144" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="96" y="80" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="112" y="89" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
      <text x="160" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Driver Plus</text>
      <text x="160" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">external partner</text>

      <!-- gf-system (focal) -->
      <rect x="408" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="408" y="72" width="144" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="416" y="80" width="32" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="432" y="89" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SYS</text>
      <text x="480" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">gf-system</text>
      <text x="480" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Partner Link owner</text>

      <!-- Garage Web/Mobile (input) -->
      <rect x="728" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="728" y="72" width="144" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="736" y="80" width="32" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="752" y="89" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">APP</text>
      <text x="800" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Garage</text>
      <text x="800" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">web / mobile via BFF</text>

      <!-- LEGEND -->
      <line x1="56" y1="740" x2="904" y2="740" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="56" y="756" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <line x1="56" y1="776" x2="84" y2="776" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="92" y="780" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">REST call</text>

      <line x1="204" y1="776" x2="232" y2="776" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="240" y="780" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Return</text>

      <line x1="336" y1="776" x2="364" y2="776" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
      <text x="372" y="780" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Kafka async</text>

      <line x1="484" y1="776" x2="512" y2="776" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="520" y="780" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Headline event</text>

      <path d="M 660 770 h 20 v 10 h -20" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="688" y="780" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Internal step</text>
    </svg>
  </div>
</body>
</html>
