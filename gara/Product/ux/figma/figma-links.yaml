# Figma Link Registry — INDEX máy đọc cho Figma URL + node-id (Garage).
#
# 2 nguồn URL AUTHORITATIVE:
#   1. FEAT: `Product/features/FEAT-*.md §UI/UX Reference` (row `| Figma | {platform} | {url} |`,
#      do Business Authority maintain) → key `FEAT-*` dưới `waves["NN"]`.
#   2. CR:   `Tracking/CHANGE-REQUESTS.md` row `| **Figma** | {web|mobile} | {slug|null} | {url} |`
#      + row bắt buộc `| **Wave** | NN |` trong cùng CR section (do CR author maintain)
#      → key `CR-*` dưới `waves["NN"].crs:`.
# Registry AUTO-SYNC từ 2 nguồn qua `scripts/sync-figma-links.sh {wave}` — chạy tự động ở **Bước 0**
# của `/prefetch-figma {platform} {wave}` & `/prefetch-figma-oracle`.
# `/prefetch-figma` resolve link CHỈ qua registry (không parse FEAT §4 / CR rows trực tiếp).
# ⚠️ Split-mode (≥2 screen) + `maps` + `wireframe` khai thủ công trong registry được GIỮ qua mỗi sync (upsert non-destructive).
#   → KHÔNG sửa tay file_key/node_id/url của single-screen (sẽ bị sync ghi đè từ FEAT §4 / CR rows); sửa ở nguồn.
#
# ── Schema ──────────────────────────────────────────────────────────────────
# waves:
#   "NN":                              # số wave 2 chữ số (zero-padded): "01", "02"
#     FEAT-XXX:                        # feature id (vd "FEAT-INS-SO-ADJUSTMENT")
#       feat_file: <path>              # đường dẫn FEAT spec (bắt buộc)
#       feature_slug: <slug>           # OPTIONAL override; default = FEAT-ID bỏ prefix "FEAT-" + lowercase
#                                      #   FEAT-INS-SO-ADJUSTMENT → ins-so-adjustment
#       web:                           # sub-block platform (Garage dual-platform: web + mobile)
#         file_key: <figma file key>   #   segment sau /design/ trong URL (bắt buộc nếu có screens)
#         wireframe: <path>            #   OPTIONAL — fallback khi screens: [] → FIGMA_LINK_MISSING
#         screens:                     #   list screen; số lượng quyết định split mode
#           - slug: <screen-slug|null> #     null = single-screen (gộp, file KHÔNG có suffix --slug)
#                                      #       ≥2 entry có slug ⇒ split mode (1 spec file/screen)
#                                      #       kebab-case, ≤24 char, unique trong feat+platform
#                                      #       reserved tokens preferred: list, detail, create, edit, settings
#             node_id: "X:Y"           #     node-id dạng DẤU HAI CHẤM (KHÔNG hyphen — MCP trả empty nếu hyphen)
#             url: <figma url gốc>     #     URL đầy đủ (giữ nguyên query params như trong Figma share)
#             maps: [AC-XXX]           #     OPTIONAL — AC mà screen này phục vụ (traceability)
#       mobile:                        # sub-block mobile (cùng schema web; file_key/node_id KHÁC web)
#         file_key: ...
#         screens: [...]
#     crs:                             # OPTIONAL sub-block — CR-keyed (1 sub-block / wave)
#       CR-YYYYMMDD-NN:                # CR id (vd "CR-20260616-02") — 2 format: epoch-10 hoặc date-NN
#         cr_anchor: <path#anchor>     # bắt buộc — link đến CR section (vd Tracking/CHANGE-REQUESTS.md#CR-20260616-02)
#         cr_slug: cr-{lowercase-id}   # bắt buộc — used cho filename derive (vd cr-20260616-02)
#         web:                         # platform sub-block giống FEAT (file_key + screens)
#           file_key: ...
#           screens: [...]
#         mobile: ...
#
# ── Quy tắc command suy ra (per platform sub-block) ─────────────────────────
#   FEAT:
#     • screens có ≥2 entry            → SPLIT: ghi wave{NN}-{feature_slug}--{slug}.md cho mỗi screen
#     • screens có 1 entry slug=null   → GỘP:   ghi wave{NN}-{feature_slug}.md
#     • screens: [] + wireframe        → ghi wave{NN}-{feature_slug}.md status=FIGMA_LINK_MISSING
#     • thiếu cả sub-block platform    → FIGMA_LINK_MISSING (fallback wireframe nếu có)
#   CR:
#     • screens có ≥2 entry            → SPLIT: ghi wave{NN}-{cr_slug}--{slug}.md cho mỗi screen
#     • screens có 1 entry slug=null   → GỘP:   ghi wave{NN}-{cr_slug}.md
#     • Frontmatter spec thay `feat`/`feat_file` bằng `cr_id`/`cr_anchor` (rest giống FEAT spec)
#   Common:
#     • CẤM mix: trong 1 feat/CR + platform KHÔNG được vừa có slug=null vừa có slug khác.
#     • Output dir theo platform: web → Product/ux/figma-web/ ; mobile → Product/ux/figma-mobile/
#     • "wave all" mode iterate cả keys FEAT-* lẫn keys dưới `crs:`.
#
# Validate: bash scripts/validate-figma-links.sh
# ────────────────────────────────────────────────────────────────────────────
#
# ── NOTES (tối thiểu — chỉ business fact KHÔNG suy ra được từ Figma) ──────────
# Registry = index máy đọc: chỉ giữ node TỔNG (file_key/node_id/url) + `maps` (AC traceability)
#   + `wireframe` fallback. KHÔNG mô tả node con / nesting / gap ở đây nữa (2026-06-05):
#   - Cấu trúc (child frame, sizes, tên) → `/prefetch-figma` tự enumerate qua get_metadata MỖI run.
#   - Mobile = NO-CACHE (luôn re-fetch) nên spec generated + screenshot + coverage_gaps luôn tươi
#     → node-map tay chỉ trùng lặp + nhanh stale (vd design đổi 238:*→397:* làm note cũ sai).
#   ⚠️ ĐẶT Ở HEADER (trước `waves:`) vì sync-figma-links.sh RE-EMIT block `waves:` → comment
#     inline bị xoá. `maps:` per-screen (structured) được giữ qua sync.
#
# Business flags (đính chính designer/metadata dễ gây hiểu sai — DEV cần biết):
#   • [w01] FEAT-INS-SO-ADJUSTMENT · mobile/web: frame Figma đặt tên "Tạo phiếu dịch vụ" THỰC RA
#     là màn CHỈNH SỬA (tên legacy). Section "Phân bổ BH" chỉ ở Edit + Detail, KHÔNG ở Tạo (AC-0).
#   • [w01] FEAT-INS-STL-DETAIL: là biến thể loại BẢO HIỂM của màn "Chi tiết phiếu quyết toán"
#     baseline — chỉ THÊM phần BH, không dựng màn mới.
# ────────────────────────────────────────────────────────────────────────────

