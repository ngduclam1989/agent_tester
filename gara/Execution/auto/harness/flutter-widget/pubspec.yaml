name: garage_mobile_widget_test_harness
description: >
  QC-owned widget test harness for garage-mobile (Flutter / BLoC).
  Runs flutter_test + bloc_test + mocktail headless (C1 cluster).
  No emulator needed. Spec files resolved from ../../specs/W{NN}/mobile-ui/.

publish_to: none

environment:
  sdk: '>=3.11.0 <4.0.0'
  flutter: '>=3.41.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^9.1.6
  mocktail: ^1.0.0
  test: ^1.24.0
  flutter_lints: ^4.0.0
