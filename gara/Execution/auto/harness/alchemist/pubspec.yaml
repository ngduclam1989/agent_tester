name: garage_mobile_alchemist_harness
description: >
  QC-owned alchemist golden test harness for garage-mobile.
  Runs alchemist goldenTest (C2 cluster) with deterministic Roboto font.
  Cross-platform golden: no font drift across Linux/macOS CI.

publish_to: none

environment:
  sdk: '>=3.11.0 <4.0.0'
  flutter: '>=3.41.0'

flutter:
  assets:
    - fonts/Roboto-Regular.ttf
    - fonts/Roboto-Medium.ttf
    - fonts/Roboto-Bold.ttf

  fonts:
    - family: Roboto
      fonts:
        - asset: fonts/Roboto-Regular.ttf
        - asset: fonts/Roboto-Medium.ttf
          weight: 500
        - asset: fonts/Roboto-Bold.ttf
          weight: 700

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  alchemist: ^0.14.0
  mocktail: ^1.0.0
  flutter_lints: ^4.0.0
