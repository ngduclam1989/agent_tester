        - "Mở VehicleManagementDetailRoute để xem hồ sơ xe"
        - "Chuyển tab sang services, parts và technical notes để xem lịch sử completed service order V3"
      compensation: "Quay lại list hoặc đổi điều kiện tìm kiếm nếu vehicle history không đủ dữ liệu"
    - id: "UC-PULSE-MOBILE-19"
      name: "Vehicle OCR Capture"
      actor: "garage-staff"
      flow:
        - "Camera/gallery → resize ảnh → uploadAttachment → OCR → đổ dữ liệu xe vào draft form"
        - "User rà soát dữ liệu OCR rồi dùng lại cho quotation/booking/service order hoặc vehicle context"
      compensation: "Reset scan và chụp/chọn ảnh lại"
    - id: "UC-PULSE-MOBILE-20"
      name: "Chat and Call Collaboration"
      actor: "garage-staff"
      flow:
        - "Main shell bootstrap CometChat token và push token"
        - "Mở ConversationsRoute/MessageRoute/ChatThreadRoute để chat theo purchase request, quotation hoặc support room"
        - "Tạo room CS, addCS/addCSWeekend hoặc route support qua getRouting"
        - "Nhận/mở outgoing, waiting hoặc ongoing call screen và đồng bộ endCall khi kết thúc"
      compensation: "Fallback về conversations/home nếu room/session không hợp lệ hoặc call payload lỗi"
    - id: "UC-PULSE-MOBILE-21"
      name: "Credit Card Payment WebView"
      actor: "garage-staff"
      flow:
        - "Khởi tạo paymentUrl từ backend"
        - "Mở WebView"
        - "Nghe callback URL hoặc JavaScript channel"
        - "Trả kết quả về flow mua hàng"
      compensation: "Đổi payment method, retry payment hoặc quay lại chi tiết đơn"
    - id: "UC-PULSE-MOBILE-22"
      name: "Feedback and Survey"
      actor: "garage-staff"
      flow:
        - "Mở FeedbackRoute để vào feedback portal theo tenant subdomain hoặc upload feedback payload"
        - "Mở SurveyFormRoute để hoàn tất survey form nội bộ khi flow cần"
        - "App gửi file/attachment kèm feedback nếu người dùng đính kèm minh chứng"
      compensation: "Giữ dữ liệu local trong form hoặc quay lại portal nếu upload/submit lỗi"
    - id: "UC-PULSE-MOBILE-23"
      name: "Change Password and Account Self Service"
      actor: "garage-staff"
      flow:
        - "Từ AccountRoute/PersonalProfileRoute, user mở ChangeUserPasswordRoute để đổi mật khẩu khi đã đăng nhập"
        - "User có thể xem profile cá nhân, thông tin garage và thực hiện deleteUser từ personal profile nếu flow được expose"
        - "Sau logout, app clear session và quay lại login shell"
      compensation: "Giữ session hiện tại hoặc quay lại profile khi đổi mật khẩu/xoá user không thành công"
    - id: "UC-PULSE-MOBILE-24"
      name: "Feature Flag and Version Gate"
      actor: "garage-staff"
      flow:
        - "Boot app → fetch Remote Config + feature flags"
        - "Gate payment QR, V3 flow, direct purchase flow và force-update UX theo env/runtime toggle"
      compensation: "Dùng cache/fallback defaults và degrade feature nếu config fetch lỗi"

