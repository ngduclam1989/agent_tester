      actor: "service-advisor"
      flow:
        - "Mở ServiceOrderListRouteV3 để search/filter danh sách SO V3"
        - "Tạo mới hoặc cập nhật ở ServiceOrderCreationV3Route"
        - "Mở ServiceOrderDetailV3Route để confirm, start, complete, cancel và sendQuotationV3"
        - "Dùng PartOrderRoute và getTotalStockBySkus/getPartsForDeliveryV3 để hỗ trợ parts planning"
