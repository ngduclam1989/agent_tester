        - "Mở TenantTransporterRegistryListRoute để xem/search/filter danh sách xe liên kết"
        - "Tạo hoặc chỉnh sửa registry ở form page"
        - "Mở detail để kiểm tra thông tin và xoá registry khi cần"
      compensation: "Quay về list hoặc retry create/update/delete nếu request lỗi"
    - id: "UC-PULSE-MOBILE-10"
      name: "Customer Management"
      actor: "garage-staff"
      flow:
