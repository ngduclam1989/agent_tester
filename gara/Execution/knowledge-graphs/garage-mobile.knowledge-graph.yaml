  # --- 10. DOMAIN GLOSSARY (mobile terminology) ---
  domain_glossary:
    "Flavor": "Build variant cho mỗi môi trường (dev, sit, uat, pt, stag, preprod, prod) — quyết định endpoint, app title, bundle/application id"
    "BasePage / BaseCubit / BaseState": "Lifecycle shell chuẩn hóa loading/error/processing/retry cho mọi page"
    "GraphQL-primary": "GraphQL là transport chính cho business/auth flow; REST là bounded exception có kiểm soát"
    "PermissionGuard": "Route-level guard — chặn navigation nếu user không có quyền tương ứng"
    "Widget.withPermission": "Widget-level guard — ẩn/disable widget nếu user không có quyền"
    "Policy-first": "Flow bắt buộc user xác nhận policy/T&C trước khi vào main shell"
    "PersistentTabView": "Bottom tab bar với state persistence — không rebuild tab khi chuyển tab"
    "Online-first": "App yêu cầu kết nối mạng cho mọi mutation; không có offline-sync"
    "V1 / V3 flow": "Service order có 2 flow: V1 (legacy) và V3 (new) — routing được quyết định bởi feature flags runtime"
    "CometChat bridge": "Native call adapters cho incoming/outgoing call experience trên Android (intent/receiver) và iOS (CallKit)"
    "Single-flight token refresh": "Nhiều request đồng thời gặp 401 → chỉ 1 request refresh token, các request còn lại đợi kết quả"
    "Nhóm vật tư hàng hoá (Material Group)": "Danh mục phân nhóm vật tư/hàng hoá, full CRUD trên mobile (CR-1782373204); flat card list KHÔNG TreeView (CR-1782381477)"
    "Mã sản phẩm nội bộ (Internal Product)": "Danh mục sản phẩm nội bộ, VIEW-ONLY trên mobile (list + detail); Create/Import/Export chỉ trên web (CR-1782373204)"
    "Inventory Hub": "Màn hub điều hướng 'Quản lý kho hàng' — grid 2-col 6-tile, W03 chỉ ship 2 tile (Sản phẩm + Nhóm vật tư), 4 tile còn lại hidden tới wave sau (FEAT-INV-MOBILE-MENU v2)"

  # --- 11. PERMISSION MATRIX (action → roles) ---
