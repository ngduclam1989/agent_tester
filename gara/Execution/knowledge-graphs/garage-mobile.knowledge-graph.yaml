# ─────────────────────────────────────────────────────────────────────────
# lessons_learned (W01 + W02 mobile incidents — curated 2026-06-29)
#
# Patterns DEV agent + reviewer + checklist-gate MUST consult before impl.
# Each entry: pattern_id, evidence (bug refs), root_cause, prevention,
# applies_to (FEAT/widget context).
#
# Source: Tracking/WAVE0{1,2}/BUGS.md + Execution/bugfixes/BUGFIX-BUG-*.md
# ─────────────────────────────────────────────────────────────────────────
lessons_learned:
  - pattern_id: "LL-MOB-001"
    title: "Style mobile theo spec web / trí nhớ / text AC thay vì node Figma mobile"
    evidence: ["BUG-W01-023", "BUG-W01-024", "BUG-W01-025"]
    severity: P1
    root_cause: |
      Agent style widget từ trí nhớ hoặc port từ web code/spec (frontend/gf-gms-web),
      KHÔNG đọc node Figma mobile canonical. Hậu quả: giá trị tiền render '+540.000đ'
      xanh/đỏ kèm prefix ± (web style) thay vì đen đậm không prefix; recap leak cross-tab;
      bottom bar 3 nút ngang bị cắt chữ thay vì 2 nút dọc.
    prevention: |
      R-FID-1..4 protocol (agent-dev-garage-mobile.md L191-197): screenshot-first style,
      mobile design canonical KHÔNG port web, diff element-by-element trước claim done,
      evidence+test literal. Apply per-screen — KHÔNG style từ trí nhớ.
    applies_to: ["all mobile UI features", "settlement", "service-order"]

  - pattern_id: "LL-MOB-002"
    title: "Client-side compute thay vì server snapshot — financial drift risk"
    evidence: ["BUG-W01-290", "BUG-W01-294", "BUG-W01-295"]
    severity: P1
    root_cause: |
      Mobile compute 'Tổng tiền KH thanh toán' / 'BH thanh toán' client-side từ formula
      thay vì đọc settlementBalance.{bhPayment,customerPayment} server-authoritative.
      Risk: mobile formula lệch BE (pre-VAT vs post-VAT) → display vs DB mismatch.
      Vi phạm AC canonical 'computed server-side, read-only'.
    prevention: |
      Server-authoritative discipline — đọc API response field thay vì derive client-side
      cho mọi monetary/computed field. Mobile binding chỉ format, KHÔNG calculation.
      Test contract: assert displayed value === API response value (no transform).
    applies_to: ["settlement", "service-order", "financial fields"]

  - pattern_id: "LL-MOB-003"
    title: "GraphQL selection set thiếu field → half-open feature (data persist OK, display rỗng)"
    evidence: ["BUG-W01-295", "BUG-W01-288 (web counterpart)"]
    severity: P1
    root_cause: |
      Mobile GraphQL query 'getInsuranceSettlement' thiếu 'serviceOrder.payments{...}'
      selection set → tab Lịch sử thanh toán rỗng dù DB có data. BFF resolver return null
      gracefully, mobile render empty state.
    prevention: |
      Cross-platform contract check — khi web có query field nào, mobile phải cover
      tương đương. Per-FEAT GraphQL ops trong §6 phải verify completeness vs paired
      BFF SDL (item #17 reviewer enforce). Test: mock response với data → assert render.
    applies_to: ["graphql_flutter queries", "any feature reading server-derived list"]

  - pattern_id: "LL-MOB-004"
    title: "Tab state desync sau pull-to-refresh — TabController vs PageController drift"
    evidence: ["BUG-W01-293"]
    severity: P2
    root_cause: |
      DefaultTabController + local _index + TabBarView/PageController không re-sync sau
      refresh handler rebuild body subtree. TabBar giữ user's selected index, body reset
      về tab 0 → user nhìn nhầm context.
    prevention: |
      Lift TabController lên State (không dùng DefaultTabController khi có refresh).
      Refresh handler chỉ fetch data — KHÔNG rebuild TabBarView. Test sync:
      pump TabController.index = 2 → trigger refresh → assert body still tab 2.
    applies_to: ["multi-tab detail pages", "TabBar + pull-to-refresh patterns"]

  - pattern_id: "LL-MOB-005"
    title: "Shared widget cross-screen render thừa khi feature flag không gate"
    evidence: ["BUG-W01-275", "BUG-W01-292", "BUG-W02-056", "BUG-W02-057"]
    severity: P2
    root_cause: |
      CostSummarySettlementWidget render trên màn 'Tạo phiếu QT BH' nhưng AC chỉ áp
      cho không-BH variant. Settlement edit page thiếu InsuranceSettlementDetailView panel
      mà màn Detail/Create đều có. Shared widget cross-screen không gate theo soHasInsurance.
    prevention: |
      Mỗi shared widget include trong page phải gate explicit theo feature flag
      ('if (!cubit.soHasInsurance)' hoặc 'if (cubit.feature == X)'). Cross-screen
      consistency check: Create/Edit/Detail của cùng entity phải render SAME panels
      cho SAME flag combinations (không gap).
    applies_to: ["any feature có 2+ screens cùng share widget", "soHasInsurance gates"]

  - pattern_id: "LL-MOB-006"
    title: "Sub-detail panel binding gap — column-level vs field-list under-spec"
    evidence: ["BUG-W01-291"]
    severity: P2
    root_cause: |
      AC chốt column-level (bảng cấp trên render 'Khấu hao VT' cho INSURANCE), nhưng
      sub-detail panel (expansion/popup row) bind thiếu field. Display-only gap, data
      persist OK. 3 màn mobile cùng widget shared → cùng gap.
    prevention: |
      Spec phải declare cả column-level VÀ sub-detail-panel field list. Reviewer
      item 19 D-M default-pattern audit + Item 22 mobile pattern catch shared widget
      gaps. Test golden: render expansion/popup → assert ALL fields visible per AC.
    applies_to: ["expandable rows", "popup detail panels", "shared widgets in 3+ screens"]

  - pattern_id: "LL-MOB-007"
    title: "Figma → spec → code 3-link drift (API SDL > Figma fidelity priority)"
    evidence: ["BUG-W02-049 (omnibus 8 sub-symptoms)"]
    severity: P1
    root_cause: |
      DEV agent priority sai: API SDL > Figma component anatomy → drop field + expand 1-1 nested.
      Prefetch-figma spec drift vs PNG canonical (3 icons mis-cataloged).
      DEV paraphrase > verbatim copy default text. Chain: figma-spec-reviewer missed icon
      visual ingest + checklist-gate Phase 1 only mobile + execution spec author no
      verbatim-copy guidance + DEV no fidelity check.
    prevention: |
      Figma = SSOT visual canonical (icon variant, anatomy, default text). API SDL chỉ
      contract — KHÔNG override visual. M-22 verbatim label rule + Item 19 D-M
      + agent-figma-spec-reviewer-mobile BLOCKING gate. DEV: copy default text verbatim,
      KHÔNG paraphrase. Icon variant verify per PNG (lucide-react/iconsax library variant).
    applies_to: ["fidelity-critical UI", "form templates", "default content rendering"]

  - pattern_id: "LL-MOB-008"
    title: "VN layer name leak từ Figma → code → 4 file rename post-DEV (3730 LoC)"
    evidence: ["BUG-W02-024", "BUG-W02-025", "BUG-W02-026"]
    severity: P0
    root_cause: |
      Figma layer name có Vietnamese romanization (PhieuQuyetToan/BienBan/GiayUyQuyen)
      propagate xuống code identifier vì execution spec không emit [identifier: PascalCase]
      annotation. DEV copy verbatim VN → code → 4 file rename post-DEV cycle (3730 LoC rework).
    prevention: |
      M-20 (narrative) + M-27 (mechanical) — VN romanization layer PHẢI có
      '[identifier: <PascalCase>]' annotation per glossary Product/ux/figma-glossary-vn-en.md
      §1-§4. Reviewer Item 19 + validator R-vn-en enforce. Missing mapping → STOP
      escalate Business Authority TRƯỚC khi gen, KHÔNG self-translate.
    applies_to: ["any Figma node với VN layer name", "form widgets", "dialog confirmations"]

  - pattern_id: "LL-MOB-009"
    title: "AppBar title token sai (textHeadingH3 thay vì textSubtitleS4) — wave03 incident"
    evidence: ["wave03 incident — 8/8 mobile spec invent class", "5 specs có AppBar token sai"]
    severity: P1
    root_cause: |
      DEV/transform author đoán font từ screenshot ('trông to/đậm hơn → H3') thay vì
      đọc binding từ get_design_context. AppBar nav-bar canonical = 16/SemiBold/24 =
      textSubtitleS4 theo design system, nhưng author emit textHeadingH3 (18/Bold/26).
    prevention: |
      Transform v9 §1.5a binding-deterministic + M-28 invariant. AppBar title nav-bar
      hard rule = textSubtitleS4. Reviewer Item 18 catch P0. Parser script trợ giúp:
      python3 scripts/parse-figma-design-context.py --strict. CẤM font/màu từ pixel.
    applies_to: ["AppBar title across all features", "CustomAppBar widget"]

  - pattern_id: "LL-MOB-010"
    title: "Path/router/repo Clean Architecture leak (web pattern → mobile spec) — wave03 incident"
    evidence: ["wave03 — 7 specs ban đầu emit lib/features/.../presentation/screens/_screen.dart"]
    severity: P0
    root_cause: |
      Author agent default theo template T1 example (lib/features/auth/login_screen.dart)
      + lack of bundle §G.Z mobile pattern audit → emit web Clean Architecture
      (presentation/application/data nesting) + go_router + *Screen class + separate
      _remote_datasource layer — ALL wrong per real Garage mobile (lib/ui/{domain}/
      {sub_feature}/{name}_page.dart flat 3-level + auto_route + *Page + repository
      direct GraphQL call no datasource layer).
    prevention: |
      4-layer mechanical defense: Template T2 canonical examples + Bundle §G.Z
      mobile pattern audit + Reviewer Item 22 BLOCKING + Validator R-mobile-path/
      router/repo. Verify against mobile/gf-garage-app/lib/ui/inventory/inventory_list/
      exemplar trước impl.
    applies_to: ["all new mobile FEAT specs", "execution-spec-author output"]


