  # --- 6. STORES — Client-side state persistence ---
  # Format:
  #   store-name:
  #     purpose: "..."
  #     keys: [key1, key2]
  stores:
    app-preferences:
      purpose: "SharedPreferences — auth/session material, profile snapshot, permission cache, payment gate flags, notification/call bootstrap và permission-denial memoization"
      keys:
        - "KEY_AUTH_TOKEN"
        - "KEY_REFRESH_TOKEN"
        - "KEY_ID_TOKEN"
        - "KEY_FIRST_LOGIN_CHALLENGE"
        - "KEY_IDENTIFIER"
        - "KEY_DEVICE_TOKEN"
        - "KEY_COMET_TOKEN"
        - "PROFILE"
        - "KEY_PERMISSIONS"
        - "SUB_DOMAIN"
        - "TC_AUTH"
        - "KEY_PAYMENT_QR"
        - "KEY_SUPPORTED_PAYMENT_QR"
        - "_deniedPermissionsKey"
        - "firebase (last notification payload)"
        - "SessionId / callType (call bootstrap hints)"
    hive-cache:
      purpose: "HiveStore for GraphQL cache — query/mutation response caching"
    feature-flag-cache:
      purpose: ".ff_cache file in ApplicationSupportDirectory — fallback khi API lỗi"
    app-cubit:
      purpose: "Global app boot/auth state — openApp(), force-update gate, unread counters và shared dashboard stats"
      state:
        - "authStatus"
        - "countChat"
        - "countNotification"
        - "shouldUpdate"
        - "statsData"
    main-cubit:
      purpose: "Main shell orchestration — notification unread polling, cart bootstrap, payment gate persistence và CometChat listener setup"
      runtime_flags:
        - "isRegisterdNotification"
    profile-cubit:
      purpose: "Profile/account state — fetch current profile + business info và patch ecommerceConfirmed trong UI"
      state:
        - "isLoading"
        - "businessInfo"
        - "profile"

  # --- 7. BUSINESS RULES (UI-enforcement layer) ---
  # Different from top-level business_rules: (architecture/policy).
  # These describe HOW the UI enforces a rule, not the rule itself.
  # Format:
  #   - id: BR-IMPL-PULSE-MOBILE-NNN
  #     rule: "..."
  #     enforcement: "Component/Cubit — how enforced in UI"
  #     architecture_ref: "BR-PULSE-MOBILE-NNN"
  business_rules:
    - id: "BR-IMPL-PULSE-MOBILE-001"
      rule: "Force-update gate — app version < minimum required"
      enforcement: "AppCubit.openApp + AppVersionManager.shouldUpdate + App.showUpdateVersionDialog"
      architecture_ref: "BR-PULSE-MOBILE-012"
    - id: "BR-IMPL-PULSE-MOBILE-002"
      rule: "First-login challenge — user phải đổi mật khẩu"
      enforcement: "LoginCubit kiểm tra firstLoginChallenge → route ChangePasswordRoute"
      architecture_ref: "BR-PULSE-MOBILE-013"
    - id: "BR-IMPL-PULSE-MOBILE-003"
      rule: "Policy-first gate — tcConfirmed = false thì block vào main"
      enforcement: "LoginCubit.getTenantInfo/ProfileRepository.getTenantInfo + AppCubit.onTcNotYetAuthenticated + PolicyFirstCubit.tcDataPrivacyConfirmed"
      architecture_ref: "BR-PULSE-MOBILE-011"
    - id: "BR-IMPL-PULSE-MOBILE-004"
      rule: "Permission-gated navigation — tab/action bị ẩn nếu thiếu quyền"
      enforcement: "PermissionGuard tại route level + Widget.withPermission tại action level"
      architecture_ref: "BR-PULSE-MOBILE-003"
    - id: "BR-IMPL-PULSE-MOBILE-005"
      rule: "Payment QR/credit hidden khi backend toggle off hoặc version < min"
      enforcement: "MainCubit.getEnablePaymentMethodMobile → AppPreferences.KEY_PAYMENT_QR visibility gate"
      architecture_ref: "BR-PULSE-MOBILE-005"
    - id: "BR-IMPL-PULSE-MOBILE-006"
      rule: "Network check trước mọi API call"
      enforcement: "AppCheckInternetService.instance.checkConnection() trong GraphQLServiceBase._execute"
      architecture_ref: "BR-PULSE-MOBILE-008"

  # --- 8. USE CASES ---
  # Format:
  #   - id: UC-PULSE-MOBILE-NN
  #     name: "..."
  #     actor: ROLE_NAME
  #     flow:
  #       - "Step 1"
  #       - "Step 2"
  use_cases:
    - id: "UC-PULSE-MOBILE-01"
      name: "Auth Session Routing"
      actor: "authenticated-user"
      flow:
        - "Splash/AppCubit kiểm tra force-update, auth token và tcAuth đã lưu"
        - "Load feature flags hoặc fallback cache"
        - "Route về login hoặc main shell từ boot; policy-first được kích hoạt sau login khi tenant chưa confirm"
        - "Refresh token không chạy proactive lúc boot mà được xử lý lazy ở GraphQLServiceBase khi request đầu tiên gặp 401"
      compensation: "Clear session và điều hướng về login khi refresh thất bại hoặc token không hợp lệ"
    - id: "UC-PULSE-MOBILE-02"
      name: "First Login and Policy Gate"
      actor: "garage-staff"
      flow:
        - "Login → nếu backend trả firstLoginChallenge thì bắt user đổi mật khẩu"
        - "Nếu không, app gọi getTenantInfo để lấy tcConfirmed"
        - "Route vào PolicyFirstRoute nếu chưa confirmed, hoặc MainRoute nếu đã confirmed"
      compensation: "Quay lại login hoặc cho người dùng xác nhận policy rồi tiếp tục"
    - id: "UC-PULSE-MOBILE-03"
      name: "Notification and Call Wakeup"
      actor: "garage-staff"
      flow:
        - "FCM/APNs/PushKit/local notification payload đến ở foreground/background/terminated"
        - "Rehydrate persisted payload/session hints"
        - "Map payload sang local notification, chat route hoặc call screen"
      compensation: "Best-effort fallback về home/inbox nếu payload thiếu hoặc session invalid"
    - id: "UC-PULSE-MOBILE-04"
      name: "Home Dashboard and Profile Bootstrap"
      actor: "garage-staff"
      flow:
        - "MainRoute mount → MainCubit/ProfileCubit tải getStats, getSpendingOverview, getSpendingChart, getDashboardRealtime, getCurrentUser, getTenantInfo"
        - "Main shell hiển thị home dashboard, unread notification badge, payment gate và profile snapshot"
        - "User có thể mở account, personal profile, business information, delivery address, affiliated garage và profile QR"
      compensation: "Fallback về cached profile/flags hoặc chỉ hiển thị shell tối thiểu nếu một phần widget dashboard lỗi"
    - id: "UC-PULSE-MOBILE-05"
      name: "Quotation Request Lifecycle"
      actor: "garage-staff"
      flow:
        - "Mở RequestQuoteListRoute để search/filter danh sách quotation ask"
        - "Vào CreateQuotationRoute để nhập vehicle info, chọn phụ tùng/dịch vụ, search catalog/part info và gửi requestQuotationPricing"
        - "Submit createQuotation/createQuotationV3/createSalesQuotation"
        - "Mở QuotationDetailRoute để xem chi tiết, preliminary quotation, invoice info, pinned chat context và histories"
      compensation: "Điều chỉnh spare parts, quay lại form hoặc retry pricing/create khi request lỗi"
    - id: "UC-PULSE-MOBILE-06"
      name: "Purchase Request Cart and Checkout"
      actor: "garage-staff"
      flow:
        - "Từ quotation hoặc ordering flow, user thêm phụ tùng vào CartRoute bằng addSparePartToCart/updateCart/deleteCartItem"
        - "Tạo purchase request qua addPurchaseRequest hoặc addPurchaseRequestV2"
        - "Mở list/detail purchase request để theo dõi, cancel hoặc prPlaceOrder"
        - "Ở ConfirmOrderRoute, user chọn payment method, xem transfer information, gọi prCheckoutQR hoặc prCheckoutCC"
      compensation: "Thay đổi payment method, retry checkout, quay lại purchase request detail hoặc huỷ yêu cầu"
    - id: "UC-PULSE-MOBILE-07"
      name: "Direct Purchase Order Lifecycle"
      actor: "garage-staff"
      flow:
        - "Mở ListOrderRoute hoặc ListOrderV3Route để search/filter purchase order/direct purchase order"
        - "Tạo đơn mới ở CreateNewOrderRoute, chọn spare part/product và submit createDirectPurchaseOrder"
        - "Mở OrderDetailRoute/OrderDetailV3Route/MarketplaceOrderDetailRoute để xem chi tiết"
        - "Cập nhật đơn, confirm delivered hoặc theo dõi parts for delivery tùy trạng thái"
      compensation: "Quay lại draft, chỉnh line items hoặc retry update/confirm nếu backend reject"
    - id: "UC-PULSE-MOBILE-08"
      name: "Supplier Management"
      actor: "garage-staff"
      flow:
        - "Mở SupplierListRoute để search/filter nhà cung cấp"
        - "Tạo mới ở SupplierAddRoute hoặc chỉnh sửa ở SupplierEditRoute"
        - "Mở SupplierDetailRoute để xem thông tin, warehouse/catalog liên quan"
        - "Toggle trạng thái active/inactive của supplier khi cần"
      compensation: "Giữ nguyên supplier hiện tại hoặc quay lại list khi validate/update thất bại"
    - id: "UC-PULSE-MOBILE-09"
      name: "Tenant Transporter Registry Management"
