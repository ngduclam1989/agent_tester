# =============================================================================
# Knowledge Graph — garage-mobile
# =============================================================================
# Boundary for the CarDoctor Garage Flutter app.
#
# OWNERSHIP MODEL (Approach B — section-level):
#   - ARCHITECTURE sections (entities, business_rules, permissions,
#     dependencies, integrations) → Architecture Authority owns. Change via
#     CR MAJOR + Authority approval.
#   - IMPLEMENTATION section → DEV agent (agent-dev-garage-mobile) owns. Append
#     per wave when adding pages/components/stores/queries. No CR needed for
#     append-style updates within boundary; in-place edits to existing items
#     require wave_history annotation.
#   - waves[] + execution_history[] → DEV agent appends per wave (immutable
#     past entries; new wave entry per spin).
#
# SYNC RULE: Service repo `garage-mobile/.knowledge-graph.yaml` mirrors this
# file 1:1 (per CR-002). No template, no separate schema.
# =============================================================================

metadata:
  type: knowledge-graph
  artifact_kind: knowledge-graph
  status: ACTIVE
  version: 14
  last_reviewed: "2026-07-01"
  tier: T2
  owner_authority: Architecture Authority
  project: "GMS Garage"
  boundary: "garage-mobile"
  service: "garage-mobile"
  stack: "mobile"
  owner: "agent-dev-garage-mobile"
  hld_ref: "Architecture/hld/garage-mobile-HLD.md"
  architecture_refs:
    ui_label_map: "Execution/knowledge-graphs/garage-mobile-ui-label-map.yaml"
    apis_produced:
      - "WebView JavaScript bridge: `FlutterChannel`, `PaymentChannel`, `AuthChannel` để payment/auth pages nhúng trong WebView gửi message và callback vào app."
      - "WebView callback/deep-link handlers: `app://*`, `payment/ipn`, `oauth/*`, `auth/*` được intercept trong `CreditCardPaymentPage` để app xử lý redirect/payment result."
      - "Native call/runtime bridge: MethodChannel `com.cometchat.sampleapp` (Android) và `com.cometchat.sampleapp.flutter.ios` (iOS) cho `get_initial_call_intent`, lock-screen/call actions, `saveAppSettings`, `getAppInfo`, `endCall`."
      - "Document export bridge: MethodChannel `app.documents.channel` cho `saveFileToDownloads` (Android) và `exportFileToFilesApp` (iOS)."
    apis_consumed:
      - "agg-garage-graph: Business data — home, notification, quotation, ordering, booking, inventory, service order, settlement, customer, supplier, vehicle management, OCR"
      - "agg-sso-graph: Auth — login, logout, refresh token, forgot/change password, permission/session data"
      - "garage-rest-export-api: Export PDF/image service orders, settlements"
      - "garage-rest-upload-helper: Upload/feedback helper endpoints"
      - "payment-gateway-pages: Credit-card / online payment via WebView"
      - "feedback-web-portal: Survey/feedback form via WebView per tenant subdomain"
      - "Firebase: Messaging (push), Remote Config (force-update), Crashlytics, Analytics"
      - "CometChat: Realtime chat, unread count, audio/video call, push token registration"
      - "APNs / PushKit / CallKit: iOS notification + VoIP + incoming-call UX"
    events_produced:
      - "PushTokenRegistrationRequested: App đăng ký FCM/APNs token lên agg-sso-graph (`saveToken`) và CometChat PN registry sau notification bootstrap."
      - "LocalNotificationDisplayed: App chuyển push payload foreground/background thành local notification kèm tap payload để replay điều hướng và mark-as-read."
      - "IncomingCallUiRequested: App chuyển call payload thành PushKit/CallKit/FlutterCallkitIncoming UX và phát accept/decline/end actions về CometChat/call runtime."
      - "NotificationReadAcknowledged: App gửi `markAsRead`, `markAllAsRead`, `markAsReadPush` khi user mở hoặc xử lý notification."
      - "ConversationRefreshRequested: App broadcast `GlobalEvent.conversationsStream` sau forward/gửi media để đồng bộ lại màn conversations."
      - "PurchaseRequestRefreshRequested: App broadcast `GlobalEvent.refreshPRStream` sau các flow PR detail như cancel/update để màn danh sách reload."
    events_consumed:
      - "FirebaseMessageReceived: Foreground/background/terminated push payload"
      - "LocalNotificationLaunchReplay: Terminated-state relaunch via notification tap"
      - "VoipPushWakeup: iOS PushKit/CallKit incoming call"
      - "CometChatCallOrMessageEvent: SDK chat/call runtime events"
      - "PaymentWebViewCallback: WebView payment callback URL / JS channel"
    data_models:
      - "SessionState: accessToken, idToken, refreshToken, identifier, deviceId, cometChatToken, subdomain"
      - "TenantContextSnapshot: BusinessInfoResponse + tcConfirmed from AppPreferences"
      - "PermissionSnapshot: policyClientGetPermissions → PermissionGuard, Widget.withPermission"
      - "FeatureFlagSnapshot: GraphQL feature flags + .ff_cache fallback"
      - "PaymentFeatureGateSnapshot: KEY_PAYMENT_QR + KEY_SUPPORTED_PAYMENT_QR gate"
      - "DashboardSnapshot: StatsData, SpendingOverview, SpendingChart, DashboardRealtime"
      - "NotificationCallBootstrapState: Persisted firebase payload + SessionId/callType hints"
      - "VehicleRecognitionDraft: Resized image + attachmentUrl + OCR payload"
      - "PaymentWebViewSession: paymentUrl + URL callback + JS channel messages"

# =============================================================================
# ARCHITECTURE (Architecture Authority owned — change via CR MAJOR)
# =============================================================================

entities:
  - name: "SessionState"
    type: "value_object"
    description: "AppPreferences giữ accessToken, idToken, refreshToken, identifier, firstLoginChallenge, deviceId, CometChat token, subdomain và auth-adjacent bootstrap state."
  - name: "TenantContextSnapshot"
    type: "value_object"
    description: "BusinessInfoResponse từ getTenantInfo + tcConfirmed cache trong AppPreferences; dùng để quyết định policy-first routing và tenant-scoped runtime context."
  - name: "PermissionSnapshot"
    type: "value_object"
    description: "Snapshot từ policyClientGetPermissions; dùng cho PermissionGuard, Widget.withPermission và action-level checks."
  - name: "FeatureFlagSnapshot"
    type: "value_object"
    description: "Feature flags từ GraphQL API, cache trong memory + .ff_cache; quyết định bật/tắt CRM, inventory, HRM, direct purchase, dashboard, vehicle management..."
  - name: "PaymentFeatureGateSnapshot"
    type: "value_object"
    description: "KEY_PAYMENT_QR + KEY_SUPPORTED_PAYMENT_QR được tính từ getEnablePaymentMethodMobile(appName, currentVersion) để gate QR/card payment UX."
  - name: "DashboardSnapshot"
    type: "value_object"
    description: "StatsData, SpendingOverview, SpendingChart và DashboardRealtime cho màn hình Trang chủ."
  - name: "NotificationCallBootstrapState"
    type: "value_object"
    description: "Persisted firebase payload + SessionId/callType + local notification launch hints để rehydrate notification/chat/call flows ở foreground/background/terminated state."
  - name: "VehicleRecognitionDraft"
    type: "value_object"
    description: "Ảnh camera/gallery đã resize + attachmentUrl + OCR payload để tự động điền VIN/thông tin xe."
  - name: "PaymentWebViewSession"
    type: "value_object"
    description: "paymentUrl + URL callback + JavaScript channel messages cho PRE_PAID_CC trong WebView."

business_rules:
  - id: BR-PULSE-MOBILE-001
    description: "Business/auth/session flow mới phải bám baseline GraphQL-primary; REST chỉ là bounded exception cho upload/export/helper đã được HLD/ADR chấp thuận."
    cornerstone: true
    enforcement_point: "GraphQLServiceBase + GraphQLService + GraphQLSSOService + ApiService + repository layer"
  - id: BR-PULSE-MOBILE-002
    description: "401/Unauthorized phải đi qua refresh-token flow tập trung; ad-hoc token retry hoặc bỏ qua logout forbidden."
    cornerstone: true
    enforcement_point: "GraphQLServiceBase._handleGraphQLResponse + _refreshOrWait()"
  - id: BR-PULSE-MOBILE-003
    description: "Permission-gated route/widget/action forbidden nếu không khớp snapshot từ policyClientGetPermissions."
    cornerstone: true
    enforcement_point: "PermissionGuard + PermissionWidgetX + AppPreferences.permissionsLocal"
  - id: BR-PULSE-MOBILE-004
    description: "V1/V3 flow selection forbidden nếu hardcode theo build; phải resolve bằng feature flags runtime (sales, direct purchase, inventory, CRM, HRM, vehicle management...)."
    cornerstone: true
    enforcement_point: "AppFeatureFlag + ServiceOrderResolver + MissionFunctionWidget"
  - id: BR-PULSE-MOBILE-005
    description: "Expose Payment QR/credit flow forbidden khi backend toggle hoặc minimum app version chưa cho phép."
    cornerstone: true
    enforcement_point: "MainCubit.getEnablePaymentMethodMobile + AppPreferences"
  - id: BR-PULSE-MOBILE-006
    description: "Mark payment success chỉ từ UI optimism hoặc local state forbidden; phải chờ payment callback URL hoặc JavaScript channel response trong WebView."
    cornerstone: true
    enforcement_point: "CreditCardPaymentPage + purchase request/order detail cubits"
  - id: BR-PULSE-MOBILE-007
    description: "Vehicle OCR source-of-truth local-only forbidden; app phải upload attachment rồi dùng backend OCR response để điền dữ liệu."
    cornerstone: true
    enforcement_point: "VehicleInfoRecognizerCubit + MediaRepository.uploadImage + MediaRepository.ocrUploadWithoutFile"
  - id: BR-PULSE-MOBILE-008
    description: "Offline mutation flow forbidden; repo hiện tại là online-first operational app."
    cornerstone: true
    enforcement_point: "AppCheckInternetService + GraphQLServiceBase._execute"
  - id: BR-PULSE-MOBILE-009
    description: "Feature/module mới trên mobile phải chứng minh giá trị phone-context; không lấy desktop parity với Web GMS làm baseline kiến trúc."
    cornerstone: true
    enforcement_point: "PRD/HLD review + mobile feature design review"
  - id: BR-PULSE-MOBILE-010
    description: "Feature page không được gọi trực tiếp native push/call APIs; phải đi qua FirebaseNotificationManager, ApnsNotificationManager, VoipNotificationManager hoặc wrapper tương đương."
    cornerstone: true
    enforcement_point: "notification/call manager layer + code review"
  - id: BR-PULSE-MOBILE-011
    description: "Bypass policy/T&C confirmation forbidden; session chỉ được vào luồng vận hành sau khi tenant auth state xác nhận `tcConfirmed = true`."
    cornerstone: true
    enforcement_point: "ProfileRepository.getTenantInfo + AppPreferences.TC_AUTH + AppCubit.onTcNotYetAuthenticated + PolicyFirstCubit.tcDataPrivacyConfirmed"
  - id: BR-PULSE-MOBILE-012
    description: "Cho phép user tiếp tục vào operational flow khi Remote Config yêu cầu update forbidden; app phải hard-gate tại boot và redirect sang store link tương ứng."
    cornerstone: true
    enforcement_point: "AppVersionManager.shouldUpdate + AppCubit.openApp + App.showUpdateVersionDialog"
  - id: BR-PULSE-MOBILE-013
    description: "Bỏ qua firstLoginChallenge forbidden; user phải hoàn tất firstChangePassword trước khi vào policy-first hoặc main shell."
    cornerstone: true
    enforcement_point: "AuthRepository.login + LoginCubit.firstLoginChallenge + ProfileRepository.firstChangePassword"

permissions:
  model: "App Garage là internal operational channel; quyền thực tế lấy từ permission snapshot và backend authorization, không cố định theo một static role matrix duy nhất ở client."
  roles:
    - actor: "garage-staff"
      access: "Varies per permission snapshot"
      scope: "Các module được cấp qua permission snapshot: booking, purchaseRequest, purchaseOrder, quotation, serviceOrder, employee, customerServiceChat, role..."
      enforcement: "PermissionGuard + Widget.withPermission + backend auth"
    - actor: "authenticated-user"
      access: "READ_WRITE"
      scope: "Profile, notifications, chat state, device token registration và dashboard cá nhân"
      enforcement: "SSO token + app session state"
  multi_tenancy:
    scope_field: "JWT custom:sub_domain + backend tenant context"
    enforcement_point: "AppPreferences.saveIdToken(parseJwt) + server-side authorization"

dependencies:
  outbound:
    - boundary: "agg-sso-graph"
      type: "graphql"
      endpoints: ["F.graphQLSSOUrl"]
      purpose: "Login/logout/refresh token, forgot/change password, save device token, CometChat auth token, delete user và SSO-adjacent session flows"
    - boundary: "agg-garage-graph"
      type: "graphql"
      endpoints: ["F.graphQLUrl"]
      purpose: "Tenant/profile context, feature flags, dashboard, notifications, quotation, purchase, booking, service order, inventory, customer, supplier, employee, vehicle management, settlement, uploadAttachment và OCR"
    - boundary: "garage-rest-export-api"
      type: "rest"
      endpoints: ["F.apiUrl + /api/v2/service-orders/{id}/export-pdf", "F.apiUrl + /api/v2/service-orders/{id}/export-image", "F.apiUrl + /api/v1/settlements/{id}/export-pdf"]
      purpose: "Bounded REST exception cho export PDF/image tài liệu nghiệp vụ"
    - boundary: "garage-rest-upload-helper"
      type: "rest"
      endpoints: ["F.apiUrlNoAuth + /upload"]
      purpose: "Bounded REST exception cho feedback upload/helper endpoint"
    - boundary: "payment-gateway-pages"
      type: "webview"
      endpoints: ["paymentUrl opened via WebView", "payment/ipn callback"]
      purpose: "Credit-card / online payment flow cho purchase request / order"
    - boundary: "feedback-web-portal"
      type: "webview"
      endpoints: ["F.urlFeedback(subdomain)"]
      purpose: "Survey/feedback form nhúng bằng WebView theo tenant subdomain"
    - boundary: "Firebase"
      type: "sdk"
      endpoints: ["FCM token/device messaging", "Remote Config fetch", "Crashlytics/Analytics SDK"]
      purpose: "Push notification, force-update/version control, crash reporting, analytics"
    - boundary: "CometChat"
      type: "sdk"
      endpoints: ["Chat/Call SDK APIs + push token registration"]
      purpose: "CSKH chat, purchase chat, audio/video call"
    - boundary: "APNs / PushKit / CallKit"
      type: "native"
      endpoints: ["iOS notification + VoIP delivery"]
      purpose: "iOS foreground/background notification và incoming call experience"
  inbound:
    - boundary: "garage-staff-devices"
      type: "ui"
      endpoints_exposed: ["Flutter app, portrait-only UI"]
      sla: "Repo hiện tại mô hình online-first; notification/chat/payment responsiveness phụ thuộc GraphQL, Firebase/APNs và CometChat."

integrations:
  - name: "GraphQLServiceBase"
    type: "client"
    purpose: "GraphQL transport, auth header, refresh token single-flight, network guard, retry và shared Hive cache"
    config_ref: "GraphQLService + GraphQLSSOService"
  - name: "ApiService"
    type: "rest-client"
    purpose: "REST helper bounded exception cho upload/export/non-GraphQL endpoint"
    config_ref: "Dio + Retrofit + interceptors"
  - name: "Firebase Messaging"
    type: "broker"
    purpose: "Push notification Android + bridge với local notifications"
    config_ref: ".firebase/*/google-services.json + GoogleService-Info.plist"
  - name: "Firebase Remote Config"
    type: "runtime-gate"
    purpose: "Cưỡng bức update version theo env key garage_<env>_version"
    config_ref: "AppVersionManager + F.appVersionRemoteConfigKey"
  - name: "Firebase Crashlytics / Analytics"
    type: "broker"
    purpose: "Crash reporting + app analytics"
    config_ref: "Firebase.initializeApp()"
  - name: "CometChat"
    type: "broker"
    purpose: "Realtime conversation, group chat, unread count, call events và push token registration"
    config_ref: "CometChatConfig.appId/region/authKey/providerId"
  - name: "LocalNotificationManager"
    type: "runtime-bridge"
    purpose: "Hiển thị local notification, replay launch payload và route user theo tap payload"
    config_ref: "start() + LocalNotificationManager.handleNotificationTap"
  - name: "VoipNotificationManager"
    type: "runtime-bridge"
    purpose: "Restore incoming-call UX cho Android/iOS background/terminated/lock-screen state"
    config_ref: "VoipNotificationManager + flutter_callkit_incoming"
  - name: "ApnsNotificationManager"
    type: "runtime-bridge"
    purpose: "iOS APNs/PushKit/CallKit bridge cho notification và incoming-call flow"
    config_ref: "ApnsNotificationManager + AppDelegate native bridge"
  - name: "Android call/notification intent runtime"
    type: "runtime-bridge"
    purpose: "Full-screen incoming call, accept/decline/end flow và lock-screen behavior trên Android"
    config_ref: "AndroidManifest.xml + MainActivity.kt + receivers/services"
  - name: "App Store Connect + Google Play"
    type: "broker"
    purpose: "Phân phối app production và update path cho người dùng"
    config_ref: "flavor bundle/applicationId + store links"

# =============================================================================
# IMPLEMENTATION (DEV agent owned)
# Stack: Mobile (Flutter 3 + Dart 3 + flutter_bloc/Cubit)
# Owner: agent-dev-garage-mobile
