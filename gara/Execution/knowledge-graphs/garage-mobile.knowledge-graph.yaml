implementation:

  # --- 1. TYPES — Client-side Dart types ---
  # Format:
  #   TypeName:
  #     source: "GraphQL → queryName" | "REST → endpoint" | "local"
  #     fields: [field1, field2, ...]
  types:
    # --- W03 Inventory Catalog (BUG-W03-014 fix 2026-07-01) ---
    MaterialGroup:
      source: "GraphQL → searchMaterialGroups (list) / getMaterialGroup (detail)"
      fields: ["id", "code", "name", "description", "status: MaterialGroupStatus", "parentId", "parentName", "createdAt", "createdBy", "createdByName", "updatedAt", "updatedBy", "updatedByName"]
      dart_ref: "lib/core/models/inventory_catalog/material_group_models.dart (MaterialGroupItem / MaterialGroupDetail)"
    InternalProduct:
      source: "GraphQL → searchInternalProducts (list) / getInternalProduct (detail)"
      fields: ["id", "code", "name", "status: InternalProductStatus", "productType", "materialGroupId", "materialGroupName", "mainUnit", "mainUnitDisplayName", "brand", "origin", "originDisplayName", "description", "specification", "createdAt", "createdBy", "createdByName", "updatedAt", "updatedBy", "updatedByName"]
      dart_ref: "lib/core/models/inventory_catalog/internal_product_models.dart (InternalProductItem / InternalProductDetail)"
    MaterialGroupStatus:
      source: "local enum"
      fields: ["active", "inactive"]
      dart_ref: "lib/core/models/inventory_catalog/material_group_status.dart — INACTIVE badge = ORANGE (bgBadgeWarning), khác InternalProductStatus (M-trap-3)"
    InternalProductStatus:
      source: "local enum"
      fields: ["active", "inactive"]
      dart_ref: "lib/core/models/inventory_catalog/internal_product_status.dart — INACTIVE badge = GREY (bgBadgeOpen/textSecondary), khác MaterialGroupStatus (M-trap-3)"

  # --- 2. PAGES — Routes + permission-gating + dependencies ---
  # Format:
  #   page-name:
  #     route: "/path"
  #     roles: [ROLE_1, ROLE_2]
  #     cubit: cubit_name
  #     features: [feature1, feature2]
  pages:
    # Bootstrap & Auth
    splash:
      route: "/"
      roles: ["authenticated-user", "garage-staff"]
      description: "Boot screen — kiểm tra force-update, persisted auth/tc state, feature flags rồi route về login hoặc main; policy-first được kích hoạt từ login flow khi tenant chưa confirm"
    login:
      route: "/login"
      roles: ["authenticated-user"]
      description: "SSO login với phone/password"
    forgot-password:
      route: "/forgot-password"
      roles: ["authenticated-user"]
      description: "Container cho luồng quên mật khẩu — phone number → OTP → create new password"
    phone-number:
      route: "/forgot-password/phone-number"
      roles: ["authenticated-user"]
      description: "Nhập số điện thoại/identifier để khởi tạo forgot password flow"
    create-new-password:
      route: "/forgot-password/create-new-password"
      roles: ["authenticated-user"]
      description: "Nhập mật khẩu mới sau khi OTP hợp lệ"
    otp:
      route: "/forgot-password/otp"
      roles: ["authenticated-user"]
      description: "Nhập OTP xác thực cho forgot password flow"
    change-password:
      route: "/change-password"
      roles: ["authenticated-user"]
      description: "Đổi mật khẩu khi firstLoginChallenge"
    change-user-password:
      route: "/change-user-password"
      roles: ["garage-staff"]
      description: "Đổi mật khẩu user từ profile"
    policy-first:
      route: "/policy-first"
      roles: ["garage-staff"]
      description: "Policy/T&C gate trước khi vào main shell"
    ecommerce-confirmed:
      route: "/ecommerce-confirmed"
      roles: ["garage-staff"]
      description: "Xác nhận tham gia thương mại điện tử"

    # Main Shell
    main:
      route: "/main"
      roles: ["garage-staff"]
      description: "Main shell với PersistentTabView: Trang chủ, Chat, Hỏi giá, Thông báo, Tài khoản"
      guard: "AuthGuard"

    # Home / Dashboard
    home:
      route: "/home"
      roles: ["garage-staff"]
      description: "Dashboard — StatsData, SpendingOverview, SpendingChart, DashboardRealtime"

    # Quotation
    create-quotation:
      route: "/create-quotation"
      roles: ["garage-staff"]
      description: "Tạo yêu cầu báo giá (ask quotation), gồm invoice request section với form chi tiết khi purchasePurchaseV02 bật"
      label_maps:
        - screen_id: "quotation-create-invoice-request"
          route: "/create-quotation"
          label_map_ref: "Execution/knowledge-graphs/garage-mobile-ui-label-map.yaml"
          source_status: "implemented"
          graphql_operations: ["QuotationAskTenantInvoiceInfo", "CreateQuotationAsk", "CreateQuotationAskV3", "CreateSalesQuotationAsk"]
          labels:
            - section: "invoice_request"
              ui_label: "Yêu cầu xuất hóa đơn"
              ui_element: "checkbox_label"
              label_kind: "form_control"
              source_kind: "i18n"
              source_file: "lib/ui/quotation/create_quotation/create_quotation_page.dart"
              graphql: { operation: null, variable_path: null, response_path: null, enum_value_path: null }
              product_note: null
          dynamic_label_sources:
            - "Invoice company fields can be prefilled and locked from QuotationAskTenantInvoiceInfo response."
            - "When purchasePurchaseV02 is off, createQuotation strips invoice detail fields and only preserves isInvoiceRequired in legacy flow."
          gaps:
            - "Vehicle selectors, spare-part rows, catalog suggestions, app bar title, and submit CTA are outside this invoice-focused label map."
    request-quote-list:
      route: "/request-quote-list"
      roles: ["garage-staff"]
      description: "Danh sách yêu cầu báo giá"
    request-quote-list-search:
      route: "/request-quote-list/search"
      roles: ["garage-staff"]
    request-quote-list-filter:
      route: "/request-quote-list/filter"
      roles: ["garage-staff"]
    quotation-detail:
      route: "/quotation-detail"
      roles: ["garage-staff"]
      description: "Chi tiết báo giá + chat + lịch sử cập nhật"
    history-update-quotation:
      route: "/history-update-quotation"
      roles: ["garage-staff"]

    # Ordering / Purchase
    list-order:
      route: "/list-order"
      roles: ["garage-staff"]
      description: "Danh sách purchase order V1"
    list-order-v3:
      route: "/list-order-v3"
      roles: ["garage-staff"]
      description: "Danh sách purchase order V3"
    search-list-order:
      route: "/search-list-order"
      roles: ["garage-staff"]
    search-list-order-v3:
      route: "/search-list-order-v3"
      roles: ["garage-staff"]
    list-order-filter:
      route: "/list-order-filter"
      roles: ["garage-staff"]
    order-detail:
      route: "/order-detail"
      roles: ["garage-staff"]
      description: "Chi tiết purchase order V1"
    order-detail-v3:
      route: "/order-detail-v3"
      roles: ["garage-staff"]
      description: "Chi tiết purchase order V3"
    marketplace-order-detail:
      route: "/marketplace-order-detail"
      roles: ["garage-staff"]
    create-new-order:
      route: "/create-new-order"
      roles: ["garage-staff"]
      description: "Tạo purchase request / direct purchase order"
    cart:
      route: "/cart"
      roles: ["garage-staff"]
      description: "Giỏ hàng spare parts"
    confirm-order:
      route: "/confirm-order"
      roles: ["garage-staff"]
      description: "Xác nhận đặt hàng"
    create-new-product:
      route: "/create-new-product"
      roles: ["garage-staff"]
      description: "Tạo sản phẩm mới trong order"
    spare-part-selection:
      route: "/spare-part-selection"
      roles: ["garage-staff"]
      description: "Chọn spare part từ catalog"
    credit-card-payment:
      route: "/credit-card-payment"
      roles: ["garage-staff"]
      description: "Thanh toán credit card qua WebView"
    list-purchase-request:
      route: "/list-purchase-request"
      roles: ["garage-staff"]
      description: "Danh sách purchase request"
    list-purchase-request-search:
