  - { date: "2026-07-03", summary: "PERFORMANCE (round-3 follow-up cho V2-1 material-groups/search sau khi user yêu cầu review perf): sau khi ship DFS multi-level ở round-2, phát hiện N+1 nghiêm trọng còn tồn tại ở phase build response — `MaterialGroupService.toResponse()` gọi 2 count query per row (`repository.countByTenantIdAndParentId` + `productRepository.countByTenantIdAndMaterialGroupId`); loop trên `pageRows` (max page.size=100) → worst-case 201 query/request. N+1 này có từ trước round-1 (BR pattern per-row), không do fix ordering gây ra. Fix: (A) childCount lấy trực tiếp từ `byParent` in-memory map (`byParent.getOrDefault(e.getId(), List.of()).size()`) — 0 query mới, tận dụng tree đã load full ở phase DFS; đúng số vì mọi child hợp lệ của e đều có parentId=e.id và e ở trong byId. (B) productCount BATCH bằng 1 GROUP BY query: thêm `JpaInternalProductRepository.countByTenantIdAndMaterialGroupIdInGrouped(tenantId, ids)` return `List<Object[]>` (mỗi element `[materialGroupId, count]`, nhóm không có sản phẩm không xuất hiện → caller default 0 qua getOrDefault); `search()` sau slice pageRows gọi 1 lần với `pageIds`, build `Map<Long, Long>`, `toResponse` overload mới (5-arg) nhận count đã tính sẵn. Overload 3-arg cũ giữ cho `get()`/`create()`/`update()` (1 row, không N+1) — internally delegate sang overload 5-arg sau khi query 2 count cho 1 row đó. Ids rỗng short-circuit `Map.of()` để tránh SQL `IN ()` invalid. Kết quả: tổng query/request từ **201 → 2** (1 load tree + 1 batch product count), latency giảm ~90-95% trên hot path (default list, no filter, page 20-100 rows). Test: thêm 2 test mới — `search_batchesProductCountInSingleQuery_notPerRow` (3 group trên page → verify `countByTenantIdAndMaterialGroupIdInGrouped` gọi đúng 1 lần với captor set {1,2,3}, single-count method `countByTenantIdAndMaterialGroupId` KHÔNG được gọi; nhóm không xuất hiện trong batch result → response productCount=0 default), `search_populatesChildCountFromInMemoryTree_notPerRowQuery` (R có 3 children → response R.childCount=3, leaves childCount=0, `countByTenantIdAndParentId` KHÔNG được gọi ở search path). 5 test search cũ round-2 giữ xanh — Mockito default return empty List cho `countByTenantIdAndMaterialGroupIdInGrouped` un-stubbed nên không cần thêm stub. Out-of-scope note: `search()` vẫn không enforce cap 1000 như `tree()` (`tree()` throw 413 nếu >1000 qua countByTenantId trước khi build; `search()` load thẳng) — với data drift, tenant vượt cap sẽ load nhiều rows silent; follow-up riêng nếu cần enforce/native CTE cho tenant lớn. GOTCHA: khi build endpoint list trả DTO có aggregate count qua N sub-resource (childCount/productCount/...), MẶC ĐỊNH pattern per-row là N+1 ngầm — phải batch qua GROUP BY (return List<Object[]> với PK+count) hoặc `SELECT ... FROM ... GROUP BY` returning `Tuple`/interface projection ngay từ round-1 endpoint, đừng để nợ perf tích tụ.", author: "Main agent — V2-1 material-groups/search N+1 batch productCount + in-memory childCount 2026-07-03 v3" }
  - { date: "2026-07-03", summary: "BUGFIX (round-2 follow-up cho fix ordering V2-1 material-groups/search dưới cùng ngày, theo user báo \"miss trường hợp sắp xếp con của con\"): approach round-1 dùng `LEFT JOIN` self + `COALESCE(p.createdAt, g.createdAt) DESC` + `CASE parentId NULL 0/1` tiebreaker CHỈ đúng với cây 2 tầng (root + children). Với ≥3 tầng, LEFT JOIN chỉ lookup 1 hop → group key của grandchild G = `p.createdAt` (createdAt của C, cha trực tiếp), không phải createdAt của root ancestor R. Ví dụ bug: R (T1=2026-06-01), C con R (T2=2026-01-01), G con C (T3=2026-03-01), R2 root khác (T2.5=2026-02-01, T2<T2.5<T1) → query cũ trả `R, C, R2, G` — G bị chèn giữa R2, tách khỏi ancestor chain. Đúng ra phải DFS preorder: `R, C, G, R2`. Fix: REVERT query `LEFT JOIN + COALESCE + countQuery` khỏi `JpaMaterialGroupRepository.search()` (xoá method hoàn toàn — không consumer nào khác dùng, dọn cho sạch); REWRITE `MaterialGroupService.search()` sang **service-side DFS**: load full tenant tree bằng `findAllByTenantIdOrderByParentIdAscDisplayOrderAscIdAsc` (đã có sẵn từ tree()), build `byId` map + `byParent` map, sort roots + mọi list children theo `Comparator.comparing(createdAt).reversed().thenComparing(id)`, DFS stack-based preorder (push children ngược để pop đúng thứ tự DESC) với `visited` set defensive chống stack-overflow nếu cycle data-drift, áp filter row-level SAU DFS (giữ semantic strict: status/keyword/parentIdProvided), slice pagination trên list đã sort. Loại N+1 parentLookup cũ vì `byId` map đã có sẵn parent entity. Orphan (parentId trỏ id không tồn tại) surface as root cùng roots hợp lệ (giống tree()). Contract API GIỮ NGUYÊN — `Page<MaterialGroupResponse>` với `page.totalElements` = tổng row (không phải tổng cha), `content` là subarray đã DFS-sort. Test rewrite hoàn toàn: xoá 3 test wiring cũ (`search_passesNullStatusToRepository_whenStatusOmitted`/`search_filtersByExplicitActiveStatus`/`search_filtersByExplicitInactiveStatus` — service không còn pass status xuống repository.search, đổi assertion sang test HÀNH VI: kết quả filter đúng theo status), xoá 2 test round-1 (`search_preservesRepositoryOrdering_parentClustered`/`search_keepsParentBeforeChild_evenWhenChildIsNewerThanParent` — vì service không còn preserve repo order mà tự sort), thêm 8 test mới với helper `mg(id, code, parentId, createdAt, status?)` set createdAt qua `AuditableEntity.setCreatedAt()`: `search_returnsBothActiveAndInactive_whenStatusOmitted` (BUG-W03-032), `search_filtersByExplicitActiveStatus`/`search_filtersByExplicitInactiveStatus` (behavior-level), `search_ordersRootsDescAndClustersChildrenBelowEachRoot` (2 tầng basic C/C1/C2/B/B1/A/A1), `search_keepsParentBeforeChild_evenWhenChildIsNewerThanParent` (P2 > P1 nhưng C1 con P1 mới nhất DB → order P2/P1/C1), `search_ordersGrandchildImmediatelyAfterChild_notPushedAcrossRootBoundary` (**test pin bug round-2**: R/C/G/R2 với timestamp giao thoa), `search_siblingsAtEachLevelSortByCreatedAtDesc` (R có C_new/C_old, C_new có G_new/G_old → R/C_new/G_new/G_old/C_old), `search_paginatesFlatOrderedList_size3` (page 0 size 3 lấy đầu list, page 1 lấy giữa), `search_surfacesOrphanChildAsRoot_whenParentMissing`. Perf: chi phí bằng hoặc thấp hơn round-1 (bớt N+1 parentLookup), bounded MAX_TREE_NODES=1000 → < 10ms. GOTCHA cho search endpoint hierarchical tương lai: nếu cây > 2 tầng, KHÔNG dùng LEFT JOIN self + COALESCE 1 hop — cần recursive CTE hoặc service-side DFS load full tree; với domain có cap kích thước tree, service-side đơn giản hơn + tiện loại N+1 parent lookup + nhất quán pattern với endpoint tree() sẵn có.", author: "Main agent — V2-1 material-groups/search DFS multi-level rewrite 2026-07-03 v2" }
  - { date: "2026-07-03", summary: "FEATURE (theo yêu cầu trực tiếp user cho V2-1 `POST /api/v2/material-groups/search`, không phải BR-sourced): đổi ordering từ **flat** (`parentId ASC NULLS FIRST, displayOrder, id`) sang **parent-clustered** — nhóm cha (parentId=NULL) sắp theo `createdAt DESC` (mới nhất lên đầu), nhóm con luôn hiển thị **ngay bên dưới cha tương ứng**, không xen sang cụm cha khác. Implementation ở `JpaMaterialGroupRepository.search()`: thêm `LEFT JOIN MaterialGroupEntity p ON g.parentId = p.id AND p.tenantId = :tenantId`, đổi `ORDER BY COALESCE(p.createdAt, g.createdAt) DESC, CASE WHEN g.parentId IS NULL THEN 0 ELSE 1 END ASC, g.displayOrder ASC, g.id ASC` — với hàng cha COALESCE lấy chính `g.createdAt` = với `p.createdAt` của các con dưới cụm nên toàn cụm chia sẻ cùng group key; CASE tiebreaker ép cha lên trước con. `p.tenantId = :tenantId` trong ON không leak parent xuyên tenant. Thêm `countQuery` tách riêng (không JOIN, không ORDER BY — filter không đụng cột từ `p`) để Spring Data JPA sinh count đúng + tiết kiệm chi phí. Service layer `MaterialGroupService.search()` KHÔNG đổi — vẫn nhận `Page<MaterialGroupEntity>` rồi build `parentLookup` để trả `parentName` (N+1 hiện hữu ≤ page.size distinct parentIds — không do fix này gây ra, gạch cho refactor riêng nếu muốn dùng chính `p` từ JOIN). Decision với user: **pagination row-level giữ nguyên** (page.size = tổng cha + con) → children của cùng 1 cha có thể chia trang khi vượt size; FE có thể tăng size (max 100) nếu cần cụm trọn 1 trang. **Filter (keyword/status/parentId) áp strict row-level** — không tự kéo cha context về nếu chỉ con match, giữ hành vi cũ. Edge case orphan child (parentId trỏ nhóm không tồn tại): `LEFT JOIN` → `p` NULL → COALESCE dùng `g.createdAt` chính con; con nổi theo createdAt của chính nó (giống `tree()` xử lý orphan). Test: `MaterialGroupServiceTest.search_preservesRepositoryOrdering_parentClustered` — mock repository trả C/C1/B/B1/A/A1 theo thứ tự mới, verify service preserve nguyên thứ tự + `parentName` đúng cha ngay trên con. 3 test search cũ (`search_passesNullStatusToRepository_whenStatusOmitted`/`search_filtersByExplicitActiveStatus`/`search_filtersByExplicitInactiveStatus`) vẫn xanh (không đổi contract repository method). Perf: LEFT JOIN self trên `p.id` (PK) → 1 statement, 1 in-memory sort ≤ 1000 rows (`MAX_TREE_NODES` cap của domain — [MaterialGroupService.java:47]); tận dụng `idx_material_group_parent` sẵn có; không cần index mới. GOTCHA cho search endpoint tương lai muốn parent-clustered: pattern `LEFT JOIN self ON parentId + COALESCE(p.timeCol, g.timeCol)` + tiebreaker `CASE parentId NULL` là cách clean nhất giữ cha+con cùng cụm trong 1 statement, hơn CTE recursive; Spring Data JPA yêu cầu `countQuery` tách riêng khi @Query có JOIN + ORDER BY expression.", author: "Main agent — V2-1 material-groups search parent-clustered ordering 2026-07-03" }
  - { date: "2026-07-03", summary: "REFACTOR (theo yêu cầu user, không đổi behavior): tách `CatalogDtos.java` (570 dòng, 28 inner static class) thành 28 top-level `.java` riêng, gom vào 2 subpackage `com.actechx.gf.app.dto.catalog.request` (15 class DTO client gửi lên) + `com.actechx.gf.app.dto.catalog.response` (13 class DTO backend trả về). Xóa outer wrapper `CatalogDtos.java`. 14 consumer file update import: 11 file dùng wildcard đổi `import com.actechx.gf.app.dto.catalog.CatalogDtos.*` → 2 dòng `import ...request.*` + `import ...response.*`; 3 file cụ thể (`InternalProductExportService`/`InternalProductExportServiceTest` cho `InternalProductSearchRequest`, `SkuSearchController`/`SkuSearchService` cho `SkuSearchResultItem`) đổi FQCN sang subpackage. Không đổi tên class, tên field, validation annotation — JSON contract giữ nguyên nên FE/BFF/agg-garage-graph không bị ảnh hưởng. Sync 2 mirror `garage-agentic-design/services/gf-inventory/...` (design repo có full 435 Java source mirror). Test suite PASS toàn bộ.", author: "Main agent — CatalogDtos split by request/response 2026-07-03" }
  - { date: "2026-07-03", summary: "FEATURE (theo yêu cầu trực tiếp user): API `PUT /api/v2/internal-products/{id}` (V2-11) mở rộng nhận thêm 3 collection trong body — `initialProducts` (SKU mappings), `initialConversionUnits` (conv unit list), `attachments` — mỗi item áp diff-by-id: có `id` khớp DB = update tại chỗ; không `id` = insert mới; DB row không xuất hiện trong payload = delete. Semantic phân biệt `null` payload (giữ nguyên collection) vs `[]` (xóa hết). Toàn bộ chạy trong 1 `@Transactional` — nếu bất kỳ item cần xóa mà đã phát sinh giao dịch → throw `CatalogException(PRODUCT_HAS_TRANSACTIONS)` rollback tất cả (BR-CAT-PROD-012 conv unit + BR-CAT-PROD-014 SKU mapping). SKU delete guard resolve SKU string từ `product` table qua `productRepository.findAllByTenantIdAndIdInAndIsDeletedFalse` rồi check `inventoryTransactionRepository.existsByTenantIdAndSkuIn`; conv unit dùng `hasActivity(tenantId, internalProductId)` sẵn có làm proxy (BR-CAT-PROD-012) vì `inventory_transaction` key theo SKU string, không lưu `unit_code`. Update conv unit chỉ set `conversionRate` (unitCode immutable); update attachment chỉ set `fileName` + `attachmentKind` (nội dung file immutable per R31 — reject nếu client cố đổi `fileUrl`/`fileType`/`fileSizeBytes`). Ordering delete→flush→insert để tránh vi phạm unique `(tenant_id, internal_product_id, unit_code)` khi user vừa xóa vừa thêm cùng `unitCode`. Reuse `persistAttachment()` cho insert (giữ nguyên cap 5 file / 30MB / MIME whitelist). Reuse `addConversionUnit(entity, req, seenUnits)` cho conv unit insert (giữ nguyên rate>0 + precision≤6). Reuse `mapSku(entity, productId)` cho SKU insert (giữ nguyên guard sku-already-mapped). DTO: `InternalProductUpdateRequest` (CatalogDtos.java) thêm 3 field + 3 upsert class mới (`SkuMappingUpsertRequest`/`ConversionUnitUpsertRequest`/`AttachmentUpsertRequest`) — mỗi upsert có `id` nullable + payload fields; validation `@NotBlank`/`@NotNull` giống Create DTO. KHÔNG đụng schema DB, KHÔNG đụng 6 sub-resource endpoint hiện có (V2-13..V2-19 vẫn hoạt động song song cho import flow + FE cũ). Test: `InternalProductServiceTest` thêm 15 test mới cho 3 collection × 4 scenario (insert/update/delete/no-touch) + cross-cutting (delete guard SKU-has-tx / conv-unit-product-has-activity / unit-code-change-rejected / attachment-content-change-rejected / unknown-id → 404). GOTCHA: nếu tenant-level unique `(tenant_id, product_id)` bị vi phạm khi user delete SKU-A rồi insert SKU-A cùng request, flush cần chèn giữa 2 phase (đã làm cho cả 3 helper). GOTCHA-2: `hasActivity()` là product-level proxy → conv unit delete-guard sẽ TỪ CHỐI delete conv unit khi product có bất kỳ giao dịch nào, dù giao dịch đó không dùng conv unit cụ thể; đây là trade-off an toàn (conservative). Nếu Product yêu cầu granular hơn (chỉ block conv unit đã trực tiếp dùng), cần bổ sung `inventory_transaction.unit_code` hoặc query linking sku↔unit — follow-up riêng. Cascade: `Architecture/api/gf-inventory-api.md` bump v32 → v33 R39 (V2-11 §3a.2 subsection append `R39 — Bulk sync 3 child collection (diff-by-id)` block + top-of-changelog row 2026-07-03/v33) đồng bộ 2 mirror `docs/Architecture/api/` (working) + `garage-agentic-design/Architecture/api/` (design source, byte-identical). BFF `agg-garage-graph` cần CR riêng để mở rộng mutation `updateInternalProduct` input với 3 collection field mới — chưa raise (out of scope W03 backend).", author: "Main agent — V2-11 bulk collection sync (diff-by-id) 2026-07-03" }
  - { date: "2026-07-03", summary: "CORRECTION (theo user feedback ngay sau lần sửa whitelist bên dưới — KHÔNG tự định nghĩa message dài): 3 error message dài tự viết ở lần trước (`\"Mã ... chỉ chấp nhận A-Z, a-z, 0-9, - _ . / ( ) và khoảng trắng ở giữa\"` cho MaterialGroup/InternalProduct + biến thể tương tự cho ImportService) đảo về wording chuẩn theo AC-2 spec: `\"Mã nhóm không hợp lệ\"` / `\"Mã sản phẩm không hợp lệ\"` — mã lỗi (`ERR-INV-001`/`ERR-INV-006`) + BR tham chiếu (`BR-CAT-GRP-002`/`BR-CAT-PROD-002`) đã được carry qua `CatalogException(CatalogErrorCode.GROUP_CODE_INVALID|PRODUCT_CODE_INVALID, ...)`, không cần lặp lại trong message string. Không đổi regex/behavior — chỉ đảo message. Test không cần sửa (existing test không assert nội dung message string, chỉ assert error code). GOTCHA: khi triển spec business, LUÔN đọc AC-2 chi tiết \"báo lỗi <text ngắn> (<ERR-CODE>, theo <BR-ID>)\" — parenthetical (ERR-CODE + BR-ID) là meta cho engineer, KHÔNG phải part của message hiển thị user; text ngắn trước ngoặc chính là canonical message. Đừng expand text ngắn thành spec quy tắc đầy đủ trong message (spec đã ở BR file + AC-2).", author: "Main agent — catalog code error message revert to AC-2 canonical wording 2026-07-03" }
  - { date: "2026-07-03", summary: "FEATURE (theo yêu cầu trực tiếp user, đóng nốt gap blacklist→whitelist còn tồn tại sau khi đã trim ở lần sửa dưới): 3 chỗ validate mã (`MaterialGroupService.CODE_PATTERN`, `InternalProductService.CODE_PATTERN`, `InternalProductImportService.CODE_PATTERN`) chuyển từ **blacklist** `^[^~!@#$%^&*]+$` sang **whitelist** `^[A-Za-z0-9._/() -]+$` — chấp nhận: chữ Latin không dấu (A-Z, a-z), chữ số (0-9), gạch ngang (-), gạch dưới (_), chấm (.), gạch chéo (/), ngoặc đơn ( ), khoảng trắng ở giữa; reject: tiếng Việt có dấu (`SẢN`, `NHÓM`, ...), 9 ký tự đặc biệt `~!@#$%^&*`, emoji (U+1F000+), mọi ký tự Unicode ngoài whitelist. Auto-trim đầu/cuối đã có ở lần sửa trước (`trimCode()` cho MaterialGroup/InternalProduct create; `item.setCode(code.trim())` cho import) chạy TRƯỚC khi match regex. Regex Java string chọn form `\"^[A-Za-z0-9._/() -]+$\"` (hyphen đặt cuối char class, không escape; space nằm trong class; các meta `.` `/` `(` `)` không cần escape trong `[]`). Error message: 2/3 service (MaterialGroup + InternalProduct) đổi từ \"Mã ... chứa ký tự đặc biệt không hợp lệ\" (wording blacklist) sang \"Mã ... chỉ chấp nhận A-Z, a-z, 0-9, - _ . / ( ) và khoảng trắng ở giữa\" (wording whitelist tường minh); import service đổi từ \"Mã sản phẩm không hợp lệ\" (cụt) sang cùng wording để user biết vi phạm rule gì mà không cần lookup mã lỗi. Test bổ sung cho 3 service (4 test/service × 3 = 12 test mới): `*_rejectsCodeWithVietnameseDiacritics` (input `SẢN-01`/`NHÓM-01`), `*_rejectsCodeWithBlacklistedSpecials` (loop 9 ký tự `~!@#$%^&*` — trước đây blacklist đã reject nên PASS, nay whitelist cũng reject → verify không hồi quy), `*_rejectsCodeWithEmoji` (input `SP-🚀`/`GRP-🚀`), `*_acceptsCodeWithAllWhitelistedChars` (input `SP-1_2.3/4 (a)`/`GRP-1_2.3/4 (a)` — case đủ 10 ký tự whitelist). Test cũ (`SP@@@`/`GRP@@@`) vẫn PASS vì `@` là ký tự Unicode ngoài whitelist. GAP CÒN LẠI (user chưa yêu cầu đồng bộ, theo audit trước): (1) BR-GF-INVENTORY-CATALOG.md v20 line 38 (BR-CAT-GRP-002) + line 56 (BR-CAT-PROD-002) vẫn wording blacklist \"không chứa ký tự đặc biệt (`~!@#$%^&*`)\", chưa bump v21; (2) FEAT-CAT-PROD-IMPORT.md line 140/219/244 vẫn cite blacklist \"không chứa `~!@#$%^&*`\"; (3) FEAT-CAT-GRP-CREATE.md §5 line 114 + FEAT-CAT-PROD-CREATE.md §5 line 166 rule ref cụt \"không chứa ký tự đặc biệt\" (AC-2 tường minh whitelist nhưng §5 chưa refresh); (4) knowledge-graph.yaml line 1958 column constraint text \"regex không chứa ~!@#$%^&* (ERR-INV-001)\" — 4 gap doc/KG này vẫn tồn tại, user sẽ quyết sau. (5) `@Size(max=50)` trên DTO chạy trên raw input (trước trim) — chuỗi có leading/trailing space + 50 ký tự hợp lệ sẽ bị Bean Validation reject sai; chưa fix.", author: "Main agent — catalog code blacklist→whitelist + reject Vietnamese/emoji/~!@#$%^&* (đồng bộ FEAT-CAT-GRP-CREATE v5 / FEAT-CAT-PROD-CREATE v13 AC-2) 2026-07-03" }
  - { date: "2026-07-03", summary: "PARTIAL-SYNC (theo yêu cầu trực tiếp user — chỉ đồng bộ TRIM, KHÔNG đụng blacklist→whitelist regex/max-50-after-trim/error-message theo FEAT-CAT-GRP-CREATE v5 + FEAT-CAT-PROD-CREATE v13 AC-2; các gap còn lại + BR-GF-INVENTORY-CATALOG v20 line 38/56 blacklist wording + FEAT-CAT-PROD-IMPORT.md line 140/219/244 blacklist wording + KG line 1958 constraint text + coverage gap tiếng-Việt-có-dấu/emoji/50-sau-trim tất cả vẫn TỒN TẠI, user sẽ quyết định sau): 3 chỗ validate mã (`MaterialGroupService.create()`/`update()` — code immutable so sánh với entity, `InternalProductService.create()` — code immutable trên `update()` nên không đụng, `InternalProductImportService.validateRow()`) nay `.trim()` giá trị input trước khi (a) regex-validate, (b) `existsByTenantIdAndCode`, (c) so sánh dedup `seenCodes` (import), (d) ghi vào entity.code / item.setCode. Implementation: `MaterialGroupService` + `InternalProductService` thêm helper `private static String trimCode(String)` (null-safe: null → null); dùng biến local `String code = trimCode(request.getCode())` ở đầu `create()`, truyền xuống `validateCode(code)`/`existsByTenantIdAndCode(tenantId, code)`/`.code(code)` builder. `MaterialGroupService.update()` (BR-CAT-GRP-004 code immutable) so sánh `!trimCode(request.getCode()).equals(entity.getCode())` — cho phép client resubmit \"  GRP-1  \" so với stored \"GRP-1\" mà không bị reject false-positive. `InternalProductImportService.validateRow()`: trim `item.getCode()` rồi `item.setCode(code)` để commit + echo response cùng dùng giá trị đã trim (theo pattern mutate ImportRowDto đã dùng trong file cho `mainUnitCode`/`originCode`); thêm guard `code.isEmpty()` sau trim (chuỗi toàn khoảng trắng → error) — pattern regex hiện tại `^[^~!@#$%^&*]+$` yêu cầu `+` nên empty tự fail, nhưng thêm cho tường minh + error message ổn định. GOTCHA: nếu dữ liệu HIỆN CÓ trong DB có mã lưu kèm space đầu/cuối (do CHƯA có trim trước fix này), thì client resubmit code đã trim sẽ