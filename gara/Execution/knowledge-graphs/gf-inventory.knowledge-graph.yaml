# Knowledge Graph — gf-inventory

boundary: "gf-inventory"
version: 4
last_updated: "2026-07-07"
owner_authority: "Architecture Authority"

metadata:
  purpose: "Quản lý danh mục product line/product variant, phiếu nhập kho (receipt), phiếu xuất kho (delivery), tồn kho (stock) với negative stock và optimistic locking, reservation TTL, period stock closure (WAC/COGS), warehouse lifecycle, event-driven via outbox/inbox pattern. Orchestration async qua gf-inventory-worker Temporal workflows. W03 (EP-INVENTORY-CATALOG): catalog V2 — material_group adjacency-list + internal_product với SKU mapping + UoM conversion + import/export."
  tech: { language: "Java 21", framework: "Spring Boot 3.5.0 + JPA", data_store: "PostgreSQL" }
  epics: ["EP-INVENTORY-CATALOG"]
  features:
    - "FEAT-CAT-GRP-LIST"
    - "FEAT-CAT-GRP-CREATE"
    - "FEAT-CAT-GRP-DETAIL"
    - "FEAT-CAT-GRP-EDIT"
    - "FEAT-CAT-GRP-DELETE"
    - "FEAT-CAT-PROD-LIST"
    - "FEAT-CAT-PROD-CREATE"
    - "FEAT-CAT-PROD-DETAIL"
    - "FEAT-CAT-PROD-EDIT"
    - "FEAT-CAT-PROD-DELETE"
    - "FEAT-CAT-PROD-IMPORT"
    - "FEAT-CAT-PROD-EXPORT"
  integration_ref: "Architecture/integrations/INTEG-BFF-gf-inventory.md"
  integration_consumers: []

