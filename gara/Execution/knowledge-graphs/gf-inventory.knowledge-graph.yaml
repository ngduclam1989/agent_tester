  - { date: "2026-07-03", summary: "LAYOUT (theo yêu cầu trực tiếp user, không phải BR-sourced): 3 sheet reference `Xuất xứ`/`Tính chất`/`ĐVT` trong export .xlsx (`InternalProductExportService`) chèn thêm **1 row trống trên cùng + 1 column trống bên trái** — header dịch từ ô A1 xuống B2 (row index 0→1, cell index 0→1), toàn bộ data row dịch tương ứng. Implementation: thêm 2 hằng số `REFERENCE_SHEET_ROW_OFFSET=1` + `REFERENCE_SHEET_COL_OFFSET=1` (đặt cạnh 2 helper, KHÔNG áp cho sheet chính `danh-muc` — giữ layout gốc A1); `writeCodeNameSheet()` (dùng chung Xuất xứ + ĐVT) và `writeNatureReferenceSheet()` cùng đọc 2 offset này khi createRow/createCell — dịch offset ở 1 chỗ nếu sau này BA đổi khoảng cách. Sheet chính `danh-muc` KHÔNG đổi (không có yêu cầu). Test: 3 test reference sheet cập nhật assertion — header `getRow(1).getCell(1..3)` thay `getRow(0).getCell(0..2)`, data row dịch từ `getRow(1..)` → `getRow(2..)`, thêm assertion `getRow(0)` null + `getRow(1).getCell(0)` null để pin layout offset. GOTCHA: khi 1 sheet cần layout \"cách trên N row + cách trái N column\", KHÔNG đặt magic number thẳng vào loop createRow/createCell — dùng 2 hằng số OFFSET (row + col) và tính relative, để tránh phải sửa index rải rác nếu BA đổi khoảng cách; Apache POI cho phép skip row hoàn toàn (`getRow(0)` sẽ trả null, KHÔNG phải row rỗng) — assertion phải là `isNull()` chứ không phải `getRow(0).getCell(0) == null`.", author: "Main agent — internal-product export reference sheets top+left offset 2026-07-03" }
