events:
  produces:
    - topic: "AC-DEV-BRANCH-LIFECYCLE"
      payload:
        message_group: "BRANCH-LIFECYCLE"
        message_step: "WAREHOUSE_CREATED.1"
        tenant_id: long
        warehouse_code: string
        branch_code: string
      meaning: "WarehouseCreated — WarehouseEventService.publishWarehouseCreated() saves outbox row; OutboxScheduler → OutboxEventPublisher → EventPublishingService → BranchLifecyclePublisher publishes to ${kafka.topics.branch-lifecycle}. Shared topic with gf-system BranchCreated step BRANCH_CREATED.1."
  # Note: OutboxEventType enum also defines INVENTORY_RECEIPT_COMPLETED/REVERSED, INVENTORY_DELIVERY_COMPLETED/REVERSED,
  # INVENTORY_RESERVATION_EXPIRED/RELEASED/FULFILLED, INVENTORY_STOCK_CHANGED.
  # PeriodStockAdjusted: được publish bởi PeriodStockAdjustmentTriggerService.publishPeriodStockAdjustedEvent
  # và PeriodStockActivityImpl.publishPeriodStockAdjustedEvent; eventType là raw string "PeriodStockAdjusted",
  # KHÔNG được khai báo trong OutboxEventType enum (legacy raw insert vào outbox_event).
  # These are SAVED to outbox_event table (legacy raw payload) but EventPublishingService.publishEvent() only routes
  # WAREHOUSE_CREATED to BranchLifecyclePublisher — other event types never reach Kafka (no publisher route).
  # Per source-of-truth policy: not listed as produces topic until publisher route exists.

  consumes:
    - topic: "AC-DEV-BRANCH-LIFECYCLE"
      payload:
        message_group: string
        message_step: string
        tenant_id: long
        branch_code: string
      action: "BranchCreatedEventListener — route by MessageGroup=BRANCH_LIFECYCLE + MessageStep=BRANCH_CREATED → create default warehouse; idempotent via processed_events"

    - topic: "AC-DEV-TENANT-PROVISIONING"
      payload:
        tenant_id: long
        subscription_plan: string
        features: object
      action: "TenantSubscriptionCacheListener — cache subscription quota in Redis"

entities:
  - name: "ProductLine"
    type: "aggregate_root"
    description: "Dòng sản phẩm theo tenant, chứa tên, đơn vị tính và loại sản phẩm; là aggregate root trong domain model hiện tại."
    attributes:
      - { name: "id", type: "BIGINT", required: true }
      - { name: "code", type: "VARCHAR(255)", required: false }
      - { name: "name", type: "VARCHAR(255)", required: true }
      - { name: "unit", type: "VARCHAR(255)", required: false }
      - { name: "tenant_id", type: "BIGINT", required: true }
      - { name: "type", type: "ProductTypeEnum", required: true, constraints: ["SPARE_PART | SPA | CARE | OTHER"] }
      - { name: "is_deleted", type: "BOOLEAN", required: false }
      - { name: "created_by", type: "VARCHAR(255)", required: true }
      - { name: "created_at", type: "TIMESTAMPTZ", required: true }
      - { name: "updated_by", type: "VARCHAR(255)", required: false }
      - { name: "updated_at", type: "TIMESTAMPTZ", required: false }
    relationships:
      - { target: "Product", type: "one_to_many", description: "Product.product_line_id tham chiếu logic tới ProductLine.id; source không khai báo FK vật lý." }
    invariants:
      - "Tạo product line bỏ qua item đã tồn tại theo name, tenantId và productType."
      - "Khi tạo product line mới, service tạo một Product cho từng Segment TIER1 đến TIER5."
      - "Xóa product line là soft delete bằng isDeleted=true, không hard delete qua service hiện tại."

  - name: "Product"
    type: "entity"
    description: "Biến thể sản phẩm theo segment và tenant, gắn logic với ProductLine qua product_line_id."
    attributes:
      - { name: "id", type: "BIGINT", required: true }
      - { name: "sku", type: "VARCHAR(255)", required: false }
      - { name: "genuine_code", type: "VARCHAR(255)", required: false }
      - { name: "product_alias_name", type: "VARCHAR(255)", required: false }
      - { name: "tenant_id", type: "BIGINT", required: false }
      - { name: "product_line_id", type: "BIGINT", required: false, constraints: ["legacy — be going to remove in the future"] }
      - { name: "name", type: "VARCHAR(255)", required: false }
      - { name: "unit", type: "VARCHAR(255)", required: false }
      - { name: "segment", type: "Segment", required: false, constraints: ["TIER1 | TIER2 | TIER3 | TIER4 | TIER5"] }
      - { name: "is_deleted", type: "BOOLEAN", required: false }
      - { name: "origin", type: "VARCHAR(100)", required: false }
      - { name: "created_by", type: "VARCHAR(255)", required: true }
      - { name: "created_at", type: "TIMESTAMPTZ", required: true }
      - { name: "updated_by", type: "VARCHAR(255)", required: false }
      - { name: "updated_at", type: "TIMESTAMPTZ", required: false }
    relationships:
      - { target: "ProductLine", type: "logical_reference", description: "product_line_id trỏ logic tới product_line.id (legacy, kế hoạch remove)." }
      - { target: "Inventory", type: "one_to_many", description: "Inventory.product_id tham chiếu logic tới Product.id." }
      - { target: "IOStockProduct", type: "one_to_many", description: "IOStockProduct.product_id tham chiếu logic tới Product.id." }
    invariants:
      - "Product có cột tenant_id riêng và unique constraint vật lý uk_product_tenant_sku trên (tenant_id, sku); có index idx_product_tenant_sku trên (tenant_id, sku)."
      - "Tra cứu product id dùng name, unit, segment, tenantId, productType và genuineCode (xem JpaProductRepository.findProductIdByNameAndUnitAndSegmentAndTenantIdAndProductTypeEnumAndGenuineCode)."

  - name: "Inventory"
    type: "entity"
    description: "Bản ghi tồn kho legacy theo product và tenant với số lượng tồn hiện tại."
    attributes:
      - { name: "id", type: "BIGINT", required: true }
      - { name: "product_id", type: "BIGINT", required: true }
      - { name: "tenant_id", type: "BIGINT", required: true }
      - { name: "stock_quantity", type: "NUMERIC", required: true }
      - { name: "created_by", type: "VARCHAR(255)", required: true }
      - { name: "created_at", type: "TIMESTAMPTZ", required: true }
      - { name: "updated_by", type: "VARCHAR(255)", required: false }
      - { name: "updated_at", type: "TIMESTAMPTZ", required: false }
    relationships:
      - { target: "Product", type: "logical_reference", description: "product_id trỏ logic tới product.id; source không khai báo FK vật lý." }
    invariants:
      - "stock_quantity là BigDecimal precision=15 scale=2, nullable=false; entity có @Version Long cho optimistic locking."
      - "Source hiện chỉ có repository interface rỗng cho Inventory legacy, chưa thấy use case mutate stock (khác với InventoryStock — entity riêng có service đầy đủ)."

  - name: "IOStockIssuance"
    type: "entity"
    description: "Phiếu xuất nhập kho legacy, gồm mã phiếu, tenant, loại phiếu, thủ kho và trạng thái."
    attributes:
      - { name: "id", type: "BIGINT", required: true }
      - { name: "issue_code", type: "VARCHAR(255)", required: true }
      - { name: "tenant_id", type: "BIGINT", required: true }
      - { name: "issue_type", type: "IOStockEnum", required: true, constraints: ["WAREHOUSE_RECEIPT | DELIVERY_NOTE"] }
      - { name: "stock_keeper_name", type: "VARCHAR(255)", required: false }
      - { name: "status", type: "IOIssuanceStatus", required: true, constraints: ["OPEN | APPROVED | CANCELLED"] }
      - { name: "created_by", type: "VARCHAR(255)", required: true }
      - { name: "created_at", type: "TIMESTAMPTZ", required: true }
      - { name: "updated_by", type: "VARCHAR(255)", required: false }
      - { name: "updated_at", type: "TIMESTAMPTZ", required: false }
    relationships:
      - { target: "IOStockProduct", type: "one_to_many", description: "IOStockProduct.issue_id tham chiếu logic tới IOStockIssuance.id." }
    invariants:
      - "issue_type và status lưu bằng EnumType.STRING."
      - "@Id không có @GeneratedValue — caller phải tự gán id khi insert."
      - "Source hiện chỉ có repository interface rỗng cho IOStockIssuance, chưa thấy use case tạo/duyệt/hủy phiếu."

  - name: "IOStockProduct"
    type: "entity"
    description: "Dòng hàng trong phiếu xuất nhập kho legacy, tham chiếu product và tùy chọn SO/PO liên quan."
    attributes:
      - { name: "id", type: "BIGINT", required: true }
      - { name: "tenant_id", type: "BIGINT", required: true }
      - { name: "issue_id", type: "BIGINT", required: true }
      - { name: "product_id", type: "BIGINT", required: true }
      - { name: "quantity", type: "NUMERIC(15,2)", required: true }
      - { name: "so_id", type: "BIGINT", required: false }
      - { name: "po_id", type: "BIGINT", required: false }
      - { name: "created_by", type: "VARCHAR(255)", required: true }
      - { name: "created_at", type: "TIMESTAMPTZ", required: true }
      - { name: "updated_by", type: "VARCHAR(255)", required: false }
      - { name: "updated_at", type: "TIMESTAMPTZ", required: false }
    relationships:
      - { target: "IOStockIssuance", type: "logical_reference", description: "issue_id trỏ logic tới iostock_issuance.id." }
      - { target: "Product", type: "logical_reference", description: "product_id trỏ logic tới product.id." }
    invariants:
      - "quantity là BigDecimal precision=15 scale=2, nullable=false theo JPA."
      - "so_id và po_id chỉ là tham chiếu id logic; source không có client hoặc FK sang gf-sales/gf-purchase."

  # ====================================================================
  # W03 — EP-INVENTORY-CATALOG (catalog V2) — planned design
  # Source-of-truth: Execution/work-packages/PKG-W03-inventory-catalog.md §2.2.1
  # Convention: id BIGINT auto-increment (gf-inventory style, KHÔNG UUID); FK scalar only per ADR-009.
  # ====================================================================

  - name: "MaterialGroup"
    type: "aggregate_root"
    description: "Nhóm hàng hóa catalog V2 (adjacency-list, self-referential) per ADR-017. Tree cap 1000 nodes (ERR-INV-027); cascade INACTIVE xuống children (BR-CAT-GRP-007)."
    attributes:
      - { name: "id", type: "BIGINT", required: true, constraints: ["PK auto-increment"] }
      - { name: "tenant_id", type: "BIGINT", required: true }
      - { name: "code", type: "VARCHAR(50)", required: true, constraints: ["regex không chứa ~!@#$%^&* (ERR-INV-001)"] }
      - { name: "name", type: "VARCHAR(255)", required: true }
      - { name: "description", type: "VARCHAR(255)", required: false, constraints: ["≤255 ERR-INV-016"] }
      - { name: "parent_id", type: "BIGINT", required: false, constraints: ["FK scalar self-ref (ADR-009 — KHÔNG @ManyToOne)"] }
      - { name: "status", type: "MaterialGroupStatus", required: true, constraints: ["ACTIVE | INACTIVE; cascade INACTIVE xuống children BR-CAT-GRP-007"] }
      - { name: "created_by", type: "VARCHAR(255)", required: true }
      - { name: "created_at", type: "TIMESTAMPTZ", required: true }
      - { name: "updated_by", type: "VARCHAR(255)", required: false }
      - { name: "updated_at", type: "TIMESTAMPTZ", required: false }
    relationships:
      - { target: "MaterialGroup", type: "logical_reference", description: "parent_id self-ref (FK scalar). Tree thao tác qua recursive CTE." }
      - { target: "InternalProduct", type: "one_to_many", description: "InternalProduct.material_group_id trỏ logic tới MaterialGroup.id." }
    invariants:
      - "Unique (tenant_id, code) — ERR-INV-002."
      - "Tree cap 1000 nodes per tenant — ERR-INV-027 (V2-2 recursive CTE bảo vệ)."
      - "Circular check BFS khi update parent_id (V2-5)."
      - "Delete guards: ERR-INV-004 (has children) / ERR-INV-005 (has products)."
    business_rules: ["BR-CAT-GRP-001", "BR-CAT-GRP-002", "BR-CAT-GRP-003", "BR-CAT-GRP-004", "BR-CAT-GRP-005", "BR-CAT-GRP-006", "BR-CAT-GRP-007", "BR-CAT-GRP-008", "BR-CAT-GRP-009", "BR-CAT-GRP-010", "BR-CAT-GRP-011", "BR-CAT-GRP-012", "BR-CAT-GRP-013"]

  - name: "InternalProduct"
    type: "aggregate_root"
    description: "Mã hàng nội bộ catalog V2 — chuẩn hóa SKU legacy về 1 mã nội bộ với UoM conversion, group hierarchy, attachment. PricingMethod locked PWA (R13 + BR-CAT-PROD-010)."
    attributes:
      - { name: "id", type: "BIGINT", required: true, constraints: ["PK auto-increment"] }
      - { name: "tenant_id", type: "BIGINT", required: true }
      - { name: "code", type: "VARCHAR(50)", required: true, constraints: ["regex ERR-INV-006"] }
      - { name: "name", type: "VARCHAR(255)", required: true }
      - { name: "main_unit_code", type: "VARCHAR(50)", required: true, constraints: ["FK scalar tới gf-erp-mdm directory=UNIT (R8 D-A/E rename primary_uom_id → main_unit_code); immutable khi đã có giao dịch BR-CAT-PROD-006"] }
      - { name: "material_group_id", type: "BIGINT", required: true, constraints: ["FK scalar tới material_group.id"] }
      - { name: "status", type: "InternalProductStatus", required: true, constraints: ["ACTIVE | INACTIVE; INACTIVE chặn dùng trong phiếu mới BR-CAT-PROD-008"] }
      - { name: "nature", type: "ProductNature", required: true, constraints: ["default GOODS; English keys (R8 D-B) BR-CAT-PROD-019"] }
      - { name: "pricing_method", type: "PricingMethod", required: true, constraints: ["default PWA, locked (R13 + BR-CAT-PROD-010)"] }
      - { name: "brand", type: "VARCHAR(255)", required: false, constraints: ["free-text (R18 revert R8 D-C — KHÔNG validate catalog)"] }
      - { name: "origin_code", type: "VARCHAR(20)", required: false, constraints: ["codified (R18); validate vs gf-erp-mdm directory=COUNTRY ISO 3166-1 alpha-3"] }
      - { name: "image_url", type: "VARCHAR(500)", required: false, constraints: ["opaque URL (R25 OQ10 — KHÔNG quản lý S3)"] }
      - { name: "product_spec", type: "TEXT", required: false }
      - { name: "technical_spec", type: "TEXT", required: false }
      - { name: "description", type: "VARCHAR(500)", required: false, constraints: ["label 'Mô tả' (R26 OQ13)"] }
      - { name: "notes", type: "VARCHAR(500)", required: false, constraints: ["label 'Ghi chú' (R26 OQ13)"] }
      - { name: "created_by", type: "VARCHAR(255)", required: true }
      - { name: "created_at", type: "TIMESTAMPTZ", required: true }
      - { name: "updated_by", type: "VARCHAR(255)", required: false }
      - { name: "updated_at", type: "TIMESTAMPTZ", required: false }
    relationships:
      - { target: "MaterialGroup", type: "logical_reference", description: "material_group_id trỏ logic tới material_group.id (FK scalar ADR-009)." }
      - { target: "InternalProductSkuMapping", type: "one_to_many", description: "1 internal product có nhiều SKU mapping; mỗi SKU tối đa thuộc 1 internal product." }
      - { target: "InternalProductConversionUnit", type: "one_to_many", description: "Conversion ratio từ main_unit_code sang các UoM khác." }
      - { target: "InternalProductAttachment", type: "one_to_many", description: "Đính kèm tài liệu / ảnh (max 5)." }
    invariants:
      - "Unique (tenant_id, code) — ERR-INV-007."
      - "main_unit_code immutable khi đã có giao dịch — BR-CAT-PROD-006."
      - "pricing_method default PWA, locked — chỉ PWA active hiện tại (R13)."
      - "Delete chặn khi đã có giao dịch — ERR-INV-008."
    business_rules: ["BR-CAT-PROD-001", "BR-CAT-PROD-002", "BR-CAT-PROD-003", "BR-CAT-PROD-004", "BR-CAT-PROD-005", "BR-CAT-PROD-006", "BR-CAT-PROD-007", "BR-CAT-PROD-008", "BR-CAT-PROD-009", "BR-CAT-PROD-010", "BR-CAT-PROD-019"]

  - name: "InternalProductSkuMapping"
    type: "entity"
    description: "Bảng nối mã nội bộ ↔ SKU legacy (gf-inventory.product). Mỗi SKU thuộc tối đa 1 internal product (unique global per tenant)."
    attributes:
      - { name: "id", type: "BIGINT", required: true, constraints: ["PK auto-increment"] }
      - { name: "tenant_id", type: "BIGINT", required: true }
      - { name: "internal_product_id", type: "BIGINT", required: true, constraints: ["FK scalar tới internal_product.id (ADR-009)"] }
      - { name: "sku_id", type: "BIGINT", required: true, constraints: ["FK scalar tới legacy product.id (R9 cột tường minh product_id)"] }
      - { name: "created_by", type: "VARCHAR(255)", required: true }
      - { name: "created_at", type: "TIMESTAMPTZ", required: true }
    relationships:
      - { target: "InternalProduct", type: "logical_reference", description: "internal_product_id trỏ logic tới internal_product.id." }
      - { target: "Product", type: "logical_reference", description: "sku_id trỏ logic tới legacy product.id." }
    invariants:
      - "Unique (tenant_id, sku_id) — 1 SKU thuộc tối đa 1 mã nội bộ (ERR-INV-015 BR-CAT-PROD-013)."
    business_rules: ["BR-CAT-PROD-013", "BR-CAT-PROD-014"]

  - name: "InternalProductConversionUnit"
    type: "entity"
    description: "Quy đổi đơn vị (R8 D-E rename từ internal_product_uom_conversion). Quy đổi từ main_unit_code sang UoM khác trong gf-erp-mdm directory=UNIT."
    attributes:
      - { name: "id", type: "BIGINT", required: true, constraints: ["PK auto-increment"] }
      - { name: "tenant_id", type: "BIGINT", required: true }
      - { name: "internal_product_id", type: "BIGINT", required: true, constraints: ["FK scalar (ADR-009)"] }
      - { name: "uom_id", type: "BIGINT", required: true, constraints: ["FK scalar tới gf-erp-mdm directory=UNIT"] }
      - { name: "conversion_rate", type: "NUMERIC(18,6)", required: true, constraints: ["> 0 ERR-INV-013; app-layer scale guard ≤6 → ERR-INV-047 (R29 BR-CAT-PROD-011 v15)"] }
      - { name: "created_by", type: "VARCHAR(255)", required: true }
      - { name: "created_at", type: "TIMESTAMPTZ", required: true }
      - { name: "updated_by", type: "VARCHAR(255)", required: false }
      - { name: "updated_at", type: "TIMESTAMPTZ", required: false }
    relationships:
      - { target: "InternalProduct", type: "logical_reference", description: "internal_product_id trỏ logic tới internal_product.id." }
    invariants:
      - "Unique (internal_product_id, uom_id) — ERR-INV-014."
      - "Immutable khi đã có giao dịch — BR-CAT-PROD-012."
      - "conversion_rate > 0 (ERR-INV-013); scale ≤6 (ERR-INV-047)."
    business_rules: ["BR-CAT-PROD-011", "BR-CAT-PROD-012"]

  - name: "InternalProductAttachment"
    type: "entity"
    description: "Tệp đính kèm internal product — metadata-only (file lưu ct-file-storage, KHÔNG quản lý binary trong gf-inventory). Max 5 file/product."
    attributes:
      - { name: "id", type: "BIGINT", required: true, constraints: ["PK auto-increment"] }
      - { name: "tenant_id", type: "BIGINT", required: true }
      - { name: "internal_product_id", type: "BIGINT", required: true, constraints: ["FK scalar (ADR-009)"] }
      - { name: "file_url", type: "VARCHAR(500)", required: true, constraints: ["ct-file-storage object key"] }
      - { name: "file_name", type: "VARCHAR(255)", required: true }
      - { name: "file_size", type: "BIGINT", required: true, constraints: ["≤30MB ERR-CMN-004 (align BR-CAT-PROD-015 v17/v18 canonical)"] }
      - { name: "mime_type", type: "VARCHAR(100)", required: true, constraints: ["PDF | JPG | PNG (ERR-CMN-005)"] }
      - { name: "attachment_kind", type: "VARCHAR(20)", required: true, constraints: ["IMAGE | DOC"] }
      - { name: "created_by", type: "VARCHAR(255)", required: true }
      - { name: "created_at", type: "TIMESTAMPTZ", required: true }
    relationships:
      - { target: "InternalProduct", type: "logical_reference", description: "internal_product_id trỏ logic tới internal_product.id." }
    invariants:
      - "Tối đa 5 file / internal product — BR-CAT-PROD-015."
      - "file_size ≤30MB (ERR-CMN-004); mime_type ∈ {PDF, JPG, PNG} (ERR-CMN-005)."
    business_rules: ["BR-CAT-PROD-015"]

business_rules:
  - { id: "BR-GF-INVENTORY-001", description: "Tạo product line chỉ tạo item chưa tồn tại theo name, tenantId và productType; nếu tất cả đã tồn tại thì trả null response.", cornerstone: true, enforcement_point: "ProductApplicationService.createAndSaveProduct + existsProductLine" }
  - { id: "BR-GF-INVENTORY-002", description: "Mỗi product line mới tạo sẽ sinh đủ Product cho toàn bộ Segment TIER1, TIER2, TIER3, TIER4, TIER5.", cornerstone: true, enforcement_point: "ProductApplicationService.createAndSaveProductList" }
  - { id: "BR-GF-INVENTORY-003", description: "Xóa product line là soft delete bằng isDeleted=true và chỉ áp dụng cho product line tìm thấy chưa bị xóa.", cornerstone: true, enforcement_point: "ProductApplicationService.deleteProductLine + ProductLineRepositoryImpl.findAllById" }
  - { id: "BR-GF-INVENTORY-004", description: "Tra cứu product id theo product name, unit, segment, tenantId, productType và genuineCode bằng join Product với ProductLine; không tìm thấy thì ném ResourceNotFoundException.", cornerstone: true, enforcement_point: "JpaProductRepository.findProductIdByNameAndUnitAndSegmentAndTenantIdAndProductTypeEnumAndGenuineCode + ProductApplicationService.getProductId" }
  - { id: "BR-GF-INVENTORY-005", description: "ProductLine lookup theo name, unit, tenantId, type và genuineCode là điều kiện nghiệp vụ; source không khai báo unique constraint vật lý trên product_line (lưu ý: unique constraint uk_product_tenant_sku thuộc Product, không phải ProductLine).", cornerstone: false, enforcement_point: "JpaProductLineRepository.findProductLineEntityByNameAndUnitAndTenantIdAndTypeAndGenuineCode + ProductLineEntity" }
  - { id: "BR-GF-INVENTORY-006", description: "Cập nhật product line hiện chỉ đổi name và unit của product line đã tồn tại.", cornerstone: false, enforcement_point: "ProductApplicationService.updateProductLine" }
  - { id: "BR-GF-INVENTORY-007", description: "Schema PostgreSQL được quản lý bằng Flyway migrations (src/main/resources/db/migration/, 13 files V1.0.1 → V20260423100000) chạy song song với Hibernate ddl-auto=update; Product có unique constraint uk_product_tenant_sku(tenant_id, sku) và index idx_product_tenant_sku.", cornerstone: true, enforcement_point: "Flyway migrations + JPA entity annotations" }
  # === Receipt Domain ===
  - { id: "BR-GF-INVENTORY-008", description: "Receipt status: PENDING→COMPLETED/CANCELLED.  cần purchaseOrderCode; cho phép edit product fields (quantity, unit price). Only PENDING receipts editable. Items list phải non-empty để complete.", cornerstone: true, enforcement_point: "InventoryReceipt aggregate + InventoryReceiptService.complete/cancel/reverse" }
  - { id: "BR-GF-INVENTORY-009", description: "Receipt completion increase stock per item (quantity + costPrice update). Receipt reversal decrease stock back + trigger period stock adjustment nếu period đã CLOSED.", cornerstone: true, enforcement_point: "InventoryReceiptService.complete + reverse + InventoryStockService + PeriodStockAdjustmentTriggerService" }
  - { id: "BR-GF-INVENTORY-010", description: "Receipt code generated via sequence table INVENTORY_RECEIPT, unique per tenant (UK tenant_id + receipt_code).", cornerstone: true, enforcement_point: "SequenceService + inventory_receipt UK constraint" }
  # === Delivery Domain ===
  - { id: "BR-GF-INVENTORY-011", description: "Delivery status: PENDING→COMPLETED/CANCELLED. Protected API creates delivery + reservation simultaneously khi source DIRECT.", cornerstone: true, enforcement_point: "InventoryDelivery aggregate + ProtectedDeliveryController.createDelivery + InventoryDeliveryService" }
  - { id: "BR-GF-INVENTORY-012", description: "Delivery completion validates against Service Order (AC-8): SO must exist + not cancelled + items match (SKU + quantity). Returns 200 with mismatch flag (NOT 400) khi validation fail. Completion decreases stock.", cornerstone: true, enforcement_point: "DeliveryServiceOrderValidationService + InventoryDeliveryService.complete" }
  - { id: "BR-GF-INVENTORY-013", description: "Delivery reversal increases stock back + triggers period stock adjustment nếu period đã CLOSED.", cornerstone: true, enforcement_point: "InventoryDeliveryService.reverse + PeriodStockAdjustmentTriggerService" }
  # === Stock Domain ===
  - { id: "BR-GF-INVENTORY-014", description: "Negative stock ALLOWED (business requirement). Reserved quantity là tracking marker ONLY — KHÔNG deducted from available (availableQuantity = quantity, not quantity - reservedQuantity). Optimistic locking via @Version.", cornerstone: true, enforcement_point: "InventoryStock aggregate + StockLevel value object + @Version" }
  - { id: "BR-GF-INVENTORY-015", description: "Stock adjustment (Set Stock / Kiểm kê) directly modifies quantity, creates ADJUSTMENT transaction, triggers period stock adjustment nếu period đã CLOSED.", cornerstone: true, enforcement_point: "InventoryStockService.adjustQuantity + PeriodStockAdjustmentTriggerService" }
  # === Reservation Domain ===
  - { id: "BR-GF-INVENTORY-016", description: "Reservation TTL 30 phút (ecommerce) / 3 phút (direct). Status: ACTIVE→FULFILLED/EXPIRED/CANCELLED/RELEASED. Auto-expire via gf-inventory-worker Temporal ReservationExpiryWorkflow. Created simultaneously với delivery qua protected API.", cornerstone: true, enforcement_point: "InventoryReservationService + WorkerClient.startReservationExpiry + ProtectedReservationController" }
  # === PeriodStock Domain ===
  - { id: "BR-GF-INVENTORY-017", description: "Period closure tính WAC: closingCostPrice = (openingCost + receivedCost) / (openingQty + receivedQty). COGS = deliveredQty × closingCostPrice. ClosingQty = openingQty + received - delivered.", cornerstone: true, enforcement_point: "NativePeriodClosureService native SQL calculations" }
  - { id: "BR-GF-INVENTORY-018", description: "Period status: OPEN→CLOSED→ADJUSTED. Atomic close + create next period via idempotency key. Native SQL cho scale (100M+ SKUs). Retry với saga compensation rollback. Delivery item cost_price backfill từ period_stock.closing_cost_price sau closure.", cornerstone: true, enforcement_point: "NativePeriodClosureService + ProtectedPeriodClosureController + ProtectedDeliveryController.updateDeliveryItemCostPrices" }
  # === Warehouse/Event Domain ===
  - { id: "BR-GF-INVENTORY-019", description: "BranchCreatedEvent Kafka consumer auto-creates default warehouse cho branch + publishes WAREHOUSE_CREATED event. Inbox idempotency via ProcessedEventEntity.", cornerstone: true, enforcement_point: "BranchCreatedEventListener + WarehouseService + OutboxEventPublisher" }


workflows:
  - name: "ReservationExpiryWorkflow"
    type: TEMPORAL
    description: "Reservation TTL workflow — workflow interface defined here, execution chạy ở gf-inventory-worker. Workflow ID reservation-expiry-{tenantId}-{deliveryCode}; timeout = TTL + 5m buffer"
    steps:
      - step: 1
        service: "gf-inventory"
        action: "Started bởi WorkflowStarterService.startReservationExpiryWorkflow qua Temporal SDK WorkflowClient.start(workflow::execute, input) trực tiếp (task-queue gf-inventory-worker). Không gọi HTTP."
      - step: 2
        service: "gf-inventory-worker"
        action: "Workflow.await(ttlMinutes) — chờ signal release / fulfill hoặc hết TTL (chi tiết xem gf-inventory-worker KG)"
      - step: 3
        service: "gf-inventory"
        action: "gf-inventory gửi signals qua WorkerClient HTTP (KHÔNG phải Temporal SDK): release → POST /protected/workflows/reservation-expiry/{deliveryCode}/release; fulfill → POST /protected/workflows/reservation-expiry/{deliveryCode}/fulfill. Worker nhận signal và close workflow. Riêng khi TTL hết: worker gọi ReservationActivity.expireReservation → POST /protected/reservations/{code}/expire (với tenantId query param)"

  - name: "PeriodStockAdjustmentWorkflow"
    type: TEMPORAL
    description: "Workflow interface declared here cho trường hợp reverse receipt/delivery rơi vào closed period. Hiện tại PeriodStockAdjustmentTriggerService KHÔNG start Temporal workflow — chỉ apply adjustment đồng bộ (applyAdjustmentDirectly) và publish PeriodStockAdjusted outbox event. Temporal workflow implementation tồn tại nhưng chưa có entry point nào trigger nó từ gf-inventory."
    steps:
      - step: 1
        service: "gf-inventory"
        action: "PeriodStockAdjustmentTriggerService.applyAdjustmentDirectly — apply adjustment đồng bộ + ghi PeriodStockAdjusted vào outbox_event (eventType raw string). Không start Temporal workflow."

  - name: "ReceiptFulfillmentWorkflow"
    type: TEMPORAL
    description: "Minimal interface declared here; trigger + execution sống ở gf-inventory-worker (xem gf-inventory-worker KG để biết chi tiết)"
    steps:
      - step: 1
        service: "gf-inventory-worker"
        action: "Triggered by Kafka purchase-order-events DELIVERED.2 (gated Inventory:InventoryStockV01) — workflow interface khai báo ở gf-inventory, execution chạy ở gf-inventory-worker"
      - step: 2
        service: "gf-inventory-worker"
        action: "Signals complete(userId) / cancel(userId, reason)"

integrations:
  inbound:
    - type: API
      source: "gf-erp-agent"
      purpose: "Inventory queries / catalog sync"
    - type: API
      source: "gf-erp-mdm"
      purpose: "PIM info ingestion — POST /protected/v1/pim-info"
    - type: API
      source: "gf-purchase"
      purpose: "Receipt summary + product info"
    - type: API
      source: "gf-sales"
      purpose: "Stock check + reservation queries"
    - type: API
      source: "gf-inventory-worker"
      purpose: "Activity-driven receipt/delivery/reservation operations via /protected/{receipts,deliveries,reservations}"
    - type: API
      source: "agg-garage-graph"
      purpose: "BFF stock + product queries"
    - type: EVENT
      source: "gf-system"
      purpose: "BranchLifecycleChanged + TenantProvisioned events"

  outbound:
    - type: API
      target: "gf-erp-mdm"
      purpose: "Catalog (units, vehicle hierarchy) for printing — POST /protected/catalog/v1/inquiry"
    - type: API
      target: "gf-purchase"
      purpose: "Validate receipt vs PO — GET /protected/v1/purchase-orders/{code}/items, /code/{code}"
    - type: API
      target: "gf-sales"
      purpose: "Validate delivery vs SO — GET /protected/v1/service-orders/{tenantId}/detail/{code}"
    - type: API
      target: "gf-inventory-worker"
      purpose: "Reservation signal via WorkerClient HTTP — POST /protected/workflows/reservation-expiry/{deliveryCode}/{release,fulfill}. Lưu ý: workflow START dùng Temporal SDK trực tiếp (WorkflowStarterService), KHÔNG gọi HTTP /start"
    - type: API
      target: "gf-notification"
      purpose: "Notification dispatch"
    - type: API
      target: "ct-saas-tenant"
      purpose: "Tenant lookup"
    - type: API
      target: "Google Custom Search"
      purpose: "Vehicle search in catalog building"
    - type: EVENT
      target: "Kafka — outbox-driven"
      purpose: "Publish warehouse / receipt / delivery / reservation / period-stock events via poll-based outbox"

dependencies:
  - { name: "PostgreSQL", type: "database", purpose: "Lưu product_line, product, inventory, iostock_issuance và iostock_products trong schema gf-inventory.", config_ref: "spring.datasource.*, spring.jpa.properties.hibernate.default_schema, DB_SCHEMA" }
  - { name: "Flyway", type: "database_migration", purpose: "Quản lý schema migrations (src/main/resources/db/migration/) chạy song song với Hibernate ddl-auto=update.", config_ref: "spring.flyway.*" }
  - { name: "Kafka", type: "messaging", purpose: "Consume AC-DEV-BRANCH-LIFECYCLE + AC-DEV-TENANT-PROVISIONING; publish outbox events qua BranchLifecyclePublisher (poll-based OutboxScheduler → OutboxEventPublisher → EventPublishingService).", config_ref: "spring.kafka.*, kafka.topics.branch-lifecycle" }
  - { name: "Redis", type: "cache", purpose: "Cache tenant subscription quota qua TenantSubscriptionCacheService (consumer của AC-DEV-TENANT-PROVISIONING).", config_ref: "spring.data.redis.*" }
  - { name: "Temporal", type: "workflow_engine", purpose: "WorkflowClient + WorkflowServiceStubs cho ReservationExpiryWorkflow (start trực tiếp qua SDK). Workflow execution chạy ở gf-inventory-worker (task-queue gf-inventory-worker).", config_ref: "spring.temporal.*" }
  - { name: "spring-security-starter", type: "auth", purpose: "Cung cấp SecurityUtils cho JPA auditing created_by/updated_by; nếu không resolve được user thì fallback system.", config_ref: "com.actechx.common:spring-security-starter, JpaConfig.SpringSecurityAuditorAware" }
  - { name: "SpringDoc OpenAPI", type: "api_documentation", purpose: "Expose OpenAPI UI cho REST controller của service.", config_ref: "springdoc-openapi-starter-webmvc-ui, OpenApiConfig" }

