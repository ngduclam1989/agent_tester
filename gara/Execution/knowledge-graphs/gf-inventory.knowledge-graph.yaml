  # ====================================================================
  # W03 — EP-INVENTORY-CATALOG (catalog V2) — planned design
  # Source-of-truth: Execution/work-packages/PKG-W03-inventory-catalog.md §2.2.1
  # Path prefix /api/v2/, scope authenticated, tenant từ JWT (no {tenantId} in path)
  # ====================================================================

  - name: "material-group-search"
    path: "/api/v2/material-groups/search"
    method: POST
    purpose: "V2-1: search material groups — 2-branch dispatch (v4 rewire 2026-07-06 pm): CHỈ `keyword` mới trigger push-down flat; status/parentId luôn qua DFS full-load — vì BFF `agg-garage-graph` gửi status=ACTIVE default trong mọi browse khiến v2/v3 mất tree structure (user report: cháu đứng trước con đứng trước ông). (A) BROWSE FULL TREE — mặc định + khi filter chỉ có status/parentId (không keyword): full-load tenant qua `findAllByTenantIdOrderByParentIdAscDisplayOrderAscIdAsc`, DFS preorder trong Java, sau đó áp filter row-level strict (không auto-pull ancestor). **Sort key riêng theo cấp (v3 2026-07-06)**: root (parentId=NULL) sort `createdAt DESC, id ASC` (record mới nhất lên đầu); non-root (con/cháu/…) sort `displayOrder ASC, id ASC` — con mới tạo KHÔNG nhảy lên đầu list con, bám thứ tự user set qua displayOrder. Contract cũ (siblings mọi cấp sort createdAt DESC) đã đổi vì gây "loạn" cây con mỗi khi có node mới. Mỗi node xuất hiện rồi TOÀN BỘ subtree, không chèn qua cụm root khác. Orphan (parentId trỏ id không tồn tại) surface as root. childCount lấy từ `byParent` in-memory map (0 query mới), productCount batch 1 GROUP BY. (B) PUSH-DOWN — CHỈ khi request có keyword: 1 JPQL `findSearchPage(tenantId, statusFilter, status, keywordFilter, keyword, parentIdProvided, parentId, Pageable)` đẩy filter + `ORDER BY created_at DESC, id ASC` + LIMIT/OFFSET xuống DB. Order KHÔNG DFS (contract nới lỏng khi filter — UX search box). status=null → statusFilter=false (BUG-W03-032 hold: trả cả ACTIVE + INACTIVE). keyword ở service = escape LIKE metacharacters (`\`, `%`, `_`) → lower → wrap `%kw%` (parity Java `.contains()` gốc — user gõ literal `%`/`_` không bị treated là wildcard); JPQL so `LOWER(m.name) LIKE :kw ESCAPE '\'` OR `LOWER(m.code) LIKE :kw ESCAPE '\'`. `ORDER BY m.createdAt DESC NULLS LAST, m.id ASC` — parity DFS Java comparator (null createdAt sort xuống cuối, không nổi lên đầu như Postgres default DESC). parentIdProvided=true+parentId có giá trị → direct children của X (KHÔNG subtree, giữ contract cũ); parentIdProvided=true+parentId=null → chỉ root. Enrich page slice bằng 3 batch: parentName (`findByTenantIdAndIdIn`), childCount grouped (`countChildrenGroupedByParentId`), productCount grouped. Cost: nhánh A O(tenantSize) như trước, nhánh B O(page.size) tại DB + 3 batch enrich. Composite indexes: `idx_material_group_tenant_parent_created (tenant_id, parent_id, created_at DESC, id)` + `idx_material_group_tenant_status_created (tenant_id, status, created_at DESC, id)`."
    status: planned-W03
    active_callers: ["agg-garage-graph"]
    replaced_by: null
    request:
