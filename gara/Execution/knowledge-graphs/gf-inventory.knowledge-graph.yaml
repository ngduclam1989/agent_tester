change_log:
  - { date: "2026-07-07", summary: "FEATURE (theo yêu cầu trực tiếp user cuongnguyen_ac 2026-07-07 — cột 'Phân khúc' cho popup Gắn mã SKU + danh sách SKU đã gắn trong màn Danh mục sản phẩm > Chỉnh sửa/Chi tiết): additive-only — bổ sung field `segment` (enum `Segment` TIER1..TIER5, đã có sẵn ở `ProductEntity.segment` cột `product.segment` từ trước, KHÔNG cần migration DB, KHÔNG cần query mới vì Hibernate load full entity qua `productRepository.findAllByTenantIdAndIdInAndIsDeletedFalse` đã sẵn nạp cột này) vào 2 response DTO của layer catalog: (1) `SkuSearchResultItem` (endpoint V2-23 `sku-search` — popup Gắn mã SKU), mapper `SkuSearchService.toItem()` set `.segment(p.getSegment())`; (2) `SkuMappingResponse` (V2-8 `internalProduct.skuMappings[]` + V2-13 response 201 — danh sách SKU đã gắn), mapper `InternalProductService.toMapping()` set `.segment(product == null ? null : product.getSegment())` null-safe theo pattern R37 (FK treo/product bị soft-delete → trả null thay vì throw). KHÔNG đổi API path, KHÔNG đổi field cũ, giữ 100% backward-compat contract cho client cũ. Cascade doc: `docs/Architecture/api/gf-inventory-api.md` cần bump R40 (v33→v34) — 2 example JSON body (V2-8 `skuMappings[]` item + V2-13 response 201 + V2-23 items[]) thêm field `\"segment\": \"TIER2\"`; BFF `agg-garage-graph` GraphQL SDL `inventory-catalog.schema.ts` cần thêm `segment: String` (nullable — tier có thể chưa gán) vào `type InternalProductSkuMapping` + type kết quả `sku-search` — CR raise riêng cho BFF (chưa raise trong session này, out of scope backend). Test `InternalProductServiceTest`: bổ sung assertion `.segment` vào 3 test có sẵn (`get_populatesSkuAndNameFromProductTable` set TIER2 + assert TIER2, `get_leavesSkuAndNameNull_whenProductNotFound` assert isNull(), `mapSku_populatesSkuAndNameFromProductTable` set TIER3 + assert TIER3) — không thêm test file mới, không đổi tên test. `SkuSearchService` chưa có unit test riêng từ trước (module-level gap có sẵn), lần này không bổ sung — follow-up riêng nếu Product yêu cầu coverage cho V2-23. Contract giá trị: raw enum name `\"TIER1\".. \"TIER5\"` (không label VN) — FE tự map sang \"Phân khúc 1..5\" theo convention hiện có với các nơi khác dùng Segment enum (tồn tại từ trước, không phát sinh mới). GOTCHA: đây là lần thứ 3 tăng field cho `SkuMappingResponse` (R36 rename id, R37 populate sku+name, R38 rename name→productName, nay R40 add segment) — mọi lần đều share `toMapping()` static mapper qua 2 call site (V2-8 detail list qua `toMappings()` batch + V2-13 single mapping); pattern add-field an toàn nếu KHÔNG đổi shape các field cũ; nếu sau này cần field từ nguồn khác (không phải `product` table, ví dụ dữ liệu do user gán khi mapping) → cần thêm cột trên `internal_product_sku_mapping` + refactor mapper (out of scope).", author: "Main agent — segment field trên SkuSearchResultItem + SkuMappingResponse 2026-07-07" }
