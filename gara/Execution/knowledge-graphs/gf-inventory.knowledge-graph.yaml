  - { date: "2026-07-06", summary: "FEATURE (theo yêu cầu trực tiếp user \"độ rộng của từng cột phải dựa trên row có nội dung lớn nhất\", thay thế fixed-width lấy từ file mẫu BA đã làm trước đó): `InternalProductExportService` (V2-22 export .xlsx) đổi từ **fixed column width** (hằng số `COLUMN_WIDTHS` copy cứng từ file mẫu `cat-prod-export-template.xlsx`) sang **auto-size dựa trên nội dung thực tế** — gọi `sheet.autoSizeColumn(i)` (Apache POI, dùng `java.awt.font` metrics) cho từng cột SAU KHI đã ghi xong header + toàn bộ data row (thứ tự bắt buộc: autoSizeColumn cần dữ liệu đã có mặt trong cell mới đo được độ rộng cần thiết). Xoá hẳn `COLUMN_WIDTHS` (double[12]) và toàn bộ complexity `WRAP_TEXT_HEADER_COLUMNS`/`headerWrapStyle` (wrap-text chỉ cần khi cột bị ép fixed-width hẹp hơn nội dung header — auto-size khiến premise đó không còn đúng, giữ lại wrap sẽ là dead logic vì cột luôn tự nới đủ rộng để không cần wrap). THÊM MỚI static initializer `System.setProperty(\"java.awt.headless\", \"true\")` — `autoSizeColumn` đo text qua `java.awt.Font`/`FontRenderContext`, trên server/container không có display sẽ throw `HeadlessException` nếu JVM không tự nhận diện headless; set property tường minh để an toàn bất kể môi trường deploy có `DISPLAY` hay không. GOTCHA quan trọng: `sheet.autoSizeColumn(col)` mặc định (`useMergedCells=false`) **bỏ qua cell nằm trong merged region** khi đo độ rộng — nghĩa là title row (merged A1:L1, text dài ~18 ký tự) KHÔNG ảnh hưởng đến độ rộng cột A dù cell A1 chứa toàn bộ text title; nếu lỡ gọi overload `autoSizeColumn(col, true)` (useMergedCells=true) thì POI sẽ tính luôn merged cell content vào cột neo (cột đầu tiên của vùng merge) → cột A sẽ bị auto-size theo TOÀN BỘ text title 18 ký tự thay vì theo header/data thực tế — SAI, phải luôn dùng overload 1-tham-số (mặc định false) cho trường hợp có title row merge full-width. Font \"Times New Roman\" có thể không cài trên server Linux (không có MS fonts) — `autoSizeColumn` khi đó fallback sang font logic mặc định của JVM để đo, kết quả vẫn tỷ lệ thuận với độ dài text (đủ để test 'longer content → wider column' pass) nhưng độ rộng tuyệt đối có thể lệch nhẹ so với khi mở bằng Excel thật trên máy có cài Times New Roman — chấp nhận được vì yêu cầu là 'dựa trên nội dung', không yêu cầu pixel-perfect. Test: xoá 2 test cũ (`export_setsColumnWidths_perColumn` assert fixed width theo file mẫu, `export_wrapsTextOnDvtAndPricingMethodHeaderColumns_notOtherColumns` assert wrap — cả 2 không còn áp dụng), thêm 2 test mới `export_autoSizesColumnWidth_basedOnLongestContentInColumn` (export 2 lần — 1 lần tên sản phẩm ngắn, 1 lần tên rất dài — assert cột \"Tên sản phẩm\" ở lần dài PHẢI rộng hơn lần ngắn, chứng minh width theo nội dung thực chứ không phải hardcode) + `export_autoSizesColumnWidth_skipsMergedTitleRow` (assert cột STT KHÔNG bị auto-size phình to theo text title merged, pin đúng gotcha useMergedCells=false). 10/10 test PASS.", author: "Main agent — export column width switched to content-based autoSizeColumn 2026-07-06" }
