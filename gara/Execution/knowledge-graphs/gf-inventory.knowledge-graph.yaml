ify header + assert 3 row sort ABC: CN,JP,VN), `export_writesNatureReferenceSheet_withFourHardcodedRows` (đủ 4 row đúng thứ tự GOODS/TOOL/SERVICE/OTHER, chú ý TOOL=\"CCDC\" không có ngoặc), `export_writesUnitReferenceSheet_fromMdmUnitDirectory_sortedByCode` (2 unit UNIT_CAI/UNIT_CHIEC). Full test suite `InternalProductExportServiceTest` (5 test cũ + 3 test mới = 8) PASS.", author: "Main agent — internal-product export reference sheets Xuất xứ/Tính chất/ĐVT 2026-07-03" }
  - { date: "2026-07-02", summary: "PERFORMANCE (theo yêu cầu trực tiếp user, phát hiện ngay sau lần thêm `materialGroupName` ở trên): `InternalProductImportService` sửa N+1 query khi resolve `materialGroupCode` — trước đó `validateRow()` gọi `groupRepository.findByTenantIdAndCode(tenantId, code)` **1 lần/row** (tối đa 500 query/request theo `MAX_ROWS`), và `commit()` gọi LẠI y hệt **1 lần/row nữa** để lấy `materialGroupId` (tổng tối đa ~1000 query/request cho cùng 1 bảng `material_group`) — trong khi 2 lookup UNIT/COUNTRY cạnh đó đã đúng pattern batch-1-lần/request từ trước (`fetchNameToCode`). Fix: thêm `JpaMaterialGroupRepository.findByTenantIdAndCodeIn(Long tenantId, Collection<String> codes)` (derived query mới); `InternalProductImportService` thêm `fetchMaterialGroupsByCode(tenantId, items)` — gom `distinct materialGroupCode` non-blank trong toàn batch, gọi `findByTenantIdAndCodeIn` **đúng 1 lần** (0 lần nếu không row nào có `materialGroupCode`), build `Map<code, MaterialGroupEntity>`; `doValidate()` fetch map này 1 lần rồi truyền xuống cả `validateRow()` (thay `Optional<MaterialGroupEntity> group = groupRepository.findByTenantIdAndCode(...)` bằng `materialGroupByCode.get(code)`) LẪN `ValidatedBatch` (field mới `materialGroupByCode`) để `commit()` tái dùng map đã fetch thay vì query lại — loại bỏ hoàn toàn N+1 ở cả 2 method, còn đúng 1 query duy nhất/request bất kể số dòng. GOTCHA: khi thêm 1 lookup theo code mới vào 1 loop per-row đã có sẵn (như `materialGroupName` ở lần sửa trước), PHẢI kiểm tra xem lookup đó có bị gọi lại lần 2 ở method khác dùng chung `ImportRowResult`/`item` không (ở đây `commit()` đọc lại `item.getMaterialGroupCode()` độc lập với `validateRow()`) — nếu có, batch 1 lần rồi truyền map qua thay vì để browser/service gọi lại theo pattern cũ. Test: `InternalProductImportServiceTest` đổi 3 chỗ stub `groupRepository.findByTenantIdAndCode(...)` → `findByTenantIdAndCodeIn(tenantId, Set.of(code))`, thêm test mới `verify_fetchesMaterialGroupsInSingleBatchQuery_notPerRow` (5 rows cùng `materialGroupCode` → verify `findByTenantIdAndCodeIn` gọi đúng 1 lần, `findByTenantIdAndCode` không bao giờ được gọi).", author: "Main agent — verify-import materialGroupCode N+1 fix 2026-07-02" }
  - { date: "2026-07-02", summary: "FEATURE (theo yêu cầu trực tiếp user — FE cần hiển thị cặp code+tên trong bảng preview verify-import, thay vì tự suy luận `item.mainUnitCode`/`item.originCode` thực chất đang là tên hiển thị): `InternalProductImportService.validateRow()` (V2-20 verify-import) mutate trực tiếp `ImportRowDto item` (cùng object reference được echo lại trong `ImportRowResult.item`) khi resolve MDM thành công — trước khi ghi đè, lưu tên hiển thị gốc FE gửi vào field mới `item.mainUnitName`/`item.originDisplayName`, rồi ghi đè `item.mainUnitCode`/`item.originCode` bằng CODE thật đã resolve (trước đó code resolve chỉ nằm ở 2 field rời `ImportRowResult.resolvedMainUnitCode`/`resolvedOriginCode`, không có tên hiển thị nào được trả về). Nhánh `materialGroupCode` (đã fetch sẵn `MaterialGroupEntity` để validate ACTIVE) nay set thêm `item.materialGroupName = group.getName()` khi hợp lệ — trước đó entity bị fetch rồi bỏ, không map ra name. Khi resolve THẤT BẠI, `mainUnitCode`/`originCode` GIỮ NGUYÊN giá trị gốc (tên hiển thị lỗi) để error row vẫn hiển thị đúng input gây lỗi cho FE — `mainUnitName`/`originDisplayName`/`materialGroupName` để `null`. `CatalogDtos.java`: `ImportRowDto` thêm 3 field mới (`mainUnitName`, `originDisplayName`, `materialGroupName`); `ImportRowResult` XOÁ 2 field `resolvedMainUnitCode`/`resolvedOriginCode` (thêm cùng ngày ở lần sửa trước, chưa có consumer khác ngoài `InternalProductImportService`/test của nó — xoá an toàn, thay bằng đọc trực tiếp `item.getMainUnitCode()`/`item.getOriginCode()` vì item đã mang code thật sau `validateRow()`). `commit()` đổi `row.getResolvedMainUnitCode()`/`getResolvedOriginCode()` → `row.getItem().getMainUnitCode()`/`getItem().getOriginCode()`. GOTCHA: field DTO dùng chung cho cả request (input echo) VÀ response (kết quả resolve) — mutate object reference sau validate là cách hợp lệ để 'nâng cấp' echo thành kết quả đã resolve mà không cần field rời; nhưng phải cẩn thận thứ tự set (đọc giá trị gốc TRƯỚC khi ghi đè cùng field) để không mất display-name gốc. Test: `InternalProductImportServiceTest` đổi assertion `result.getResolvedMainUnitCode()`/`getResolvedOriginCode()` → `result.getItem().getMainUnitCode()`/`getItem().getOriginCode()`, thêm assertion `mainUnitName`/`originDisplayName`/`materialGroupName` vào test verify thành công hiện có, thêm 3 test mới: `verify_leavesMaterialGroupNameNull_whenMaterialGroupCodeAbsent`, `verify_keepsRawDisplayNameOnMainUnitCode_whenUnitInvalid`, `verify_keepsRawDisplayNameOnOriginCode_whenOriginInvalid`.", author: "Main agent — verify-import response mainUnitName/materialGroupName/originDisplayName 2026-07-02" }
  - { date: "2026-07-02", summary: "BUSINESS-RULE-CHANGE + BUGFIX (user rà soát trực tiếp quy tắc đặt mã sản phẩm/nhóm VTHH, cung cấp bảng rule chốt): (1) **BR-CAT-GRP-009 đảo ngược** — rule cũ (BR-GF-INVENTORY-CATALOG v19) cho phép đổi nhóm cha (\"Thuộc nhóm\") tự do ở Edit, chỉ chặn vòng lặp phân cấp (self/descendant); nay đổi thành **immutable** — nhóm cha chỉ chọn 1 lần lúc tạo (FEAT-CAT-GRP-CREATE), khóa hoàn toàn ở Edit. Fix `MaterialGroupService.update()`: bỏ nhánh cho phép đổi `parentId` kèm cycle-check + validate `parentId` mới phải ACTIVE (3 guard cũ: self-reference/descendant-cycle/parent-status), thay bằng 1 guard duy nhất — reject nếu `request.getParentId() != null && !Objects.equals(request.getParentId(), entity.getParentId())` → `ERR-INV-003` (\"Nhóm cha không được phép thay đổi sau khi tạo\"); bỏ luôn `entity.setParentId(newParent)`. Guard cycle-detection cũ (self/descendant) vẫn là subset của guard mới (mọi thay đổi bị chặn nên cycle tự động bị chặn theo), không cần giữ code riêng. Đồng bộ `BR-GF-INVENTORY-CATALOG.md` (v19→v20) + `FEAT-CAT-GRP-EDIT.md` (§3 AC-4, §4.1, §9, error-code mapping, test scope) + `MaterialGroupServiceTest` (đổi tên `update_rejectsCycleViaDescendant`→`update_rejectsDescendantAsParent`, thêm `update_rejectsAnyParentChange_evenNonCyclicTarget` + `update_allowsUnchangedParentId`). (2) **BUGFIX BR-CAT-PROD-022 (import validate nhóm VTHH) — gap giữa doc đã đúng từ trước (v12 2026-06-24) và code chưa implement đủ**: `InternalProductImportService.validateRow()` trước đây chỉ check `materialGroupCode` **tồn tại** (`groupRepository.findByTenantIdAndCode(...).isEmpty()`), BỎ SÓT check `status=ACTIVE`, và dùng string lỗi generic `\"ERR-CMN-validation — Nhóm VTHH không tồn tại\"` thay vì mã lỗi domain-specific đã được BA chốt từ trước (`ERR-INV-043`, vốn CHƯA từng được khai báo trong `CatalogErrorCode.java` — hằng số bị thiếu hoàn toàn dù đã có trong BR doc + ERROR-CODE-REGISTRY). Fix: thêm `CatalogErrorCode.IMPORT_GROUP_INVALID = \"ERR-INV-043\"`; `validateRow()` đổi thành check `group.isEmpty() || group.get().getStatus() != CatalogStatus.ACTIVE` → dùng `IMPORT_GROUP_INVALID`. Đồng bộ `FEAT-CAT-PROD-IMPORT.md` §3 AC-5 row 6 (ERR-CMN-validation → ERR-INV-043) + `error_codes` registry dưới đây + `InternalProductImportServiceTest` (thêm `verify_flagsMissingMaterialGroup_whenCodeNotFound`, `verify_flagsInactiveMaterialGroup`, `verify_acceptsActiveMaterialGroup` — trước đó KHÔNG có test nào cho nhánh materialGroupCode dù đã có code từ trước). GOTCHA: khi 1 BR đã được document đúng ở master BR file nhưng error-code hằng số liên quan lại thiếu trong `CatalogErrorCode.java`, đó là tín hiệu code chưa bao giờ được implement đủ theo doc — luôn cross-check `CatalogErrorCode.java` có đủ hằng số cho MỌI mã lỗi được cite trong BR-GF-INVENTORY-CATALOG.md trước khi kết luận 1 rule \"đã implement đúng\".", author: "Main agent — BR-CAT-GRP-009 reversal + BR-CAT-PROD-022 gap fix 2026-07-02" }
  - { date: "2026-07-02", summary: "BUGFIX+FEATURE: `InternalProductImportService.validateRow()` validate sai `originCode` (Xuất xứ) — tự áp regex `^[A-Z]{3}$` (giả định ISO 3166-1 alpha-3, KHÔNG có trong BR-CAT-PROD-023) khiến `mdmValidationService.isValidOriginCode(...)` bị Java `||` short-circuit, KHÔNG BAO GIỜ được gọi khi mã không khớp regex — mọi mã 2 ký tự hợp lệ trong master (vd \"VN\"/\"US\") bị chặn nhầm trước khi kịp query gf-erp-mdm. Root cause thật sự sâu hơn: user xác nhận **FE gửi lên NAME (tên hiển thị dropdown), không phải CODE**, cho cả `mainUnitCode` VÀ `originCode` trong import — nên toàn bộ cách validate cũ (so giá trị FE gửi với tập CODE) sai về bản chất input, không chỉ riêng regex. Fix (PHẠM VI: chỉ import, KHÔNG đụng `InternalProductService.create()/update()` — vẫn coi giá trị FE gửi là code theo quyết định user): `InternalProductImportService` bỏ dependency `CatalogMdmValidationService` (không còn dùng ở đâu khác trong file), thêm `GfErpMdmClient` + cache in-process 5 phút CÔ LẬP riêng (`AtomicReference<CachedDirectoryCodes>`, record `nameToCode: Map<String,String>` — đảo chiều so với cache `codeToName` bên `InternalProductExportService`, cùng pattern isolated-cache đã áp dụng cho export) — fetch `UNIT`+`COUNTRY` directory 1 lần/request (đặt SAU check `MAX_ROWS=500` để tránh phí remote call khi request bị reject sớm), build `Map<name,code>`, dùng trực tiếp `Map.get(displayName)` để vừa validate tồn tại vừa resolve code — bỏ hẳn regex format check. Khác export (fail-open trả rỗng vì là read/display path), import là write-path gate nên fail-closed đúng convention `CatalogMdmValidationService.fetchDirectory()`: còn cache cũ → fail-open trả cache cũ; KHÔNG cache + MDM down → throw `ERR-CMN-mdm-unavailable` (503), chặn import. `ImportRowResult` (CatalogDtos.java) thêm 2 field additive `resolvedMainUnitCode`/`resolvedOriginCode` mang code đã resolve từ `validateRow()` sang `commit()` — entity vẫn lưu CODE (không lưu name) theo quyết định user, `commit()` đổi `.mainUnitCode(item.getMainUnitCode())`/`.originCode(item.getOriginCode())` → `.mainUnitCode(row.getResolvedMainUnitCode())`/`.originCode(row.getResolvedOriginCode())`. Test: InternalProductImportServiceTest viết lại toàn bộ 5 test (input đổi từ code giả sang tên hiển thị thực tế \"Cái\"→PCS, \"Nhật Bản\"→JPN qua `@Mock GfErpMdmClient` + helper `mockDirectory()`) + thêm test mới `commit_persistsResolvedUnitAndOriginCode_notRawDisplayName`. GOTCHA: khi 1 field REST DTO đổi ý nghĩa nội dung (code↔name) do thay đổi phía FE, PHẢI rà soát TẤT CẢ nơi field đó được validate/dùng (không chỉ nơi phát hiện bug report ban đầu) — ở đây `mainUnitCode`/`originCode` còn được dùng ở `InternalProductService.create()/update()` (qua `mdmValidationService.validateUnitCode()`/`validateOriginCodeIfPresent()`, vẫn coi là code) — CHƯA đồng bộ theo yêu cầu user (ngoài phạm vi lần sửa này, cần xác nhận riêng nếu FE cũng đổi format ở luồng create/update).", author: "Main agent — internal-product import name→code MDM resolution fix 2026-07-02" }
  - { date: "2026-07-02", summary: "FEATURE (đóng gap hiển thị + cross-boundary read call mới tới gf-erp-mdm, theo yêu cầu trực tiếp user, chú trọng performance): `InternalProductExportService` (V2-22 export .xlsx) resolve cột **ĐVT** (`mainUnitCode`) và **Xuất xứ** (`originCode`) từ raw code sang tên tiếng Việt qua gf-erp-mdm `POST /protected/catalog/v1/inquiry` (`GfErpMdmClient.inquiryCatalog`, directory `UNIT`/`COUNTRY`); cột **Tính chất** (`nature`) đổi từ raw enum name sang nhãn tiếng Việt theo BR-CAT-PROD-019 (GOODS→\"Vật tư hàng hóa\", TOOL→\"CCDC (Công cụ dụng cụ)\", SERVICE→\"Dịch vụ\", OTHER→\"Khác\", helper `natureLabel()` cùng style `pricingMethodLabel()`/`statusLabel()` có sẵn). Performance: thêm cache in-process 5 phút RIÊNG cho export (`AtomicReference<CachedDirectoryNames>` + record `codeToName: Map<String,String>`, TTL `CACHE_TTL=5min`, theo đúng mandate kiến trúc `INTEG-EXT-gf-inventory.md` §13a) — gọi `inquiryCatalog` tối đa **2 lần/export request** (1 lần/directory UNIT+COUNTRY, cache-hit thì 0 lần), KHÔNG theo từng dòng/từng mã (tránh N+1 remote call trên cap 1.000 dòng BR-CAT-PROD-024) — mirror pattern `InventoryDocPrintService.resolveUnitNames()` (fetch-toàn-directory-1-lần) cộng thêm TTL cache. Quyết định: cache CÔ LẬP, KHÔNG tái dùng/sửa `CatalogMdmValidationService` (service validate dùng chung cho create/update/import) — tránh đụng logic validate đang chạy ổn định, đổi lại có 2 cache độc lập cùng cache UNIT/COUNTRY song song trong hệ thống (biết trước, chấp nhận theo quyết định user). Bonus fix: phát hiện `CatalogInquiryRequest` (DTO gọi gf-erp-mdm) thiếu field `page`/`size` → server mặc định `BaseSearchRequest` trả 20 dòng đầu directory, mã ngoài top-20 không resolve được — thêm field `size` (Integer, additive) vào `CatalogInquiryRequest`, set `DIRECTORY_FETCH_SIZE=1000` CHỈ ở call site export mới; theo quyết định user, KHÔNG sửa 2 call site cũ (`CatalogMdmValidationService.fetchDirectory`, `InventoryDocPrintService.resolveUnitNames`) — bug top-20 truncation vẫn còn tồn tại ở 2 nơi đó, cần follow-up riêng nếu muốn đồng bộ. Fallback khi mã không resolve được (MDM lỗi hoặc mã không có trong directory): để trống (không fallback về raw code) — null-guard riêng cho `mainUnitCode`/`originCode` null (tránh NPE vì `Map.of()` fallback rỗng không chấp nhận `getOrDefault(null,...)`). Test: InternalProductExportServiceTest thêm 3 test (export_resolvesUnitAndCountryNames_viaMdmDirectoryLookup — verify inquiryCatalog gọi đúng 2 lần dù 5 rows/4 mã phân biệt; export_leavesUnitAndCountryBlank_whenCodeNotInMdmDirectory; export_writesNatureColumn_withVietnameseLabels) + thêm `@Mock GfErpMdmClient` + helper `mockDirectory()`.", author: "Main agent — internal-product export UNIT/COUNTRY name resolution + nature label 2026-07-02" }
  - { date: "2026-07-02", summary: "CORRECTION (theo bảng mapping tường minh user cung cấp, sửa lại quyết định vị trí cột của lần sửa trước): `InternalProductExportService` (V2-22 export .xlsx) di chuyển cột **\"Phương pháp tính giá\"** từ vị trí chèn giữa (sau ĐVT, trước Thương hiệu — suy luận theo thứ tự liệt kê text BR-CAT-PROD-018) sang **append cuối cùng** (sau Thông số kỹ thuật, trước Trạng thái). Thứ tự cột cuối cùng (12 cột, đã xác nhận đúng qua mapping user): STT, Mã nội bộ, Tên sản phẩm, ĐVT, Thương hiệu, Xuất xứ, Tính chất, Nhóm vật tư/hàng hóa, Quy cách sản phẩm, Thông số kỹ thuật, Phương pháp tính giá, Trạng thái. Implementation: đổi lại index `row.createCell(4..10)` trong `generate()` cho khớp — cell 4-9 = brand/originCode/nature/materialGroupCode/productSpec/technicalSpec (dịch lùi 1 so với lần trước), cell 10 = `pricingMethodLabel(...)` (chuyển từ cell 4 xuống cuối), cell 11 = `statusLabel(...)` (giữ nguyên). 2 helper method `pricingMethodLabel()`/`statusLabel()` không đổi logic. Test: InternalProductExportServiceTest.export_writesPricingMethodAndStatusColumns_withVietnameseLabels đổi assertion `getCell(4)` → `getCell(10)` cho header + data row cột pricingMethod. GOTCHA: khi suy luận thứ tự cột từ text mô tả business rule dạng liệt kê tự do (không phải bảng có số thứ tự tường minh), nên xác nhận lại với user/BA thay vì tự suy diễn thứ tự chèn giữa — thứ tự thực tế mong muốn có thể khác thứ tự liệt kê trong câu văn.", author: "Main agent — internal-product export column order correction 2026-07-02" }
  - { date: "2026-07-02", summary: "FEATURE (đóng gap doc-vs-code tồn tại từ trước, theo yêu cầu trực tiếp user): `InternalProductExportService` (V2-22 export .xlsx) thêm 2 cột còn thiếu so với BR-CAT-PROD-018 — **\"Phương pháp tính giá\"** và **\"Trạng thái\"** — BR-CAT-PROD-018 đã liệt kê đủ 11 cột nghiệp vụ từ trước (mã nội bộ, tên sản phẩm, ĐVT, phương pháp tính giá, thương hiệu, xuất xứ, tính chất, nhóm vật tư/hàng hóa, quy cách sản phẩm, thông số kỹ thuật, trạng thái) nhưng code chỉ implement 9 cột, thiếu 2 cột export-only này. Thứ tự cột cuối cùng (12 cột kể cả STT): STT, Mã nội bộ, Tên sản phẩm, ĐVT, Phương pháp tính giá, Thương hiệu, Xuất xứ, Tính chất, Nhóm vật tư/hàng hóa, Quy cách sản phẩm, Thông số kỹ thuật, Trạng thái. Implementation: thêm 2 private helper `pricingMethodLabel(PricingMethod)` (PWA→\"Bình quân cuối kỳ\", SI→\"Đích danh\", FIFO→\"Nhập trước xuất trước\", MA→\"Bình quân tức thời\") và `statusLabel(CatalogStatus)` (ACTIVE→\"Đang hoạt động\", INACTIVE→\"Ngừng hoạt động\", theo đúng BR-CAT-PROD-007) — cả 2 mapping đặt cục bộ trong `InternalProductExportService`, KHÔNG đụng domain enum `PricingMethod`/`CatalogStatus` dùng chung (theo quyết định user: giữ thay đổi tối thiểu, không mở rộng phạm vi ra domain layer). Header HEADERS array đã được đổi sang nhãn tiếng Việt cho toàn bộ cột (thay đổi ngoài phiên làm việc trước đó, không phải do lần sửa STT/reorder) — 2 cột mới theo cùng style. Test: InternalProductExportServiceTest thêm export_writesPricingMethodAndStatusColumns_withVietnameseLabels + cập nhật lại header assertion cũ (\"code\"/\"name\" → \"Mã nội bộ\"/\"Tên sản phẩm\") cho khớp header tiếng Việt hiện tại.", author: "Main agent — internal-product export pricingMethod+status columns 2026-07-02" }
  - { date: "2026-07-02", summary: "FEATURE (follow-up trực tiếp ngay sau khi thêm cột STT, theo yêu cầu user): `InternalProductExportService` (V2-22 export .xlsx) đổi thứ tự cột — di chuyển `brand` + `originCode` lên trước `nature` + `materialGroupCode`. Thứ tự cột mới: `STT, code, name, mainUnitCode, brand, originCode, nature, materialGroupCode, productSpec, technicalSpec` (trước đó: `STT, code, name, mainUnitCode, nature, materialGroupCode, brand, originCode, productSpec, technicalSpec`). Implementation: swap 2 khối trong `HEADERS` array + đổi thứ tự lệnh `row.createCell(4..7)` trong `generate()` tương ứng (cell 0-3 STT/code/name/mainUnitCode và cell 8-9 productSpec/technicalSpec không đổi). Thuần đổi vị trí hiển thị cột — KHÔNG đổi tập cột hay logic resolve `materialGroupCode` (`resolveGroupCode()` giữ nguyên). Không cần sửa `InternalProductExportServiceTest` — test hiện tại chỉ assert cell 0/1/2 (STT/code/name), không đụng cột bị dịch chuyển, vẫn pass nguyên trạng.", author: "Main agent — internal-product export column reorder 2026-07-02" }
  - { date: "2026-07-02", summary: "FEATURE (theo yêu cầu trực tiếp user, không phải BA-sourced BR change): `InternalProductExportService` (V2-22 export .xlsx) thêm cột **STT** (số thứ tự dòng, 1..n) làm cột đầu tiên trong `HEADERS` — template export nay 10 cột thay vì 9 (`STT` + 9 cột cũ: `code, name, mainUnitCode, nature, materialGroupCode, brand, originCode, productSpec, technicalSpec`). Implementation: thêm counter `stt` trong loop ghi row (`generate()`), dịch toàn bộ `row.createCell(0..8)` cũ sang `row.createCell(1..9)`. Thuần tính năng UX hỗ trợ đối chiếu/đếm dòng khi mở file Excel — KHÔNG đổi business rule cột dữ liệu BR-CAT-PROD-018 (theo quyết định user: chỉ sửa code + KG, không động vào BR-GF-INVENTORY-CATALOG.md vì đó là tài liệu do Business Authority chốt). Test mới: InternalProductExportServiceTest (test class đầu tiên cho service này — trước đây chưa có coverage) — export_writesSttColumnFirst_withHeaderAndSequentialValues, đọc lại workbook qua Apache POI để assert header row + giá trị STT tăng dần đúng thứ tự.", author: "Main agent — internal-product export STT column 2026-07-02" }
  - { date: "2026-07-01", summary: "FEATURE-SYNC (R38, đóng nốt flag còn lại từ R36/R37 theo yêu cầu trực tiếp của product): `SkuMappingResponse.name` (CatalogDtos.java) đổi tên → `productName`, khớp đúng BFF GraphQL SDL `agg-garage-graph/src/graphql/modules/inventory-catalog/inventory-catalog.schema.ts` — `type InternalProductSkuMapping { id: Int! productId: Int! sku: String! productName: String }` — type này KHÔNG có field `name`. R36/R37 đã phát hiện gap này nhưng chủ động để lại chưa sửa (severity thấp hơn vì `productName` nullable phía GraphQL, chỉ resolve null âm thầm chứ không crash) — nay đóng dứt điểm theo chỉ đạo trực tiếp. Fix: `InternalProductService.toMapping()` builder `.name(product == null ? null : product.getName())` → `.productName(...)` (hành vi null-safe giữ nguyên). KHÔNG thêm field `name` song song để backward-compat — DTO này đã có tiền lệ mọi field khác (`id`, `sku`, `productId`) đều đặt tên khớp 1:1 với GraphQL SDL, giữ 1 tên duy nhất nhất quán, tránh hack tương thích ngược không cần thiết. Doc: gf-inventory-api.md R38 (v31→v32) — V2-8 `skuMappings[]` example + V2-13 response 201 example `\"name\"` → `\"productName\"`. Test: InternalProductServiceTest 3 chỗ assertion (get_populatesSkuAndNameFromProductTable, get_leavesSkuAndNameNull_whenProductNotFound, mapSku_populatesSkuAndNameFromProductTable) đổi `getName()` → `getProductName()`.", author: "Main agent — SkuMappingResponse.name→productName rename R38 2026-07-01" }
  - { date: "2026-07-01", summary: "BUGFIX (R37, đóng flag chưa xử lý để lại từ R36): `SkuMappingResponse.sku`/`.name` (V2-8 `skuMappings[]` + V2-13 response) luôn trả null — user phát hiện qua curl trực tiếp `GET /api/v2/internal-products/{id}` trên Swagger local. Root cause: `InternalProductService.toMapping()` chưa từng set 2 field này; `sku`/`name` là cột bảng legacy `product` (SKU master, ADR-017 Q2), CHỈ truy được qua FK `internal_product_sku_mapping.product_id` — thiếu hẳn bước lookup. Fix: `toMapping()` thêm tham số thứ 2 `ProductEntity product`, set `.sku(product == null ? null : product.getSku())` / `.name(product == null ? null : product.getName())` (null-safe — FK treo/product bị soft-delete thì trả null thay vì throw). Thêm private helper `toMappings(tenantId, List<InternalProductSkuMappingEntity>)` batch-resolve qua `JpaProductRepository.findAllByTenantIdAndIdInAndIsDeletedFalse` (method tenant-scoped đã có sẵn, tái dùng nguyên từ `hasActivity()`) — dùng chung cho cả 2 call site: `get()` (V2-8, list, batch tránh N+1) và `mapSku()` (V2-13, 1 mapping mới, gọi cùng helper với list 1 phần tử). Mức độ nghiêm trọng: KHÔNG chỉ cosmetic — GraphQL SDL khai báo `sku: String!` (non-nullable) trên `InternalProductSkuMapping`, nên null REST value sẽ crash resolver giống hệt lớp lỗi R33/R34/R36 ngay khi có client query field này. Test mới: InternalProductServiceTest (get_populatesSkuAndNameFromProductTable, get_leavesSkuAndNameNull_whenProductNotFound, mapSku_populatesSkuAndNameFromProductTable). Doc: gf-inventory-api.md R37 (v30→v31) — KHÔNG cần sửa example JSON (V2-8/V2-13 đã show sẵn giá trị sku/name hợp lý từ trước — doc đúng về mặt ý định, chỉ code sai). GOTCHA: khi thêm field mới vào 1 DTO nested-list được build qua static mapper method dùng chung ở nhiều call site (list-case + single-create-case), cân nhắc tách 1 private instance helper batch-fetch dùng chung thay vì lặp lại N+1 query ở từng nơi gọi — instance method mới truy cập được `productRepository` field, static method thuần (`toMapping`) chỉ nên nhận đủ dữ liệu làm tham số. Flag CHƯA xử lý (kế thừa từ R36, vẫn chưa đụng tới): `SkuMappingResponse.name` vs GraphQL SDL `productName` field-name mismatch — field nullable phía GraphQL nên chỉ resolve null âm thầm, không crash, chưa đủ ưu tiên để sửa lần này.", author: "Main agent — SkuMappingResponse sku/name populate fix R37 2026-07-01" }
  - { date: "2026-07-01", summary: "BUGFIX (R36, proactively verified via BFF SDL trước khi ship, cùng root cause R33/R34): `SkuMappingResponse` (V2-8 `skuMappings[]` + V2-13 response, CatalogDtos.java) đổi tên field `internalProductId` → `id`, ĐỔI CẢ Ý NGHĨA GIÁ TRỊ: trước đây lấy `e.getInternalProductId()` (FK trỏ internal_product cha), nay lấy `e.getId()` (PK của chính row `internal_product_sku_mapping`). Root cause giống hệt R33 (ConversionUnitResponse.unitId→id): BFF `agg-garage-graph` GraphQL SDL `inventory-catalog.schema.ts` khai báo `type InternalProductSkuMapping { id: Int! productId: Int! sku: String! productName: String }` — `id` non-nullable, KHÔNG có field `internalProductId` (giống `InternalProductConversionUnit`/`InternalProductAttachment`, cả 2 đều không expose FK cha). Khác R33/R34 ở chỗ: lần này verify TRỰC TIẾP schema BFF trước khi sửa (không đợi incident report), và giá trị field phải đổi theo (không chỉ đổi tên) — vì nếu giữ nguyên giá trị FK cũ dưới tên `id` mới, mọi sku mapping của cùng 1 internal_product (constraint `uk_ipsm_internal_product(internal_product_id, product_id)` cho phép nhiều row cùng internal_product_id) sẽ có `id` TRÙNG NHAU → vỡ list-key/cache uniqueness phía GraphQL/FE. Fix: `InternalProductService.toMapping()` builder `.internalProductId(e.getInternalProductId())` → `.id(e.getId())`. Doc: gf-inventory-api.md R36 (v29→v30) — V2-8 `skuMappings[]` example thêm field `id` (trước đây thiếu hẳn); V2-13 response 201 example `internalProductId`→`id`. KHÔNG cần sửa `internal-product-sku-mapping-create` (V2-13) purpose/response schema trong KG — đã ghi `response.schema.id: long` sẵn từ trước (đã đúng, không phải do fix này). GOTCHA: khi rename field theo pattern R33/R34 (align với GraphQL `id`), PHẢI kiểm tra xem field cũ có đang mang GIÁ TRỊ của chính resource hay của resource KHÁC (FK) — nếu là FK thì rename kèm đổi nguồn giá trị, không chỉ đổi label, nếu không sẽ tạo ID trùng lặp giữa các item cùng list. Flag chưa xử lý (out of scope, phát hiện khi audit SDL): `SkuMappingResponse.name`/`.sku` chưa từng được `toMapping()` populate (pre-existing gap); GraphQL SDL kỳ vọng `productName` trong khi REST DTO có `name` — field nullable nên chỉ resolve null âm thầm, không crash, nhưng nên follow-up riêng.", author: "Main agent — SkuMappingResponse.internalProductId→id rename R36 2026-07-01" }
  - { date: "2026-07-01", summary: "FEATURE-SYNC (R35, reverses R11/R34 \"unchanged\" decision per direct product instruction): `AttachmentRequest` (V2-18 request body, CatalogDtos.java) đổi tên 3 field cho khớp hoàn toàn với `AttachmentCreateRequest` (V2-10 inline)/`AttachmentResponse` — `sizeBytes`→`fileSizeBytes`, `storageUrl`→`fileUrl`, `kind`→`attachmentKind`. Trước đó (R11 2026-06-24, tái xác nhận ở R34 sáng nay) đây là quyết định CÓ CHỦ ĐÍCH giữ nguyên field cũ cho request — BA/product đã đổi quyết định trong cùng ngày. Fix: `InternalProductService.addAttachment()` getter calls `.getStorageUrl()/.getSizeBytes()/.getKind()` → `.getFileUrl()/.getFileSizeBytes()/.getAttachmentKind()`; `persistAttachment()` shared helper KHÔNG đổi (tên tham số local riêng, dùng chung với V2-10). Effect: 2 item shape attachments (V2-10 inline tại create vs V2-18 post-create) từ nay field-name-identical (`fileName/fileType/fileSizeBytes/fileUrl/attachmentKind`) — dù vẫn là 2 DTO/endpoint riêng, KHÔNG hợp nhất code. Cascade doc: gf-inventory-api.md R35 (v28→v29) — V2-18 request JSON example + field table đổi tên, bổ sung field `attachmentKind` trước đây có trong code nhưng chưa từng document (optional, default suy theo MIME — hành vi cũ, không phải logic mới); V2-10 `attachments[]` note đổi từ \"khác V2-18\" thành \"trùng V2-18\". Test: InternalProductServiceTest 3 chỗ builder `AttachmentRequest` (`addAttachment_rejectsOversizeAbove30MB`, `addAttachment_rejectsInvalidFileType`, `addAttachment_savesAttachment_onSuccess`) đổi builder method tương ứng. GOTCHA: khi 1 request DTO đã được product/BA xác nhận \"giữ nguyên by design\" trong 1 changelog entry, đừng coi đó là bất biến vĩnh viễn — quyết định có thể đảo ngược trong cùng phiên làm việc; luôn kiểm tra yêu cầu mới nhất của user thay vì tin vào doc lịch sử khi 2 nguồn xung đột.", author: "Main agent — AttachmentRequest field rename R35 2026-07-01" }
  - { date: "2026-07-01", summary: "BUGFIX (follow-up của ConversionUnitResponse.unitId→id): `AttachmentResponse` (CatalogDtos.java) đổi tên 3 field cho khớp GraphQL BFF `agg-garage-graph` query `attachments { id fileUrl fileName fileType fileSizeBytes attachmentKind }` — `sizeBytes`→`fileSizeBytes`, `storageUrl`→`fileUrl`, `kind`→`attachmentKind` (`id`/`fileName`/`fileType` đã khớp sẵn). Cùng root cause với R33 (ConversionUnitResponse): field name lệch giữa REST response và GraphQL non-nullable resolver → risk null-reject y hệt lỗi conversionUnits[].id đã gặp, dù chưa report riêng cho attachments[]. Fix: `InternalProductService.toAttachment()` builder `.sizeBytes/.storageUrl/.kind` → `.fileSizeBytes/.fileUrl/.attachmentKind`. **KHÔNG đổi** `AttachmentRequest` (V2-18 request body — `fileName/fileType/sizeBytes/storageUrl`, thiết kế R11) — chỉ response DTO đổi, áp dụng mọi nơi trả `attachments[]` (V2-8/V2-10/V2-11 detail + V2-18 create response) vì dùng chung `toAttachment()`. Bonus: đóng gap tiềm ẩn — R31 changelog trước đó đã mô tả response V2-10 create trả attachments theo shape `fileUrl/fileSizeBytes/attachmentKind`, nhưng code thực tế chưa khớp cho tới fix này. Cascade doc: gf-inventory-api.md R34 (v27→v28) — V2-18 response example + V2-8 abbreviated example đổi tên field tương ứng. GOTCHA: khi share 1 response DTO (`toAttachment()`) qua nhiều endpoint (V2-8/10/11/18), đổi field name ảnh hưởng TẤT CẢ — phải grep toàn bộ call site trước khi rename, không chỉ 1 nơi report lỗi. Test mới: InternalProductServiceTest.get_mapsAttachmentEntityFieldsToResponse.", author: "Main agent — AttachmentResponse field rename R34 2026-07-01" }
  - { date: "2026-07-01", summary: "BUGFIX: GraphQL `getInternalProduct` (agg-garage-graph BFF) 500 \"Cannot return null for non-nullable field InternalProductConversionUnit.id\" tại `data.conversionUnits[0].id`. Root cause: REST response DTO `ConversionUnitResponse` (CatalogDtos.java) đặt tên field định danh row là `unitId`, không phải `id` — backend value luôn correctly populated (`toConversionUnit()` map đúng `entity.getId()`), nhưng BFF GraphQL resolver `InternalProductConversionUnit.id` (non-nullable) đọc field `id` từ REST JSON, không match `unitId` → null → GraphQL reject. Fix (theo quyết định: sửa phía gf-inventory thay vì bắt BFF đổi theo) — rename `ConversionUnitResponse.unitId` → `id`; `InternalProductService.toConversionUnit()` builder `.unitId(...)` → `.id(...)`. Cascade doc: gf-inventory-api.md R33 (v26→v27) — 2 response JSON example (V2-8 `conversionUnits[]` item + V2-15 create response, V2-16 dùng chung shape) đổi `\"unitId\": 9001` → `\"id\": 9001`. **KHÔNG đổi** URL path param `{unitId}` trên V2-16/V2-17 (`/conversion-units/{unitId}`) — đây là convention riêng (R8 D-E path rename), khác concept với response body field, giữ nguyên. GOTCHA: khi 1 DTO có field vừa là surrogate-key-of-this-resource vừa dễ nhầm với FK-tới-resource-khác (ở đây field tên `unitId` nhưng thực chất là PK của chính conversion_unit row, không phải FK tới bảng UNIT master), nên đặt tên `id` sát REST/GraphQL convention chuẩn thay vì domain-prefixed để tránh lệch kỳ vọng phía BFF/GraphQL. Test mới: InternalProductServiceTest.get_mapsConversionUnitEntityIdToResponseId.", author: "Main agent — ConversionUnitResponse.unitId→id rename R33 2026-07-01" }
  - { date: "2026-07-01", summary: "BUGFIX: POST /api/v2/internal-products (V2-10) reject 400 \"Unrecognized field pricingMethod\" khi client gửi `pricingMethod` lúc tạo mới. Root cause: `InternalProductUpdateRequest` (V2-11) đã có field `pricingMethod` từ trước và `InternalProductService.update()` respect giá trị client gửi không hề guard theo BR-CAT-PROD-010 (\"không cho phép sửa\"), nhưng `InternalProductCreateRequest` (V2-10) chưa từng có field này + `create()` hard-code `.pricingMethod(PricingMethod.PWA)` — Jackson reject field lạ (`FAIL_ON_UNKNOWN_PROPERTIES` mặc định) vì DTO không có chỗ nhận. Fix: thêm `pricingMethod` (optional, `PricingMethod` enum) vào `InternalProductCreateRequest` (CatalogDtos.java); `create()` đổi thành `request.getPricingMethod() == null ? PWA : request.getPricingMethod()` — cùng pattern optional-with-default đã dùng cho `status`, đồng nhất với `update()` đã có sẵn. Doc: `gf-inventory-api.md` R32 (v25→v26) thêm `pricingMethod` vào V2-10 request example + validation bullet (mirror V2-11 wording). `BR-GF-INVENTORY-CATALOG.md` BR-CAT-PROD-010 reword (v18→v19): bỏ \"không cho phép sửa\" (không còn khớp thực tế ở cả create lẫn update), giữ nguyên SI/FIFO/MA là placeholder roadmap kế toán chưa được business logic (WAC/COGS) nào tiêu thụ — xác nhận qua grep toàn repo. GOTCHA: khi thêm field enum mới support ở cả 2 DTO create/update của cùng aggregate, PHẢI thêm đồng thời cả 2 — lệch 1 bên sẽ khiến Jackson reject field lạ ở phía thiếu (FAIL_ON_UNKNOWN_PROPERTIES default true). Test mới: InternalProductServiceTest (create_respectsRequestedPricingMethod, create_defaultsPricingMethodPwaWhenOmitted).", author: "Main agent — V2-10 pricingMethod R32 sync 2026-07-01" }
  - { date: "2026-07-01", summary: "FEATURE-SYNC: POST /api/v2/internal-products (V2-10) request DTO `InternalProductCreateRequest` (CatalogDtos.java) đồng bộ theo gf-inventory-api.md R31 (2026-07-01) — thêm 2 field: (a) `status` (optional enum ACTIVE|INACTIVE, default ACTIVE) — trước đây `InternalProductService.create()` hard-code `.status(CatalogStatus.ACTIVE)`, bỏ qua giá trị client gửi; (b) `attachments[]` inline-tại-create — item shape MỚI `fileUrl/fileName/fileType/fileSizeBytes/attachmentKind` (KHÁC shape V2-18 `AttachmentRequest`: `fileName/fileType/sizeBytes/storageUrl`), đảo pattern R11 (post-create-only via V2-18) theo yêu cầu Delivery Authority 2026-07-01. Implementation: extract validation+persist logic (cap 5 file/product, ≤30MB BR-CAT-PROD-015 v17, MIME PDF/JPG/PNG whitelist) từ `addAttachment()` (V2-18) thành private helper `persistAttachment()` dùng chung cho cả `create()` (V2-10) và `addAttachment()` (V2-18) — tránh duplicate rule đã sửa 2 lần (10MB→30MB). Doc fix kèm theo: sửa 1 chỗ \"≤10MB\" stale (dòng attachments[] validation V2-10, do R31 copy nhầm số cũ) thành \"≤30MB\" khớp BR-CAT-PROD-015 hiện hành — LƯU Ý: các mention \"10MB\" khác còn sót trong doc (V2-18 bullet riêng, bảng error-code ERR-CMN-004 toàn cục) là drift tiền-tồn-tại, KHÔNG thuộc scope sửa lần này. Flag chưa xử lý (kế thừa từ R31): `FEAT-CAT-PROD-CREATE.md` AC-13 vẫn ghi \"KHÔNG inline tại create\" — lệch với thay đổi này, cần follow-up riêng ở Product tier. Test mới: InternalProductServiceTest (create_respectsRequestedStatus, create_defaultsStatusActiveWhenOmitted, create_persistsInlineAttachments, create_rejectsWhenAttachmentsExceedFive, create_rejectsInvalidAttachmentMimeType, create_rejectsOversizedAttachment).", author: "Main agent — V2-10 status+attachments R31 sync 2026-07-01" }
  - { date: "2026-07-01", summary: "BUGFIX (P2): POST /api/v2/material-groups/search (V2-1) và POST /api/v2/internal-products/search (V2-7) trả sai khi client không truyền `status` (null/omitted) — service default sai thành `CatalogStatus.ACTIVE` (MaterialGroupService.search line 57, InternalProductService.search line 72), che mất record INACTIVE dù repository JPQL guard `(:status IS NULL OR x.status = :status)` (JpaMaterialGroupRepository.search / JpaInternalProductRepository.search) đã hỗ trợ null = không filter đúng theo business spec (status omitted phải trả CẢ ACTIVE + INACTIVE). Fix: bỏ default `status == null ? ACTIVE : status`, pass `request.getStatus()` (có thể null) thẳng xuống repository. KHÔNG đổi `InternalProductExportService` (V2-22 export, endpoint khác, ngoài scope theo yêu cầu — vẫn default ACTIVE khi omitted, cần xác nhận riêng nếu muốn đồng bộ). GOTCHA: khi thêm search endpoint catalog mới có filter status kiểu enum, KHÔNG default null → ACTIVE ở app.service nếu spec yêu cầu \"omitted = tất cả trạng thái\" — chỉ default khi spec xác nhận rõ. Regression test thêm ở InternalProductServiceTest/MaterialGroupServiceTest (search_passesNullStatusToRepository_whenStatusOmitted, search_filtersByExplicitActiveStatus, search_filtersByExplicitInactiveStatus) — verify FAIL trên code cũ (PotentialStubbingProblem vì repository stub null không được gọi khi service tự ý default ACTIVE), PASS sau fix.", author: "agent-fix-gf-inventory — BUG-W03-032 status-default hotfix" }
  - { date: "2026-07-01", summary: "BUGFIX (P1): PUT /api/v2/material-groups/{id} crash với `ERROR: relation \"material_group\" does not exist` tại MaterialGroupService.update() → JpaMaterialGroupRepository.findDescendantIds (native @Query WITH RECURSIVE). Bảng thật sự tồn tại đúng schema `dev_gf_inventory` (Hibernate ddl-auto: update tạo đúng chỗ); root cause là `hibernate.default_schema` chỉ auto-qualify schema cho SQL sinh từ JPQL/Criteria, KHÔNG rewrite chuỗi SQL thô của `@Query(nativeQuery = true)` — native query resolve tên bảng theo `search_path` runtime của DB role (mặc định `\"$user\", public`, không chứa `dev_gf_inventory`). Xác nhận qua psql PREPARE/EXECUTE: FROM material_group (không qualify) → tái hiện đúng lỗi; FROM dev_gf_inventory.material_group → OK. Fix: thêm token Hibernate `{h-schema}` trước 2 occurrence `material_group` trong findDescendantIds, theo đúng pattern proven-safe đã có ở JpaInventoryDeliveryItemRepository.updateCostPricesFromPeriodStock. GOTCHA: mọi @Query(nativeQuery = true) mới trong gf-inventory PHẢI dùng `{h-schema}` prefix trước table reference — không dựa vào search_path runtime của DB connection.", author: "agent-fix-gf-inventory — BUG-W03-031 native-query-schema hotfix" }
  - { date: "2026-07-01", summary: "BUGFIX (P1): POST /api/v2/internal-products/search + /api/v2/material-groups search luôn crash với `ERROR: function lower(bytea) does not exist` khi backed bởi PostgreSQL. Root cause: JPQL idiom `(:keyword IS NULL OR LOWER(col) LIKE LOWER(CONCAT('%', :keyword, '%')))` khiến Hibernate 6.6.15 suy luận JDBC type của tham số `:keyword` thành bytea thay vì varchar, do tham số vừa xuất hiện untyped trong `IS NULL` vừa nested trong CONCAT/LOWER — xác nhận qua psql PREPARE/EXECUTE trực tiếp trên schema `dev_gf_inventory.internal_product` (cột code/name xác nhận là character varying, không phải bytea). Fix: build `%keyword%` pattern đã lowercase ở tầng Java (`toKeywordPattern` trong InternalProductService/InternalProductExportService/MaterialGroupService), JPQL đổi thành `LOWER(col) LIKE :keyword` (bỏ CONCAT), theo đúng pattern an toàn đã dùng ở InventoryPeriodStockSpecification/SchemaHolder/InventoryStockSpecification (Criteria API build wildcard string trong Java). GOTCHA cho search endpoint mới trong tương lai: KHÔNG dùng `LOWER(CONCAT('%', :param, '%'))` trong JPQL khi `:param` cũng xuất hiện trong `:param IS NULL OR ...` guard trên PostgreSQL — luôn build wildcard string ở Java trước khi bind.", author: "agent-fix-gf-inventory — BUG-W03 lower(bytea) hotfix" }
  - { date: "2026-06-30", summary: "W03 EP-INVENTORY-CATALOG planned design (v3→v4): metadata epics+12 features; +23 V2 endpoints (V2-1..V2-23, V2-9 removed per HLD R10) cho material-group/internal-product/sku-mapping/conversion-unit/attachment/import-export/sku-search; +5 entities (MaterialGroup adjacency-list ADR-017, InternalProduct với main_unit_code R8 D-A + nature English R8 D-B + brand free-text R18 + originCode codified R18 + image_url opaque R25, InternalProductSkuMapping unique global, InternalProductConversionUnit R8 D-E rename + scale guard R29, InternalProductAttachment metadata-only ADR-016 max 5 file BR-CAT-PROD-015); +enums (ProductNature/PricingMethod/MaterialGroupStatus/InternalProductStatus); +error codes (ERR-INV-027/041/044/045/047). Source-of-truth: PKG-W03-inventory-catalog.md §2.2.1. Additive only — không sửa entity/api/business_rule cũ.", author: "Main agent (user-override planned-design per W03 prep)" }
  - { date: "2026-05-18", summary: "BR review fix: thêm 12 BRs mới cho 6 core domains thiếu — Receipt (BR-008/009/010: status machine, stock increase/decrease, code gen), Delivery (BR-011/012/013: SO validation AC-8, mismatch flag, reversal), Stock (BR-014/015: negative stock allowed, reserved=marker only, adjustment), Reservation (BR-016: TTL auto-expire, worker integration), PeriodStock (BR-017/018: WAC/COGS formula, atomic closure, idempotency, native SQL scale), Warehouse (BR-019: branch event auto-create + WAREHOUSE_CREATED). Sửa metadata purpose từ legacy-only sang full inventory scope.", author: "BE Lead Agent — review fix 2026-05-18" }
