  - { date: "2026-07-06", summary: "BUGFIX (user báo \"làm sai hết giao diện rồi\", đối chiếu lại với file mẫu BA `docs/Product/ux/assets/cat-prod-export-template.xlsx` bằng openpyxl để lấy đúng style — style tự chọn ở 2 lần sửa trước (dark-blue header, row height 32/22, không set column width) SAI so với file mẫu thật): `InternalProductExportService` (V2-22 export .xlsx) sửa lại style cho khớp CHÍNH XÁC file mẫu. (1) Header background đổi từ `IndexedColors.DARK_BLUE` sang RGB **8DB4E2** (xanh nhạt, ARGB `FF8DB4E2` — phải dùng `XSSFColor(byte[4]{FF,8D,B4,E2}, null)` qua cast `(XSSFCellStyle) style` vì `CellStyle.setFillForegroundColor(short)` chỉ nhận indexed palette, không nhận custom RGB; LƯU Ý ban đầu quên byte alpha (chỉ truyền 3 byte RGB) → XSSFColor lưu ARGB=`00000000`-prefix (alpha 00 = có thể render sai/trong suốt trên 1 số reader) — phải truyền đủ 4 byte ARGB với alpha=`FF` mới khớp file mẫu, verify bằng cách export thử 1 file thật rồi đọc lại bằng `openpyxl` xem `fill.fgColor.rgb`). (2) Header font color đổi từ trắng sang **đen** (`IndexedColors.BLACK`, file mẫu index=8 nghĩa là đen tường minh, không phải mặc định). (3) Row height sửa cho khớp file mẫu: title 32f→**24.6f**, header 22f→**26.4f** (`TITLE_ROW_HEIGHT`/`HEADER_ROW_HEIGHT`). (4) Title bỏ `VerticalAlignment.CENTER` (file mẫu không set vertical cho A1, giữ default). (5) Data cell font trước chỉ đổi tên (Times New Roman) chưa đổi size — thêm `DATA_FONT_SIZE=12` khớp file mẫu (font size 12 cho toàn bộ data row, không phải mặc định 11). (6) THÊM MỚI hoàn toàn 2 thứ chưa từng làm ở 2 lần sửa trước: **column width per-column** (`COLUMN_WIDTHS` double[12] lấy từ file mẫu qua openpyxl `column_dimensions[col].width`, áp bằng `sheet.setColumnWidth(i, (int) Math.round(width*256))` — công thức quy đổi chuẩn character-width→POI 1/256-unit) và **wrap text có chọn lọc** cho đúng 2 cột header `ĐVT` (index 3) + `Phương pháp tính giá` (index 10) — file mẫu chỉ 2 cột này wrap, các cột khác không; implementation dùng `WRAP_TEXT_HEADER_COLUMNS = Set.of(3, 10)` + `headerWrapStyle` clone từ `headerStyle` (`style.cloneStyleFrom()`) rồi `setWrapText(true)`, chọn style theo cột trong loop header. Method luận rút ra: KHÔNG tự suy đoán style theo cảm tính khi có file mẫu BA đính kèm — phải mở file mẫu bằng script (đọc trực tiếp `openpyxl`, dump toàn bộ font/fill/border/alignment/column-width/row-height mọi cell liên quan) TRƯỚC khi code, thay vì đoán màu/size/height theo trực giác rồi để user phải phát hiện sai. Test: cập nhật 2 test cũ (header giờ assert `IndexedColors.BLACK` + custom RGB `getFillForegroundXSSFColor().getRGB()` thay vì DARK_BLUE; thêm exact row-height assertion 24.6f/26.4f), thêm 2 test mới `export_setsColumnWidths_perColumn` (assert đúng 12 width) + `export_wrapsTextOnDvtAndPricingMethodHeaderColumns_notOtherColumns` (assert wrap=true đúng cột 3/10, false cột khác). Verify thêm bằng cách export 1 file thật (test tạm rồi xoá) đọc lại qua `openpyxl` so khớp từng field với file mẫu gốc — khớp 100% (row height/column width/fill ARGB/font). 10/10 test PASS.", author: "Main agent — export style corrected to match cat-prod-export-template.xlsx 2026-07-06" }
