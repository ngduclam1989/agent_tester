dependencies:
  - { name: "PostgreSQL", type: "database", purpose: "System of record cho contacts, customers, vehicles, segments, segment members, interactions, tags, tenant sequences, outbox và inbox.", config_ref: "spring.datasource.*, DB_SCHEMA, Flyway V1-V6" }
  - { name: "Redis", type: "cache_lock", purpose: "Validation cache cho province/ward và RedisLockRegistry cho OutboxProcessor multi-replica.", config_ref: "REDIS_HOST, REDIS_PORT, app.cache.key-prefix, DistributedLockConfig" }
  - { name: "Kafka", type: "broker", purpose: "Publish customer/segment events qua outbox và consume message-events/segment-workflow-events.", config_ref: "KAFKA_BOOTSTRAP_SERVERS, kafka.topics.*" }
  - { name: "Temporal", type: "workflow", purpose: "Chạy SegmentEvaluationWorkflow trên task queue segment-evaluation-queue.", config_ref: "spring.temporal.*, SegmentEvaluationWorkflowImpl.TASK_QUEUE" }
  - { name: "spring-security-starter", type: "auth", purpose: "Cung cấp tenant/user context cho public API và security starter config.", config_ref: "actechx.security.*" }
  - { name: "spring-feature-flag-starter", type: "feature_flag", purpose: "Gate CRM:CRMV01 và Customer:VehicleManagementV01.", config_ref: "feature-flag.*, feature-flags.json" }
  - { name: "Actuator + OTLP", type: "observability", purpose: "Expose health/metrics/prometheus và tracing/logging starter.", config_ref: "management.endpoints.*, spring.profiles.include=otlp" }


