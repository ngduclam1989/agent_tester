# KG UI Label Map — garage-mobile
#
# Purpose:
# - Keep mobile UI label mapping inside the KG area, not Product/.
# - Map the full gf-garage-app mobile project by route/domain/source-of-truth.
# - Keep detailed visible-label drill-downs in the same KG extension when a
#   screen needs field-level mapping.

metadata:
  type: knowledge-graph-extension
  artifact_kind: mobile-ui-label-map
  status: ACTIVE
  version: 6
  tier: T2
  owner_authority: Architecture Authority
  boundary: "garage-mobile"
  parent_kg: "Execution/knowledge-graphs/garage-mobile.knowledge-graph.yaml"
  source_repo: "/Users/congvn/Desktop/gf-garage-app"
  source_package: "cardoctor_garage_v3"
  last_reviewed: "2026-05-19"
  coverage_status: "full-project-structural-map"
  project_inventory:
    routed_entries: 126
    ui_page_files: 133
    ui_top_level_domains: 26
    graphql_documents: 24
    repository_files: 28

coverage_model:
  structural_map:
    status: "complete-for-routed-mobile-domains"
    means:
      - "Every route declared in lib/core/router/router.dart is assigned to a mobile domain below."
      - "Each domain points to its Flutter UI path, repository boundary, GraphQL document(s), and downstream provider."
      - "Shared widgets/platform plugins are mapped as supporting surfaces instead of standalone business routes."
  detailed_label_map:
    status: "drill-down-by-priority-screen"
    means:
      - "Only mobile-owned labels are expanded per screen: LocaleKeys/localization JSON, hardcoded Flutter strings, shared constants, enum labels, or common UI classes maintained by mobile."
      - "Backend-owned dynamic text/options/statuses from API/Graph responses are excluded completely from ui_label_maps."

label_ownership_policy:
  include:
    - "Localization keys and translated values maintained in assets/localizations/*.json, generated LocaleKeys, or lib/core/localizations/**."
    - "Hardcoded visible strings in Flutter widgets, dialogs, toasts, buttons, placeholders, empty states, app bars, and tab labels."
    - "Static constants/enums/common classes maintained by mobile that drive visible labels."
  exclude:
    - "Customer, vehicle, supplier, product, catalog, payment, chat, notification, and status text returned as backend response data."
    - "Runtime values loaded from searchCatalog, suggest*, CometChat runtime, payment gateway pages, or notification payloads."
  boundary_rule: "If mobile stores only the selected id/code and renders the display name from response, the display name is backend-owned dynamic text, not a mobile label."

authoring_rules:
  - "UI label maps for garage-mobile live in this KG extension, not in Product/."
  - "Use Flutter source, assets/localizations/*.json, generated LocaleKeys, and mobile constants/enums as source of truth for labels."
  - "Do not copy labels from garage-web label maps unless the mobile source shows the same label."
  - "For hardcoded Flutter labels, record source_file and component context instead of inventing i18n keys."
  - "For backend dynamic catalog/options/statuses, do not record response text under ui_label_maps."
  - "Append new screen drill-downs under ui_label_maps; do not rewrite existing entries without updating change_log."

source_priority:
  - priority: 1
    source: "Flutter UI source under lib/ui/**"
    used_for: "visible labels, buttons, placeholders, modal titles, toast text"
  - priority: 2
    source: "assets/localizations/vi.json + generated LocaleKeys"
    used_for: "resolved Vietnamese labels for i18n-backed UI"
  - priority: 3
    source: "Mobile-maintained constants/enums/common UI classes"
    used_for: "static visible labels not backed by localization"

