change_log:
- date: '2026-06-15'
  version: 13
  author: agent-dev-garage-web
  summary: 'Compact KG. implementation.api queries/mutations rewritten as plain string
    list (199 ops total). Input/response shape lookup deferred to docs/Architecture/api/agg-{garage,sso}-graph-graphql.md
    (indexed by camelCase operation name). implementation.types: dropped redundant
    fields[] for 429 entries whose source matches ''GraphQL -> {OperationName}'' (PascalCase,
    no path) - shape already in API doc. Kept fields[] for local TS interfaces (source:
    local) and GraphQL types pointing to local feature files.'
- date: '2026-06-12'
  author: agent-fix-garage-web
  summary: 'BUG-W01-267 fix — per-row depreciation persistence (Edit/Detail). WRITE
    helper buildInsuranceAllocationRequest no longer declares or emits depreciationByLine;
    per-row % travels solely through parts[i].depreciationPercent on the main payload
    (BFF SDL per BUG-W01-261/262). Dropped IInsuranceDepreciationLineRequest type
    + companion field on IInsuranceAllocationRequestInput; reconciled legacy regression
    suite (depreciation-material-column.test.ts) against the new contract. Escalated
    to agent-fix-agg-garage-graph: ServiceOrderPartV3Input (Create) is missing depreciationPercent
    declaration — Create-side persistence cannot be fixed FE- side. Comment hygiene:
    stripped 2 design-artifact references (BR-INS-SO-ADJ- 002/003, BA-chốt marker)
    added in the previous FIX cycle. 81/81 tests PASS, build PASS.'
- date: '2026-06-11'
  author: agent-dev-garage-web
  summary: 'EP-INSURANCE-SETTLEMENT edit-mode lifecycle pivot. Moved notes/documents
    refs + useUpdateSettlement + handleSave/handleCancelEdit into InsuranceSettlementDetailPage
    itself; the page now reads route search mode locally via useSearch + drives the
    toolbar swap (Lưu/Hủy) end-to-end. Settlement DetailDispatcher reverts to routing-only
    — drops isEditMode/onSave/onCancelEdit/ isSaving/documents/onNotesChange/onDocumentsChange
    props and the dup useUpdateSettlement call. Documents wiring: insurance detail
    query now selects documents{} so the Chứng từ tab mounts the shared DocumentsTab
    (replaces the W01 PlaceholderTab) with disabled gating. SettlementInfo textarea
    already parity (BUG-W01-243 prior pass).'
- date: '2026-06-11'
  author: agent-dev-garage-web
  summary: EP-INSURANCE-SETTLEMENT shell unification. Refactor InsuranceSettlementDetailPage
    to compose canonical PageHeader + TabButtons shells (same anatomy as SettlementVoucherDetail),
    eliminating the parallel Tabs/TabsList/TabsTrigger primitive tree. Added isEditMode/onCancelEdit/onSave/isSaving
    props so the edit-mode toolbar (Lưu/Hủy) mounts on INSURANCE detail in edit mode
    for parity with the customer-payer branch. SettlementDetailDispatcher now reads
    route mode and passes the edit handlers + isSaving. Removed the unwired duplicate
    components/detail/index.tsx parallel shell and its KG entry (registered duplicate);
    CreateDossierButton now drives the disabled "+ Tạo hồ sơ bảo hiểm" affordance
    inside the canonical PageHeader.childrenRight slot.
- date: '2026-06-07'
  author: agent-fix-garage-web
  summary: 'W01 FIX (CR-1780801481 + scope-extend FM-017). D1/D3 unwrap: allocation
    write hook sends depreciationDefault + insuranceDeductible as scalar Float (canonical
    agg SDL); read fragment realigned to canonical InsuranceAdjustmentBlock (payer-first
    breakdownByPayer.{bh,kh}, 5 flat composite InsuranceAllocation{mode,value,amount},
    dropped non-existent input/adjustments blocks) + new map-read helper (mapRawInsuranceAdjustment
    / mapRawToInputModel). Route-mount: InsuranceAllocationSection into ServiceOrderDetail
    (mode=detail) + ServiceOrderEdit (mode=edit, AC-0 hidden on Create via Edit-only
    host); InsuranceSettlementDetailPage into settlement-voucher detail gated settlementType==INSURANCE.
    DEBT-W01-005: replaced 3 inline &&-JSX with Show (panel/cost-tab/placeholder-tab)
    + removed trailing whitespace in adjustment-fields recap. Added mount_points to
    component registry. build pass, lint clean on changed files.'
- date: '2026-06-07'
  author: agent-dev-garage-web
  summary: W01 EP-INSURANCE-SETTLEMENT (FEAT-INS-SO-ADJUSTMENT + FEAT-INS-STL-DETAIL).
    Registered 4 new components (customs CurrencyInput, InsuranceAllocationSection,
    TotalServicePricePanel, InsuranceSettlementDetailPage) + augmented pages work_orders_service_order
    / work_orders_settlement with insurance components, hooks and design_refs. CurrencyInput
    is the only new primitive (reuse-gate confirmed gap — share input-number/input-number-subfix
    lack VND/% mode). All other UI composes existing share/ui components.
- date: '2026-05-25'
  author: agent-dev-garage-web
  summary: Added optional Figma spec sync refs for reusable components and page-level
    design_refs contract.
- date: '2026-05-22'
