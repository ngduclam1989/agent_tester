      actions:
      - setPermissions
      - isAllowedModule
      - isAllowedAction
      - resetPermissions
    filter_store_factory:
      purpose: Factory for list/filter/pagination state used across list pages.
      state:
      - keyword
      - filters
      - page
      - pageSize
      - sort
      actions:
      - setKeyword
      - setFilters
      - setPage
      - setPageSize
      - reset
    menu_store:
      purpose: Manage sidebar menu collapse and module-shell navigation UX.
      state:
      - isMenuCollapsed
      - activeMenu
      actions:
      - toggleMenu
      - setActiveMenu
    breadcrumb_store:
      purpose: Maintain breadcrumb trail and title context for route transitions.
      state:
      - items
      - currentTitle
      actions:
      - setBreadcrumb
      - resetBreadcrumb
    challenge_session_store:
      purpose: Store temporary login challenge session for first-change-password flow.
      state:
      - challengeSession
      - identifier
      actions:
      - setChallengeSession
      - clearChallengeSession
    forgot_password_store:
      purpose: Hold forgot-password wizard step and identifier context.
      state:
      - identifier
      - otp
      - step
      actions:
      - setIdentifier
      - setOtp
      - setStep
      - reset
    notification_store:
      purpose: Track notification unread count and unread-count refetch handle in
        header runtime.
      state:
      - unreadCount
      - refetchUnreadCount
      actions:
      - setUnreadCount
    comet_common_store:
      purpose: Store CometChat token and common runtime chat context.
      state:
      - token
      - user
      - isInitialized
      actions:
      - setToken
      - setUser
      - setInitialized
      - reset
  business_rules:
  - id: BR-IMPL-001
    rule: Auth/session lifecycle must be synchronized across browser tabs.
    enforcement: AuthSyncManager + BroadcastChannel(auth_channel) + logout cleanup
      hooks.
    architecture_ref: BR-003
  - id: BR-IMPL-002
    rule: Domain APIs cannot be called directly from arbitrary components.
    enforcement: Shared Apollo clients and hooks route all operations through VITE_GRAPHQL_URI/VITE_GRAPHQL_SSO_URI.
    architecture_ref: BR-002
  - id: BR-IMPL-003
    rule: Permission checks are UX gating only.
    enforcement: Navigation/resource visibility and route guards use permission store
      without replacing backend authorization.
    architecture_ref: BR-003
