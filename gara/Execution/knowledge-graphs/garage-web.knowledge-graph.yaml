    operations:
    - HrmsSearchUsers
    - HrmsUserById
    - HrmsCreateUser
    - HrmsUpdateUser
    - HrmsToggleUserStatus
    flow:
    - Search account users.
    - Open detail/create/edit routes.
    - Create, update or toggle user status through HRMS GraphQL operations.
  - id: UC-GARAGE-WEB-41
    name: Permission role management
    actor: admin
    routes:
    - /permissions
    - /permissions/create
    - /permissions/$id
    - /permissions/$id/edit
    source_files:
    - src/features/permissions
    operations:
    - PolicyRoleList
    - PolicyRoleById
    - PolicyResourceTypes
    - PolicyRoleCreate
    - PolicyRoleUpdate
    - PolicyRoleDelete
    - PolicyClientGetPermissions
    flow:
    - Search/list policy roles and open detail/create/edit.
    - Load resource types for permission matrix.
    - Create, update or delete policy role and refresh permission context when needed.
  - id: UC-GARAGE-WEB-42
    name: Chat and call center routing
    actor: support_user
    routes:
    - /chat-all
    - /chat-vehicle
    - /chat-support
    source_files:
    - src/features/call-chat
    - src/features/chat
    - src/layouts/home/comet-layout.tsx
    operations:
    - UserToken
    - GroupConversationList
    - RoutingCandidate
    - AddCS
    - AddCSWeekend
    - GroupUpload
    flow:
    - Open all, vehicle or support chat route.
    - Load CometChat provider runtime and group conversations.
    - Create/reroute CS group, add CS/weekend CS or upload contract/file attachments.
  - id: UC-GARAGE-WEB-43
    name: Realtime CometChat incoming call handling
    actor: authenticated_user
    routes:
    - /_modules/*
    source_files:
    - src/layouts/home/comet-layout.tsx
    operations:
    - UserToken
    flow:
    - Initialize CometChat UIKit after auth token is available.
    - Register call listener in module shell.
    - Show incoming call popup/ringtone and handle accept/reject/end events.
  - id: UC-GARAGE-WEB-44
    name: Public feedback submission
    actor: external_feedback_user
    routes:
    - /feedback
    source_files:
    - src/features/feedback
    operations:
    - VITE_FEEDBACK_GOOGLE_SHEET_URL
    flow:
    - Open public feedback route without authentication.
    - Validate feedback form with Zod/React Hook Form.
    - Submit feedback payload to Google Sheet endpoint and render success state.
  - id: UC-GARAGE-WEB-45
    name: Payment return rendering
    actor: payment_return_user
    routes:
    - /payment
    source_files:
    - src/features/payment-success
    - src/routes/_modules/payment.tsx
    operations: []
    flow:
    - Open payment callback/result route.
    - Read route/search state from payment provider redirect.
    - Render payment result without creating payment secret or mutating payment authority
      state.
  - id: UC-GARAGE-WEB-46
    name: Error and debug routes
    actor: authenticated_user
    routes:
    - /401
    - /403
    - /404
    - /500
    - /503
    - /debug
    source_files:
    - src/features/errors
    - src/routes/_errors
    - src/routes/_modules/_common/debug
    operations: []
    flow:
    - Render status-specific error page or debug route.
    - Keep error/debug UI isolated from business state mutation.
    - Let router/navigation decide recovery path.
  domain_glossary:
    Module shell: Authenticated layout boundary that hosts sidebar, header, route
      outlet and realtime runtimes.
    FM-016 mapping: Mandatory mapping of UI trigger to GraphQL operation before implementation.
    Runtime UI state: Ephemeral state in Zustand/component state for UX behavior,
      not source of truth.
    GraphQL aggregator pattern: Frontend calls BFF graph endpoints instead of downstream
      microservices.
