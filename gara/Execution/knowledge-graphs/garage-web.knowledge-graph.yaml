metadata:
  type: knowledge-graph
  artifact_kind: knowledge-graph
  status: ACTIVE
  version: 13
  last_reviewed: '2026-06-15'
  tier: T1
  owner_authority: Architecture Authority
  project: CarDoctor GMS
  boundary: garage-web
  service: gf-gms-web
  stack: frontend
  owner: agent-dev-garage-web
  hld_ref: Architecture/hld/garage-web-HLD.md
  architecture_refs:
    apis_produced: []
    apis_consumed:
    - 'agg-garage-graph: domain GraphQL for booking, service-order, purchase, inventory,
      CRM, marketing, HRMS, policy role workflows and notification center read/read-state
      operations.'
    - 'agg-sso-graph: auth/session, refresh/logout, Firebase device token registration,
      CometChat helpers and Superset guest token.'
    - 'feedback-google-sheet: feedback form submission endpoint via VITE_FEEDBACK_GOOGLE_SHEET_URL.'
    events_produced:
    - 'AuthBroadcastLogin: Browser-local BroadcastChannel(auth_channel) message emitted
      with literal payload "login" after Login mutation succeeds in one tab.'
    - 'AuthBroadcastLogout: Browser-local BroadcastChannel(auth_channel) message emitted
      with literal payload "logout" after logout mutation succeeds in one tab.'
    events_consumed:
    - 'FirebaseForegroundMessage: Firebase Messaging onMessage event consumed by notification
      runtime to update in-app notification UI and refetch unread/list state.'
    - 'FirebaseNotificationClick: Firebase service worker notification click event
      consumed to focus/open garage-web and redirect to notification target route.'
    - 'CometChatMessageEvent: CometChat browser SDK message/conversation event consumed
      to update chat conversation/message UI.'
    - 'CometChatIncomingCall: CometChat Calls SDK incoming-call event consumed to
      show incoming call popup/ringtone and call controls.'
    - 'AuthBroadcastReceived: BroadcastChannel(auth_channel) literal message "login"
      or "logout" from another garage-web tab consumed to navigate to /protected-permission
      or /login.'
    data_models:
    - Execution/knowledge-graphs/garage-web.knowledge-graph.yaml
    - Architecture/integrations/INTEG-FE-garage-web-agg-garage-graph.md
    - Architecture/integrations/INTEG-FE-garage-web-agg-sso-graph.md
    - Architecture/decisions/ADR-012-garage-web-frontend-architecture.md
entities:
- name: SessionState
  description: Client session state managed via cookie helpers and auth sync utilities.
- name: GraphQLServerStateCache
  description: Apollo Client and TanStack Query cache for read models from BFFs.
- name: RuntimeUiState
  description: Zustand and component runtime state for tenant context, filters, permissions
    and chat/notification UI.
- name: ProviderRuntimeTokens
  description: Short-lived runtime tokens for Superset and CometChat plus Firebase
    device token registration context.
- name: PaymentReturnContext
  description: Public payment callback rendering state, without payment authority
    ownership.
business_rules:
- id: BR-001
  description: garage-web is an internal/admin SPA and does not require SSR.
- id: BR-002
  description: No direct browser calls to downstream gf-* domain services; use agg-garage-graph
    or agg-sso-graph.
- id: BR-003
  description: Frontend is not final authorization authority; route/menu visibility
    is UX guard only.
- id: BR-004
  description: Frontend does not own durable business state machine, payment/card
    secrets, or provider secret generation.
- id: BR-005
  description: All new route actions/forms must map UI trigger to GraphQL operation
    in INTEG-FE contracts before development.
permissions:
- actor: garage_operator
  access: Operational access to booking/service-order/purchase/inventory/CRM modules
    within assigned tenant.
- actor: service_advisor
  access: Work-order and customer-centric flows including booking, service order and
    settlement.
- actor: inventory_staff
  access: Inventory stock, receipt, delivery and inventory-service operations.
- actor: marketing_staff
  access: Campaign, voucher programs and segment-driven customer outreach workflows.
- actor: admin
  access: Employee/account/permission administration and cross-module operational
    visibility.
dependencies:
  inbound:
  - boundary: garage-staff-browser
    type: sync
    description: Loads static SPA assets and executes authenticated module routes.
  - boundary: static-hosting-cdn
    type: sync
    description: Serves dist assets from Vite build with SPA fallback support.
  outbound:
  - boundary: agg-garage-graph
    type: sync
    description: Domain GraphQL contract via VITE_GRAPHQL_URI.
  - boundary: agg-sso-graph
    type: sync
    description: Auth/session, Firebase device token registration, conversation helpers
      and Superset token GraphQL via VITE_GRAPHQL_SSO_URI.
  - boundary: firebase-messaging
    type: async
    description: Push and in-app notification runtime.
  - boundary: cometchat
    type: async
    description: Realtime chat and call provider runtime.
  - boundary: superset
    type: sync
    description: Embedded BI dashboard rendered with guest token fetched via agg-sso-graph.
  - boundary: feedback-google-sheet
    type: sync
    description: Feedback submission endpoint via VITE_FEEDBACK_GOOGLE_SHEET_URL.
integrations:
- name: graphql-domain-client
  type: graphql
  endpoint: ${VITE_GRAPHQL_URI}
  provider: agg-garage-graph
- name: graphql-sso-client
  type: graphql
  endpoint: ${VITE_GRAPHQL_SSO_URI}
  provider: agg-sso-graph
- name: firebase-notification-runtime
  type: sdk
  provider: Firebase Messaging
- name: comet-chat-runtime
  type: sdk
  provider: CometChat
- name: superset-embedded-dashboard
  type: embed
  provider: Superset
