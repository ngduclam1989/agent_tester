    - UserToken
    - saveToken
    flow:
    - Submit login credentials and tenant/subdomain context.
    - Persist access/id/refresh tokens through cookie helpers when login succeeds.
    - Fetch CometChat token, initialize Firebase token registration and broadcast
      login to other tabs.
