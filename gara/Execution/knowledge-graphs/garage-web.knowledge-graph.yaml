  page_design_refs_schema:
    purpose: Optional per-page links from implementation.pages entries to generated
      Figma specs and source Figma nodes. The spec body remains in .claude/figma-specs;
      page entries only store lookup metadata for agents.
    field_notes:
      figma_url: Full Figma design URL with node-id when available.
      figma_file_key: Figma file key parsed from the design URL.
      figma_node_id: Figma node id in colon format, for example 123:456.
      figma_spec_file: Generated spec path under .claude/figma-specs.
      status: synced, FIGMA_LINK_MISSING, MCP_UNAVAILABLE, or TRANSFORM_FAILED.
      last_synced_at: ISO-8601 timestamp when KG design refs were last synced.
  components:
    purpose: Single registry mapping gf-gms-web code components for ADLC/AI reuse.
      Contains the full code inventory (status needs-figma) merged with curated Figma
      mappings. Reserved metadata keys (see component_schema.reserved_keys) sit alongside
      component entries; everything else is a component entry. Does not replace executable
      Figma Code Connect .figma.ts templates.
    rules:
    - Read this map before creating or modifying reusable UI components.
    - Prefer a mapped component when usage.preferred_for matches the requested UI
      and status is mapped or candidate.
    - Do not create a new component when a non-deprecated mapping already fits the
      task.
    - If a mapping has status deprecated, avoid it unless the affected code already
      depends on it.
    - If no mapping exists, search src/components/share, src/components/ui, src/components/customs,
      then src/features/*/components before creating a new component.
    - If an existing code component is found but this map has no entry, add or update
      a component entry with status needs-figma or candidate, then reuse that component.
    - If a Figma URL is provided, add or update a mapping with status candidate until
      code props and Figma props are verified.
    - Only create a new component after source search confirms no reusable component
      fits; after creating it, add a component entry here.
    - Keep real mappings under components only. Do not add template examples to the
      knowledge graph because agents may treat them as authoritative.
    - Use Code Connect .figma.ts files for executable Figma-to-code snippets; use
      this knowledge graph section as the ADLC/AI registry.
    component_groups:
      ui:
        description: Low-level shadcn/Radix-style primitives in src/components/ui.
        default_scope: shared-primitive
        root_path: src/components/ui
      share:
        description: Product-ready shared app components in src/components/share.
        default_scope: shared-app
        root_path: src/components/share
      customs:
        description: Shared custom controls composed for app-specific flows.
        default_scope: shared-custom
        root_path: src/components/customs
      feature:
        description: Feature-local components under src/features/<feature>/components.
        default_scope: feature-local
        root_path: src/features
      external:
        description: Third-party or embedded components that should not be recreated
          locally.
        default_scope: external
        root_path: src/components
    component_schema:
      required_fields:
      - id
      - status
      - figma
      - code
      - usage
      - prop_map
      - notes
      statuses:
      - mapped
      - candidate
      - needs-figma
      - needs-code
      - deprecated
      field_notes:
        id: Stable slug, for example share-button.
        status: Mapping confidence and lifecycle state.
        figma.name: Component name as shown in Figma.
        figma.url: Full Figma component URL with node-id when available.
        figma.file_key: Figma file key parsed from URL.
        figma.node_id: Figma node id in colon format, for example 123:456.
        figma.component_set: Parent component set or library grouping when available.
        figma.variant_props: Variant property names and supported values.
        figma.properties: Text, boolean, enum, instance swap, or slot properties from
          Figma.
        code.source_path: Real source file in gf-gms-web.
        code.import_path: Import specifier agents should use.
        code.export_name: Exported component symbol.
        code.props_interface: Props type or interface name if available.
        code.component_kind: primitive, shared, custom, feature, external, or composite.
        usage.scope: shared-primitive, shared-app, shared-custom, feature-local, or
          external.
        usage.preferred_for: UI situations where this mapping should be reused.
        usage.avoid_when: Conditions where agents should not use this component.
        usage.used_in_features: Known consuming features or routes.
        prop_map: Mapping from Figma properties to code props.
        spec_refs: Optional list of generated Figma spec refs associated with this
          reusable component. Each item may include spec_file, source_mode, feature_ref,
          figma_url, figma_node_id, status, and last_synced_at.
        notes: Caveats, known constraints, and migration hints.
        code.props: Code prop names extracted from source (inventory import).
      reserved_keys:
      - purpose
      - rules
      - component_groups
      - component_schema
