events:
  produces:
    - topic: "AC-NONPROD-DEV-PURCHASE-ORDER-EVENTS"
      payload:
        event_version: string
        message_group: string
        message_step: string
        origin_tenant_id: long
        origin_message_code: string
        purchase_order_code: string
        status: string
        source: string
      meaning: "PurchaseOrderStatusChanged (EVENT_VERSION 2.0; when status=DELIVERED + source=DIRECT). Outbound message tạo bởi PurchaseOrderEventPublisher qua OutboundMessageService.createMessage với MessageGroup.PO + MessageStep.DELIVERED_2; header `MessageStep` thực sự được set ở PurchaseOrderStatusChangedProducer khi publish lên Kafka từ outbox. Consumed by gf-inventory-worker to trigger receipt creation."

  consumes: []

entities:
  - name: "QuotationAsk"
    type: "aggregate_root"
    description: "Yêu cầu hỏi giá phụ tùng của garage, gồm snapshot tenant, vehicle, spare parts, attachments, trạng thái hỏi giá và thông tin xuất hóa đơn."
    attributes:
      - { name: "id", type: "BIGINT", required: true }
      - { name: "code", type: "VARCHAR", required: true, constraints: ["unique"] }
      - { name: "tenant_id", type: "BIGINT", required: true }
      - { name: "tenant_name", type: "VARCHAR", required: true }
      - { name: "tenant_phone_number", type: "VARCHAR", required: false }
      - { name: "tenant_ops_area", type: "VARCHAR", required: false }
      - { name: "tenant_address", type: "TEXT", required: false }
      - { name: "tenant_ops_region", type: "VARCHAR", required: false }
      - { name: "ask_note", type: "TEXT", required: false }
      - { name: "is_invoice_required", type: "BOOLEAN", required: true }
      - { name: "invoice_company_name", type: "VARCHAR", required: false }
      - { name: "tax_code", type: "VARCHAR", required: false }
      - { name: "invoice_company_email_address", type: "VARCHAR", required: false }
      - { name: "invoice_company_address", type: "TEXT", required: false }
      - { name: "status", type: "QuotationStatus", required: true, constraints: ["OPEN | ASKING | BIDDING | PRICING | ORDER_CONFIRMING | CANCELLED | CLOSED"] }
      - { name: "is_processed", type: "BOOLEAN", required: true }
      - { name: "processed_at", type: "TIMESTAMP", required: false }
      - { name: "is_best_price", type: "BOOLEAN", required: true }
      - { name: "quotation_ref_code", type: "VARCHAR", required: false }
      - { name: "insurance_code", type: "VARCHAR", required: false }
      - { name: "vehicle_id", type: "BIGINT", required: true }
      - { name: "version", type: "BIGINT", required: false }
    relationships:
      - { target: "AskedVehicle", type: "one_to_one", description: "Một quotation ask tham chiếu một vehicle snapshot qua vehicle_id." }
      - { target: "AskedSparePart", type: "one_to_many", description: "Một quotation ask có nhiều phụ tùng hỏi mua." }
      - { target: "AskedAttachment", type: "one_to_many", description: "Một quotation ask có nhiều attachment từ garage/vendor/CSKH." }
      - { target: "QuotationBid", type: "one_to_many", description: "quotation_ask_code liên kết các báo giá vendor." }
      - { target: "PreliminaryQuotation", type: "one_to_one", description: "quotation_ask_code unique liên kết báo giá sơ bộ nếu có." }
      - { target: "QuotationAskHistory", type: "one_to_many", description: "quotation_ask_code liên kết lịch sử thay đổi." }
    invariants:
      - "QuotationAsk khởi tạo ở OPEN và isProcessed=false."
      - "Tạo purchase request từ quotation ask sẽ chuyển status sang ORDER_CONFIRMING."
      - "Không tạo purchase request nếu quotation ask đã ở ORDER_CONFIRMING, CANCELLED hoặc CLOSED."

  - name: "AskedVehicle"
    type: "entity"
    description: "Snapshot thông tin xe trong quotation ask."
    attributes:
      - { name: "id", type: "BIGINT", required: true }
      - { name: "car_brand", type: "VARCHAR", required: true }
      - { name: "car_model", type: "VARCHAR", required: true }
      - { name: "year_of_manufacture", type: "VARCHAR", required: false }
      - { name: "car_type", type: "CarType", required: false }
      - { name: "trims_level", type: "VARCHAR", required: false }
      - { name: "vin", type: "VARCHAR", required: false }
      - { name: "license_plate", type: "VARCHAR", required: false }
    relationships: []
    invariants:
      - "OCR quotation ask validate VIN không được toàn số hoặc toàn chữ trong luồng hiện tại."

  - name: "AskedSparePart"
    type: "entity"
    description: "Dòng phụ tùng garage cần hỏi mua trong quotation ask."
    attributes:
      - { name: "id", type: "BIGINT", required: true }
      - { name: "code", type: "VARCHAR", required: true, constraints: ["unique"] }
      - { name: "part_name_input", type: "VARCHAR", required: true }
      - { name: "part_name_unit", type: "VARCHAR", required: true }
      - { name: "ref_code", type: "VARCHAR", required: false }
      - { name: "tenant_id", type: "BIGINT", required: true }
      - { name: "deleted", type: "BOOLEAN", required: true }
      - { name: "quantity", type: "BIGINT", required: false }
      - { name: "genuine_code", type: "VARCHAR", required: false }
      - { name: "parent_code", type: "VARCHAR", required: false }
      - { name: "quotation_ask_id", type: "BIGINT", required: true }
    relationships:
      - { target: "QuotationAsk", type: "many_to_one", description: "Dòng phụ tùng thuộc một quotation ask." }
    invariants:
      - "deleted là soft delete cho phụ tùng hỏi mua."

  - name: "AskedAttachment"
    type: "entity"
    description: "Attachment của quotation ask, kèm owner, note và ref_code."
    attributes:
      - { name: "id", type: "BIGINT", required: true }
      - { name: "quotation_ask_id", type: "BIGINT", required: true }
      - { name: "attachment_url", type: "TEXT", required: true }
      - { name: "owner", type: "OwnerType", required: true, constraints: ["GARAGE | VENDOR | CSKH"] }
      - { name: "note", type: "TEXT", required: false }
      - { name: "deleted", type: "BOOLEAN", required: true }
      - { name: "ref_code", type: "VARCHAR", required: false }
    relationships:
      - { target: "QuotationAsk", type: "many_to_one", description: "Attachment thuộc một quotation ask." }
    invariants:
      - "deleted là soft delete cho attachment."

  - name: "QuotationBid"
    type: "aggregate_root"
    description: "Báo giá vendor cho một quotation ask, gồm phụ tùng báo giá, line item giá và phụ tùng vendor thêm."
    attributes:
      - { name: "id", type: "BIGINT", required: true }
      - { name: "tenant_id", type: "BIGINT", required: true }
      - { name: "tenant_type", type: "TenantType", required: true }
      - { name: "quotation_ask_code", type: "VARCHAR", required: false }
      - { name: "bid_type", type: "BidType", required: true }
      - { name: "status", type: "QuotationBidStatus", required: true, constraints: ["OPEN | PRICED | SOLD_OUT | CANCELLED | CLOSED"] }
      - { name: "note", type: "VARCHAR", required: false }
      - { name: "version", type: "BIGINT", required: false }
    relationships:
      - { target: "BiddedSparePart", type: "one_to_many", description: "Một bid có nhiều phụ tùng vendor báo." }
      - { target: "SparePartPriceLineItem", type: "one_to_many", description: "Một bid có nhiều dòng giá theo phụ tùng garage yêu cầu." }
      - { target: "AddedSparePartPriceLineItem", type: "one_to_many", description: "Một bid có nhiều dòng giá cho phụ tùng vendor thêm." }
    invariants:
      - "quotation_ask_code là liên kết logic tới QuotationAsk.code, không thấy FK vật lý."

  - name: "BiddedSparePart"
    type: "entity"
    description: "Phụ tùng vendor báo trong quotation bid."
    attributes:
      - { name: "id", type: "BIGINT", required: true }
      - { name: "code", type: "VARCHAR", required: false, constraints: ["unique"] }
      - { name: "ref_code", type: "VARCHAR", required: true }
      - { name: "tenant_id", type: "BIGINT", required: false }
      - { name: "part_name_input", type: "VARCHAR", required: true }
      - { name: "part_name_unit", type: "VARCHAR", required: false }
      - { name: "deleted", type: "BOOLEAN", required: true }
      - { name: "quotation_bid_id", type: "BIGINT", required: true }
    relationships:
      - { target: "QuotationBid", type: "many_to_one", description: "Dòng phụ tùng thuộc một quotation bid." }
    invariants:
      - "deleted là soft delete cho phụ tùng vendor báo."

  - name: "SparePartPriceLineItem"
    type: "entity"
    description: "Dòng giá của vendor cho phụ tùng garage hỏi mua."
    attributes:
      - { name: "id", type: "BIGINT", required: true }
      - { name: "spare_part_input_code", type: "VARCHAR", required: false }
      - { name: "segment", type: "Segment", required: true }
      - { name: "price", type: "NUMERIC", required: false }
      - { name: "currency", type: "VARCHAR", required: false }
      - { name: "unit", type: "VARCHAR", required: false }
      - { name: "picked_to_po", type: "BOOLEAN", required: true }
      - { name: "detail_status", type: "BOOLEAN", required: true }
      - { name: "receive_detail_status", type: "BOOLEAN", required: true }
      - { name: "quantity", type: "INTEGER", required: false }
      - { name: "material_price", type: "NUMERIC", required: false }
      - { name: "servicing_price", type: "NUMERIC", required: false }
      - { name: "deleted", type: "BOOLEAN", required: true }
      - { name: "quotation_bid_id", type: "BIGINT", required: true }
    relationships:
      - { target: "QuotationBid", type: "many_to_one", description: "Line item thuộc một quotation bid." }
    invariants:
      - "picked_to_po đánh dấu dòng đã được chọn sang purchase order."

  - name: "AddedSparePartPriceLineItem"
    type: "entity"
    description: "Dòng giá cho phụ tùng vendor thêm ngoài danh sách garage hỏi mua."
    attributes:
      - { name: "id", type: "BIGINT", required: true }
      - { name: "spare_part_input_code", type: "VARCHAR", required: false }
      - { name: "segment", type: "Segment", required: true }
      - { name: "price", type: "NUMERIC", required: false }
      - { name: "currency", type: "VARCHAR", required: false }
      - { name: "unit", type: "VARCHAR", required: false }
      - { name: "picked_to_po", type: "BOOLEAN", required: true }
      - { name: "deleted", type: "BOOLEAN", required: true }
      - { name: "detail_status", type: "BOOLEAN", required: true }
      - { name: "receive_detail_status", type: "BOOLEAN", required: true }
      - { name: "quantity", type: "INTEGER", required: false }
      - { name: "material_price", type: "NUMERIC", required: false }
      - { name: "servicing_price", type: "NUMERIC", required: false }
      - { name: "quotation_bid_id", type: "BIGINT", required: true }
    relationships:
      - { target: "QuotationBid", type: "many_to_one", description: "Line item phụ tùng thêm thuộc một quotation bid." }
    invariants:
      - "deleted là soft delete cho dòng giá phụ tùng vendor thêm."

  - name: "QuotationAskPricingRequest"
    type: "aggregate_root"
    description: "Yêu cầu hỏi giá chi tiết gửi tới vendor theo quotation ask."
    attributes:
      - { name: "id", type: "BIGINT", required: true }
      - { name: "quotation_ask_code", type: "VARCHAR", required: true }
      - { name: "origin_tenant_id", type: "BIGINT", required: true }
    relationships:
