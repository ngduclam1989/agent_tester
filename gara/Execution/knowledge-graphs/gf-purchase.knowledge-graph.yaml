    relationships:
      - { target: "QuotationAskHistoryItem", type: "one_to_many", description: "Một history có nhiều field change item." }
      - { target: "QuotationAsk", type: "logical_reference", description: "quotation_ask_code liên kết logic tới QuotationAsk.code." }
    invariants:
      - "History append khi quotation ask được cập nhật qua listener/service."

  - name: "QuotationAskHistoryItem"
    type: "entity"
    description: "Chi tiết field thay đổi trong lịch sử quotation ask."
    attributes:
