    type: "entity"
    description: "Lịch sử transition của purchase order."
    attributes:
      - { name: "id", type: "BIGINT", required: true }
      - { name: "po_id", type: "BIGINT", required: true }
      - { name: "previous_stages", type: "JSONB", required: false }
      - { name: "transition_data", type: "JSONB", required: false }
    relationships:
      - { target: "PurchaseOrder", type: "logical_reference", description: "po_id liên kết history với PO." }
    invariants: []

  - name: "Supplier"
    type: "aggregate_root"
    description: "Nhà cung cấp tenant-scoped dùng cho direct PO và purchase flows."
    attributes:
      - { name: "id", type: "BIGINT", required: true }
      - { name: "tenant_id", type: "BIGINT", required: true }
      - { name: "supplier_code", type: "VARCHAR(50)", required: true }
      - { name: "supplier_name", type: "VARCHAR(200)", required: true }
      - { name: "tax_code", type: "VARCHAR(50)", required: false }
      - { name: "contact_phone", type: "VARCHAR(20)", required: true }
      - { name: "address", type: "TEXT", required: false }
      - { name: "province", type: "TEXT", required: false }
      - { name: "commune", type: "TEXT", required: false }
      - { name: "payment_terms", type: "PaymentTerms", required: true, constraints: ["COD | NET_7 | NET_15 | NET_30 | NET_60 | CREDIT"] }
      - { name: "preferred_warehouse_code", type: "VARCHAR(50)", required: false }
      - { name: "is_active", type: "BOOLEAN", required: true }
      - { name: "onboard_source", type: "SupplierOnboardSource", required: true, constraints: ["GARAGE | CARDOCTOR"] }
      - { name: "private_phone", type: "VARCHAR(20)", required: false }
    relationships:
      - { target: "PurchaseOrder", type: "one_to_many", description: "supplier_id/direct_supplier_id trong PO tham chiếu supplier." }
    invariants:
      - "Service kiểm tra trùng contactPhone theo tenant khi tạo/cập nhật supplier."
      - "Supplier code tạo theo NCC-{tenantId}-{supplierId}."
      - "GARAGE supplier được update hầu hết field trừ supplierCode; CARDOCTOR supplier chỉ cho update một tập field hạn chế."
      - "Response ẩn contactPhone của CARDOCTOR supplier và trả privatePhone riêng."

  - name: "UserPreference"
    type: "entity"
    description: "Preference người dùng theo tenant, hiện dùng lưu payment method gần nhất."
    attributes:
      - { name: "id", type: "BIGINT", required: true }
      - { name: "user_id", type: "VARCHAR", required: true }
      - { name: "tenant_id", type: "BIGINT", required: true }
      - { name: "subdomain", type: "VARCHAR", required: false }
      - { name: "preference_key", type: "PreferenceKey", required: true, constraints: ["PAYMENT_METHOD"] }
      - { name: "value", type: "TEXT", required: false }
    relationships: []
    invariants:
      - "saveUserPreference upsert theo preference_key, user_id và tenant_id ở repository."

  - name: "UserCard"
    type: "entity"
    description: "Thẻ người dùng được lưu từ luồng prepaid card callback."
    attributes:
      - { name: "id", type: "BIGINT", required: true }
      - { name: "user_id", type: "VARCHAR", required: true }
      - { name: "card_brand", type: "VARCHAR", required: true }
      - { name: "card_masked", type: "VARCHAR", required: true }
      - { name: "token_num", type: "VARCHAR", required: true }
      - { name: "token_exp", type: "VARCHAR", required: false }
      - { name: "card_uid", type: "VARCHAR", required: false }
      - { name: "deleted", type: "BOOLEAN", required: true }
    relationships: []
    invariants:
      - "createCard bỏ qua nếu thiếu userId/cardBrand/cardMasked/tokenNum/tokenExp."
      - "Nếu cardUid đã tồn tại với userId và deleted=false thì không tạo bản ghi trùng."
      - "deleteCard chỉ cho current user và set deleted=true."

  - name: "PaymentOrder"
    type: "aggregate_root"
    description: "Payment order nội bộ cho purchase request reconciliation."
    attributes:
      - { name: "id", type: "BIGINT", required: true }
      - { name: "purchase_request_code", type: "VARCHAR", required: false }
      - { name: "payment_method", type: "PaymentMethod", required: true }
      - { name: "payment_status", type: "PaymentStatus", required: true, constraints: ["PENDING | PAID"] }
      - { name: "total_amount", type: "VARCHAR encrypted BigDecimal", required: false }
      - { name: "currency", type: "Currency", required: true, constraints: ["VND"] }
      - { name: "payment_time", type: "TIMESTAMPTZ", required: false }
    relationships:
      - { target: "PurchaseRequest", type: "logical_reference", description: "purchase_request_code liên kết payment order với PR." }
      - { target: "PaymentBalance", type: "one_to_many", description: "Một payment order có nhiều balance theo supplier/PO." }
    invariants:
      - "Domain constructor mặc định paymentStatus=PENDING."
      - "PaymentOrderMapper mã hóa totalAmount bằng KMS khi lưu và giải mã khi đọc."

  - name: "PaymentBalance"
    type: "entity"
    description: "Phân bổ số tiền thanh toán theo purchaser, supplier, sale order và purchase order."
    attributes:
      - { name: "id", type: "BIGINT", required: true }
      - { name: "payment_order_id", type: "BIGINT", required: false }
      - { name: "purchaser_id", type: "BIGINT", required: false }
      - { name: "supplier_id", type: "BIGINT", required: false }
      - { name: "amount", type: "VARCHAR encrypted BigDecimal", required: false }
      - { name: "sale_order_code", type: "VARCHAR", required: false }
      - { name: "purchase_order_code", type: "VARCHAR", required: false }
    relationships:
      - { target: "PaymentOrder", type: "many_to_one", description: "payment_order_id liên kết balance với payment order." }
      - { target: "PurchaseOrder", type: "logical_reference", description: "purchase_order_code liên kết logic với PO." }
    invariants:
      - "PaymentBalanceMapper mã hóa amount bằng KMS khi lưu và giải mã khi đọc."

  - name: "OcrVehicleInfoHistory"
    type: "entity"
    description: "Lịch sử gọi OCR đăng ký xe cho quotation ask."
    attributes:
      - { name: "id", type: "BIGINT", required: true }
      - { name: "quotation_ask_id", type: "BIGINT", required: false }
      - { name: "tenant_id", type: "BIGINT", required: false }
      - { name: "attachment_url", type: "TEXT", required: true }
      - { name: "status_response", type: "VARCHAR", required: false }
      - { name: "json_response", type: "TEXT", required: true }
    relationships:
      - { target: "QuotationAsk", type: "logical_reference", description: "quotation_ask_id liên kết OCR response với quotation ask nếu có." }
    invariants:
      - "Raw OCR response được lưu dạng TEXT trong json_response."

  - name: "InboundMessage"
    type: "aggregate_root"
    description: "Inbox message runtime cho inbound retry/idempotency, hiện chưa có business handler active."
    attributes:
      - { name: "id", type: "BIGINT", required: true }
      - { name: "message_key", type: "VARCHAR(500)", required: true }
      - { name: "message_type", type: "VARCHAR(50)", required: true }
      - { name: "tenant_id", type: "BIGINT", required: false }
      - { name: "message_code", type: "VARCHAR", required: false }
      - { name: "payload", type: "JSONB", required: false }
      - { name: "message_group", type: "VARCHAR(50)", required: false }
      - { name: "message_step", type: "VARCHAR(50)", required: false }
      - { name: "origin_tenant_id", type: "BIGINT", required: false }
      - { name: "status", type: "ProcessingStatus", required: true, constraints: ["PENDING | COMPLETED | FAILED | RETRYING"] }
      - { name: "attempt_count", type: "INTEGER", required: true }
      - { name: "last_error", type: "TEXT", required: false }
      - { name: "is_notified", type: "BOOLEAN", required: true }
      - { name: "processed_at", type: "TIMESTAMP", required: false }
    relationships: []
    invariants:
      - "createMessage bắt DataIntegrityViolationException để bỏ qua duplicate message_key nếu DB constraint tồn tại."
      - "processMessage hiện markCompleted ngay vì switch business handler đang comment."

  - name: "OutboundMessage"
    type: "aggregate_root"
    description: "Outbox message runtime cho publish Kafka sau commit và batch retry."
    attributes:
      - { name: "id", type: "BIGINT", required: true }
      - { name: "message_type", type: "OutboundMessageType", required: true, constraints: ["PURCHASE_ORDER_STATUS_CHANGED"] }
      - { name: "tenant_id", type: "BIGINT", required: false }
      - { name: "message_code", type: "VARCHAR", required: false }
      - { name: "payload", type: "JSONB", required: false }
      - { name: "message_group", type: "VARCHAR(50)", required: false }
      - { name: "message_step", type: "VARCHAR(50)", required: false }
      - { name: "origin_tenant_id", type: "BIGINT", required: false }
      - { name: "status", type: "ProcessingStatus", required: true, constraints: ["PENDING | COMPLETED | FAILED | RETRYING"] }
      - { name: "attempt_count", type: "INTEGER", required: true }
      - { name: "last_error", type: "TEXT", required: false }
      - { name: "is_notified", type: "BOOLEAN", required: true }
      - { name: "processed_at", type: "TIMESTAMP", required: false }
    relationships: []
    invariants:
      - "createMessage lưu outbox row rồi publish OutboundMessageCreatedEvent."
      - "MessageEventListener xử lý outbound AFTER_COMMIT bằng listenerTaskExecutor."
      - "Lỗi publish tăng attemptCount; đủ max retry thì markFailed."

  - name: "Sequence"
    type: "sql_table"
    description: "KHÔNG phải JPA @Entity. Bảng SQL sequences + function get_next_number(schemaName, sequenceName) accessed qua DBUtils.getNextSequence để sinh mã nghiệp vụ — note for parity."
    attributes:
      - { name: "sequence_name", type: "VARCHAR(100)", required: true, constraints: ["primary key"] }
      - { name: "current_value", type: "BIGINT", required: true }
      - { name: "increment_by", type: "INTEGER", required: true }
      - { name: "created_at", type: "TIMESTAMP", required: true }
      - { name: "updated_at", type: "TIMESTAMP", required: true }
    relationships: []
    invariants:
      - "DBUtils.getNextSequence gọi function get_next_number(schemaName, sequenceName)."
      - "Tên sequence dùng trong code gồm purchase_request_id, purchase_order_id, direct_purchase_order_id, supplier_id và các sequence quotation/purchase liên quan."

business_rules:
  - { id: "BR-GF-PURCHASE-001", description: "QuotationAsk tạo mới ở OPEN, isProcessed=false; khi PR được tạo thì chuyển ORDER_CONFIRMING.", cornerstone: true, enforcement_point: "QuotationAsk constructor + QuotationAsk.prCreated + PurchaseRequestApplicationServiceV2.createPurchaseRequestV2" }
  - { id: "BR-GF-PURCHASE-002", description: "Không tạo PurchaseRequest từ QuotationAsk có status ORDER_CONFIRMING, CANCELLED hoặc CLOSED.", cornerstone: true, enforcement_point: "PurchaseRequestApplicationServiceV2.validateQuotationAskStatus" }
  - { id: "BR-GF-PURCHASE-003", description: "Pricing request phải có danh sách quantity hợp lệ: không null, số phần tử khớp số phụ tùng và mọi quantity > 0.", cornerstone: true, enforcement_point: "QuotationAskPricingApplicationServiceV2.validateQuantity" }
  - { id: "BR-GF-PURCHASE-004", description: "PurchaseRequest V2 tạo code XNDH-{quotationAsk.id}, default payment method COD cho mobile cũ, paymentStatus PENDING và có thể gọi gf-erp-agent khi feature flag v2-purchase-request-call-to-agent bật.", cornerstone: true, enforcement_point: "PurchaseRequestApplicationServiceV2.createPurchaseRequestV2 + supportOlderMobileVersions + callToPurchaseRequestAgent" }
  - { id: "BR-GF-PURCHASE-005", description: "Cancel PR chỉ hợp lệ khi mọi PO liên quan còn WAIT_TO_CONFIRM; nếu không thì throw lỗi và không hủy.", cornerstone: true, enforcement_point: "PurchaseRequestApplicationServiceV2.cancelService" }
  - { id: "BR-GF-PURCHASE-006", description: "Đổi payment method sau khi tạo YCDH không còn được hỗ trợ. Controller throw InvalidOperationException unconditionally; service logic (reset paymentStatus, sync PO, lưu user preference) đã bị comment out. Domain method và validation vẫn tồn tại nhưng unreachable.", cornerstone: false, enforcement_point: "PurchaseRequestControllerV2.changePaymentMethod (line 167: throw InvalidOperationException)" }
  - { id: "BR-GF-PURCHASE-007", description: "Checkout QR chỉ cho PRE_PAID_QR/POST_PAID_QR; checkout CC chỉ cho PRE_PAID_CC; payment method phải nằm trong app.payment.enabled-methods.", cornerstone: true, enforcement_point: "PurchaseRequestApplicationServiceV2.checkoutQR + checkoutCC + validateCheckoutReady" }
  - { id: "BR-GF-PURCHASE-008", description: "Luồng prepaid (PRE_PAID_QR và PRE_PAID_CC) chỉ được checkout khi PurchaseRequestConfirmation đã COMPLETE.", cornerstone: true, enforcement_point: "PurchaseRequestApplicationServiceV2.validateCheckoutReady" }
  - { id: "BR-GF-PURCHASE-009", description: "Reconciliation chạy theo Strategy pattern cho COD, POST_PAID_QR, PRE_PAID_QR và PRE_PAID_CC", cornerstone: true, enforcement_point: "ReconciliationApplicationService + app.service.reconciliation.strategy.*" }
  - { id: "BR-GF-PURCHASE-010", description: "PaymentOrder.totalAmount và PaymentBalance.amount được mã hóa/giải mã bằng KMS mapper khi lưu/đọc.", cornerstone: true, enforcement_point: "PaymentOrderMapper + PaymentBalanceMapper" }
  - { id: "BR-GF-PURCHASE-011", description: "Direct PO create bắt buộc directSupplierId, ít nhất một item và expectedDeliveryDate không được trước hôm nay.", cornerstone: true, enforcement_point: "DirectPurchaseOrderServiceImpl.validateCreateRequest + validateExpectedDeliveryDate" }
  - { id: "BR-GF-PURCHASE-012", description: "Direct PO chỉ được chuyển stage qua PurchaseOrder.transitionTo và PurchaseOrderStateMachine; CANCELLED bắt buộc cancellationReason, RETURNED bắt buộc returnReason.", cornerstone: true, enforcement_point: "PurchaseOrder.transitionTo + validateTransitionRequirements + DirectPurchaseOrderServiceImpl.updateStatus" }
  - { id: "BR-GF-PURCHASE-013", description: "Direct PO source khác DIRECT không được update qua direct purchase order API.", cornerstone: true, enforcement_point: "PurchaseOrder.ensureDirectSource + DirectPurchaseOrderServiceImpl.updatePurchaseOrder/updateAttachments" }
  - { id: "BR-GF-PURCHASE-014", description: "PurchaseOrderStatusChanged chỉ được publish khi PO stage DELIVERING và feature Inventory:InventoryStockV01 bật; payload chỉ lấy item có quantity > 0.", cornerstone: true, enforcement_point: "DirectPurchaseOrderServiceImpl + PurchaseOrderApplicationServiceV2 + PurchaseOrderEventPublisher" }
  - { id: "BR-GF-PURCHASE-015", description: "Outbound Kafka event phải đi qua OutboundMessage + AFTER_COMMIT listener hoặc protected batch retry; không publish trực tiếp trong transaction nghiệp vụ.", cornerstone: true, enforcement_point: "OutboundMessageService + MessageEventListener + SimpleMessageService" }
  - { id: "BR-GF-PURCHASE-016", description: "Supplier contactPhone được kiểm tra trùng theo tenant ở service; GARAGE supplier update rộng hơn CARDOCTOR supplier.", cornerstone: true, enforcement_point: "SupplierApplicationServiceV2.createSupplier/updateSupplier + Supplier domain" }
  - { id: "BR-GF-PURCHASE-017", description: "UserCard không tạo khi thiếu field bắt buộc hoặc cardUid đã tồn tại cho user và chưa deleted; xóa thẻ chỉ cho current user.", cornerstone: false, enforcement_point: "UserApplicationService.createCard/deleteCard" }
  - { id: "BR-GF-PURCHASE-018", description: "Tenant isolation phải enforce ở service/repository qua tenant_id, purchaser_id, supplier_id hoặc parent aggregate; không thấy tenant filter tự động ở entity/base repository.", cornerstone: true, enforcement_point: "SecurityUtils current tenant + repositories/specifications + data model isolation note" }
  - { id: "BR-GF-PURCHASE-019", description: "QuotationAsk code sinh theo format BG-{sequence} (sequence 'quotation_ask_id') qua DBUtils.getNextSequence gọi PostgreSQL function get_next_number trong transaction REQUIRES_NEW.", cornerstone: false, enforcement_point: "QuotationAskApplicationServiceV3.createQuotationAsk + DBUtils.getNextSequence + Constant.QUOTATION_ASK_ID" }
  - { id: "BR-GF-PURCHASE-020", description: "PurchaseRequest code sinh theo format XNDH-{quotationAsk.id} — dùng QA ID làm định danh, không dùng sequence riêng.", cornerstone: false, enforcement_point: "PurchaseRequestApplicationServiceV2.createPurchaseRequestV2" }
  - { id: "BR-GF-PURCHASE-021", description: "PurchaseOrder code sinh theo format DMH-{quotationAskId}-{purchaserId}-{supplierId} — composite key từ QA, purchaser và supplier.", cornerstone: false, enforcement_point: "PurchaseOrderApplicationServiceV2 + DBUtils.getNextSequence + Constant.PURCHASE_ORDER_ID" }
  - { id: "BR-GF-PURCHASE-022", description: "DirectPurchaseOrder code sinh theo format DMH-{sequence}-{directSupplierId} (sequence 'direct_purchase_order_id') qua DBUtils.getNextSequence; dùng thêm sequence 'purchase_order_id' cho PO ID.", cornerstone: false, enforcement_point: "DirectPurchaseOrderServiceImpl.createDirectPurchaseOrder + DBUtils.getNextSequence + Constant.DIRECT_PURCHASE_ORDER_ID" }

workflows: []

integrations:
  inbound:
    - type: API
      source: "gf-erp-agent"
      purpose: "ERP-driven status/stage updates, batch reconcile via /protected/v1/purchase-{orders,requests}/..., /quotations/..., /batch/..."
    - type: API
      source: "gf-inventory"
      purpose: "PO lookup — GET /protected/v1/purchase-orders/code/{code}, GET /protected/v1/purchase-orders/{code}/items"
    - type: API
      source: "gf-sales"
      purpose: "QA lookup — GET /protected/v1/quotation-asks"
    - type: API
      source: "gf-shipment"
      purpose: "PUT /protected/v1/purchase-orders/status — notify PO DELIVERED when shipment closed + isEnough + isLast"
    - type: API
      source: "gf-system"
      purpose: "GET /protected/v1/purchase-orders/transport-routes/{id}/used — check transport route usage"
    - type: API
      source: "agg-garage-graph"
      purpose: "BFF PO/PR/quotation queries"

  outbound:
    - type: API
      target: "gf-inventory"
      purpose: "Product lookup + receipt aggregation — /protected/v1/product/{product-lines,productId,po-summary}"
    - type: API
      target: "gf-erp-agent"
      purpose: "ERP-side quotation + purchase ops — POST /protected/v1/{quotation-asks,pricing,purchases}, PUT /purchases/{cancel,confirm,confirm-received}"
    - type: API
      target: "gf-system"
      purpose: "Tenant invoice info + branch/sequence lookup"
    - type: API
      target: "ct-saas-tenant"
      purpose: "Tenant lookup"
    - type: API
      target: "Payment Gateway"
      purpose: "Payment processing (POSTPAID/PREPAID QR + CC)"
    - type: API
      target: "OCR vehicle registration"
      purpose: "Vehicle OCR"
    - type: API
      target: "AWS KMS"
      purpose: "Encrypt payment card data (UserCardEntity)"
    - type: EVENT
      target: "Kafka — purchase-order-events"
      purpose: "Publish PurchaseOrderStatusChanged via outbox"

dependencies:
  - { name: "PostgreSQL", type: "database", purpose: "System of record cho quotation, bid/pricing, PR, PO, supplier, user preference/card, payment reconciliation, inbox/outbox và sequences.", config_ref: "spring.datasource.*, spring.jpa.properties.hibernate.default_schema, DB_SCHEMA" }
  - { name: "Flyway", type: "database_migration", purpose: "Quản lý schema migrations (15 files V1.0.0__initialize → V1.0.14__add_purchase_orders_transport_route_id_index trong src/main/resources/db/migration/). V1.0.14 thêm 2 partial indexes trên purchase_orders(purchaser_id, transport_route_id) và (tenant_id, transport_route_id).", config_ref: "flyway-core, flyway-database-postgresql, spring.flyway.*" }
  - { name: "Redis", type: "cache", purpose: "Spring cache cho dashboard, quotation, purchase, user preference/card và invalidation endpoints.", config_ref: "spring.data.redis.*, app.cache.key-prefix, spring.cache.redis.time-to-live" }
  - { name: "Kafka", type: "broker", purpose: "Publish PurchaseOrderStatusChanged qua outbox tới purchase-order-events.", config_ref: "spring.kafka.bootstrap-servers, spring.kafka.topics.purchase-order-events" }
  - { name: "AWS KMS", type: "encryption", purpose: "Mã hóa PaymentOrder.totalAmount và PaymentBalance.amount qua KMSUtil; TestingController expose encrypt/decrypt khi app.test-api-enabled=true.", config_ref: "aws.kms.enabled, aws.kms.key-id, PAYMENT_ENCRYPT_KEY" }
  - { name: "spring-security-starter", type: "auth", purpose: "Dual auth: /protected/* bằng x-api-key (ApiKeyAuthenticationFilter, INTERNAL_API_KEY), /api/* bằng JWT; SecurityUtils cho current user/tenant context và cache keys.", config_ref: "com.actechx.common:spring-security-starter, actechx.security.*" }
  - { name: "spring-feature-flag-starter", type: "feature_flag", purpose: "Gate: DirectPurchase:DirectPurchaseV01 (DirectPurchaseOrderController class-level + SupplierControllerV2 class-level + PurchaseOrderControllerV3 3 methods), Purchase:PurchaseV02 (PO v3 transport-route-references method-level), Marketplace:QuotationConsultant (QA v2 preliminary-quotation + internal preliminary-quotation), Dashboard:Basicdashboard (DashboardRealTimeController class-level), Inventory:InventoryStockV01 (event publish gate), mobile feature flags, agent-call flag.", config_ref: "feature-flag.*, feature-flags.backend.*, feature-flags.mobile" }
  - { name: "spring-otlp-starter", type: "observability", purpose: "OTLP tracing/observability theo profile otlp.", config_ref: "spring.profiles.include=otlp" }
  - { name: "SpringDoc OpenAPI", type: "api_documentation", purpose: "Expose OpenAPI UI cho REST controllers.", config_ref: "springdoc-openapi-starter-webmvc-ui:2.8.9" }


change_log:
  - { date: "2026-05-19", summary: "Cross-review với INTEG-EXT-gf-purchase.md: sửa integration_ref sai (D2), thêm full integration_consumers (D2); thêm gf-sales và gf-system vào integrations.inbound, mở rộng gf-inventory description (D5); xoá EVENT inbound entry gf-inventory-worker sai hướng — gf-purchase produces event, gf-inventory-worker consumes (D6); sửa spring-security-starter purpose dual auth (D3).", author: "Architecture Authority" }
  - { date: "2026-05-19", summary: "Source code audit: (H1) Flyway 14→15 files, thêm V1.0.14 transport_route_id indexes; (H2) thêm feature flag gates cho 6+ controllers (SupplierControllerV2 class-level DirectPurchase:DirectPurchaseV01, PurchaseOrderControllerV3 method-level DirectPurchase:DirectPurchaseV01 + Purchase:PurchaseV02, DashboardRealTimeController class-level Dashboard:Basicdashboard, QuotationAskControllerV2 method-level Marketplace:QuotationConsultant); (H3) sửa event meaning bỏ 'source=DIRECT' restriction — event publish cho any PO source khi DELIVERING; (M4) feature flag dependency liệt kê đầy đủ 5 flags. Source code bugs: FeatureFlags.PURCHASE_DIRECT_PURCHASE defined nhưng unused (service dùng FeatureFlagConfig.DIRECT_PURCHASE_V01_KEY).", author: "Architecture Authority" }
  - { date: "2026-05-11", summary: "Chuẩn hoá thứ tự section: business_rules trước workflows.", author: "Architecture Authority" }
  - { date: "2026-05-11", summary: "Sync với source: sửa PurchaseOrder.priority (String, không phải enum), thêm 6 audit fields, Sequence dùng sql_table, thêm Flyway/SpringDoc deps, làm rõ MessageStep publish, tinh chỉnh auth APIs.", author: "Architecture Authority" }
