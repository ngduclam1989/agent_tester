      - { name: "new_data", type: "TEXT", required: false }
      - { name: "note", type: "TEXT", required: false }
      - { name: "quotation_ask_history_id", type: "BIGINT", required: true }
    relationships:
      - { target: "QuotationAskHistory", type: "many_to_one", description: "History item thuộc một quotation ask history." }
    invariants: []

  - name: "Cart"
    type: "aggregate_root"
    description: "Giỏ hàng phụ tùng theo purchaser/vendor, liên kết tới product và quotation ask."
    attributes:
      - { name: "id", type: "BIGINT", required: true }
      - { name: "product_id", type: "BIGINT", required: true }
      - { name: "quotation_ask_id", type: "BIGINT", required: true }
      - { name: "purchaser_id", type: "BIGINT", required: true }
      - { name: "supplier_id", type: "BIGINT", required: true }
      - { name: "quantity", type: "INTEGER", required: true }
      - { name: "is_picked", type: "BOOLEAN", required: true }
      - { name: "ref_pr_code", type: "VARCHAR", required: false }
      - { name: "deleted", type: "BOOLEAN", required: true }
    relationships:
      - { target: "QuotationAsk", type: "logical_reference", description: "quotation_ask_id liên kết logic tới quotation ask." }
    invariants:
      - "deleted là soft delete cho cart item."

  - name: "PurchaseRequest"
    type: "aggregate_root"
    description: "Xác nhận đặt hàng từ garage, gom các dòng sản phẩm đã chọn từ quotation/cart và điều phối payment/PO."
    attributes:
      - { name: "id", type: "BIGINT", required: true }
      - { name: "code", type: "VARCHAR(50)", required: true, constraints: ["unique"] }
      - { name: "purchaser_id", type: "BIGINT", required: true }
      - { name: "status", type: "PurchaseRequestStatus", required: false }
      - { name: "note", type: "TEXT", required: false }
      - { name: "status_transition_data", type: "JSONB", required: false }
      - { name: "payment_method", type: "PaymentMethod", required: false, constraints: ["COD | POST_PAID_QR | PRE_PAID_QR | PRE_PAID_CC | BANK_TRANSFER | CREDIT"] }
      - { name: "payment_status", type: "PaymentStatus", required: false, constraints: ["PENDING | PAID"] }
    relationships:
      - { target: "PurchaseRequestData", type: "one_to_many", description: "Một PR có nhiều dòng sản phẩm yêu cầu." }
      - { target: "PurchaseRequestConfirmation", type: "one_to_many", description: "Một PR có record chờ vendor confirmation khi place order." }
      - { target: "PRQuotationRef", type: "one_to_many", description: "Một PR có thể tham chiếu nhiều quotation ask." }
      - { target: "PurchaseOrder", type: "one_to_many", description: "Một PR có thể tạo nhiều purchase order theo supplier." }
      - { target: "PaymentOrder", type: "one_to_many", description: "payment_orders liên kết qua purchase_request_code." }
    invariants:
      - "PurchaseRequest domain constructor mặc định status=OPEN và paymentStatus=PENDING."
      - "(dead code) changePaymentMethod reset paymentStatus về PENDING — domain method còn tồn tại nhưng controller đã block, service logic commented out."
      - "(dead code) Không đổi payment method nếu PR đã ORDER_CREATED hoặc CANCELLED — validation còn tồn tại nhưng unreachable."
      - "Tạo PR V2 đặt code theo XNDH-{quotationAsk.id}."

  - name: "PurchaseRequestData"
    type: "entity"
    description: "Dòng sản phẩm trong purchase request, gồm product, vendor, số lượng và giá chi tiết."
    attributes:
      - { name: "id", type: "BIGINT", required: true }
      - { name: "requested_product_name", type: "VARCHAR", required: true }
      - { name: "quotation_ask_code", type: "VARCHAR", required: true }
      - { name: "product_id", type: "BIGINT", required: true }
      - { name: "purchase_request_id", type: "BIGINT", required: true }
      - { name: "purchaser_id", type: "BIGINT", required: true }
      - { name: "supplier_id", type: "BIGINT", required: true }
      - { name: "requested_quantity", type: "INTEGER", required: true }
      - { name: "actual_sales_quantity", type: "INTEGER", required: false }
      - { name: "detailed_price", type: "NUMERIC", required: false }
      - { name: "material_price", type: "NUMERIC", required: false }
      - { name: "servicing_price", type: "NUMERIC", required: false }
      - { name: "sales_status", type: "PurchaseRequestDataStatus", required: true }
    relationships:
      - { target: "PurchaseRequest", type: "many_to_one", description: "Dòng sản phẩm thuộc một purchase request." }
    invariants: []

  - name: "PurchaseRequestConfirmation"
    type: "entity"
    description: "Trạng thái chờ vendor xác nhận sau khi garage place order."
    attributes:
      - { name: "id", type: "BIGINT", required: true }
      - { name: "purchase_request_id", type: "BIGINT", required: true }
      - { name: "purchase_request_code", type: "VARCHAR", required: true }
      - { name: "status", type: "PurchaseRequestConfirmationStatus", required: true, constraints: ["PENDING | COMPLETE"] }
    relationships:
      - { target: "PurchaseRequest", type: "logical_reference", description: "purchase_request_id/code liên kết confirmation với PR." }
    invariants:
      - "Checkout prepaid cần confirmation COMPLETE, trừ POST_PAID_QR và COD."

  - name: "PRQuotationRef"
    type: "entity"
    description: "Bảng nối logic giữa purchase request và quotation ask."
    attributes:
      - { name: "id", type: "BIGINT", required: true }
      - { name: "pr_id", type: "BIGINT", required: true }
      - { name: "quotation_ask_id", type: "BIGINT", required: true }
    relationships:
      - { target: "PurchaseRequest", type: "logical_reference", description: "pr_id tham chiếu purchase_request.id." }
      - { target: "QuotationAsk", type: "logical_reference", description: "quotation_ask_id tham chiếu quotation_asks.id." }
    invariants: []

  - name: "PRTransitionHistory"
    type: "entity"
    description: "Lịch sử transition của purchase request."
    attributes:
      - { name: "id", type: "BIGINT", required: true }
      - { name: "pr_id", type: "BIGINT", required: true }
      - { name: "previous_stages", type: "JSONB", required: false }
      - { name: "transition_data", type: "JSONB", required: false }
    relationships:
      - { target: "PurchaseRequest", type: "logical_reference", description: "pr_id liên kết history với PR." }
    invariants: []

  - name: "PurchaseOrder"
    type: "aggregate_root"
    description: "Đơn mua hàng legacy/ecommerce/direct, sở hữu stage/status, supplier, payment method, product refs, direct PO audit fields và event receipt-facing."
    attributes:
      - { name: "id", type: "BIGINT", required: true }
      - { name: "code", type: "VARCHAR", required: false, constraints: ["unique"] }
      - { name: "source", type: "PurchaseSource", required: false, constraints: ["QUOTATION_ASK | CART | CHAT | DIRECT | ECOMMERCE"] }
      - { name: "transport_order_id", type: "BIGINT", required: false }
      - { name: "purchaser_id", type: "BIGINT", required: false }
      - { name: "supplier_id", type: "BIGINT", required: false }
      - { name: "supplier_name", type: "VARCHAR", required: false }
      - { name: "payment_method", type: "PaymentMethod", required: false }
      - { name: "is_best_price", type: "BOOLEAN", required: false }
      - { name: "transport_route_id", type: "BIGINT", required: false }
      - { name: "quotation_ask_code", type: "TEXT", required: false }
      - { name: "stage", type: "POStage", required: false, constraints: ["WAIT_TO_CONFIRM | OPEN | DELIVERING | DELIVERED | CLOSED | COMPLETED | CANCELLED | RETURNED"] }
      - { name: "status", type: "POStatusEnum", required: false }
      - { name: "note", type: "VARCHAR", required: false }
      - { name: "pr_id", type: "BIGINT", required: false }
      - { name: "sale_order_code", type: "VARCHAR", required: false }
      - { name: "tenant_id", type: "BIGINT", required: false }
      - { name: "direct_supplier_id", type: "BIGINT", required: false }
      - { name: "priority", type: "VARCHAR", required: false, constraints: ["String column — PurchaseOrderPriority enum tồn tại nhưng entity lưu raw String"] }
      - { name: "related_service_order_code", type: "VARCHAR", required: false }
      - { name: "expected_delivery_date", type: "DATE", required: false }
      - { name: "supplier_contact_phone", type: "VARCHAR", required: false }
      - { name: "supplier_tax_code", type: "VARCHAR", required: false }
      - { name: "supplier_address", type: "TEXT", required: false }
      - { name: "notes", type: "TEXT", required: false }
      - { name: "confirmed_by", type: "VARCHAR", required: false }
      - { name: "confirmed_at", type: "TIMESTAMP", required: false }
      - { name: "delivering_by", type: "VARCHAR", required: false }
      - { name: "delivering_at", type: "TIMESTAMP", required: false }
      - { name: "delivered_at", type: "TIMESTAMP", required: false }
      - { name: "completed_by", type: "VARCHAR", required: false }
      - { name: "closed_by", type: "VARCHAR", required: false }
      - { name: "closed_at", type: "TIMESTAMP", required: false }
      - { name: "cancelled_by", type: "VARCHAR", required: false }
      - { name: "cancelled_at", type: "TIMESTAMP", required: false }
      - { name: "cancellation_reason", type: "TEXT", required: false }
      - { name: "returned_by", type: "VARCHAR", required: false }
      - { name: "returned_at", type: "TIMESTAMP", required: false }
      - { name: "return_reason", type: "TEXT", required: false }
      - { name: "version", type: "BIGINT", required: false }
    relationships:
      - { target: "PurchaseRequest", type: "logical_reference", description: "pr_id liên kết PO về purchase request nếu được tạo từ PR." }
      - { target: "PurchaseOrderItem", type: "one_to_many", description: "Một PO có nhiều dòng item chuẩn hóa cho direct/inventory event." }
      - { target: "PurchaseOrderAttachment", type: "one_to_many", description: "Một direct PO có nhiều attachment." }
      - { target: "POProduct", type: "one_to_many", description: "Legacy PO product lines gắn với PO." }
      - { target: "POSupplier", type: "one_to_one", description: "Supplier status snapshot của PO legacy." }
      - { target: "POQuotationRef", type: "one_to_many", description: "PO có thể tham chiếu nhiều quotation ask code." }
      - { target: "POTransitionHistory", type: "one_to_many", description: "Lịch sử chuyển stage/status của PO." }
      - { target: "Supplier", type: "logical_reference", description: "supplier_id/direct_supplier_id tham chiếu supplier theo tenant." }
    invariants:
      - "Direct PO phải có source DIRECT và được update qua DirectPurchaseOrderService."
      - "Direct PO create bắt buộc directSupplierId và ít nhất một item."
      - "expectedDeliveryDate không được trước ngày hiện tại khi tạo/cập nhật direct PO."
      - "transitionTo map POStage sang POStatusEnum, validate PurchaseOrderStateMachine và chặn terminal status COMPLETED/CANCELLED/RETURNED."
      - "CANCELLED bắt buộc cancellationReason; RETURNED bắt buộc returnReason."
      - "Event inventory chỉ phát khi stage DELIVERING và feature Inventory:InventoryStockV01 bật."

  - name: "PurchaseOrderItem"
    type: "entity"
    description: "Dòng hàng chuẩn hóa của purchase order, dùng cho direct PO và payload receipt inventory."
    attributes:
      - { name: "id", type: "BIGINT", required: true }
      - { name: "tenant_id", type: "BIGINT", required: true }
      - { name: "purchase_order_id", type: "BIGINT", required: true }
      - { name: "sku", type: "VARCHAR(100)", required: true }
      - { name: "genuine_code", type: "VARCHAR(100)", required: false }
      - { name: "product_name", type: "VARCHAR", required: true }
      - { name: "tier", type: "VARCHAR(50)", required: false }
      - { name: "origin", type: "VARCHAR(100)", required: false }
      - { name: "quantity", type: "NUMERIC(10,2)", required: true }
      - { name: "unit_of_measure", type: "VARCHAR(20)", required: true }
      - { name: "unit_price", type: "NUMERIC(15,2)", required: true }
      - { name: "discount_percent", type: "NUMERIC(5,2)", required: false }
      - { name: "discount_amount", type: "NUMERIC(15,2)", required: false }
      - { name: "tax_rate", type: "NUMERIC(5,2)", required: false }
      - { name: "tax_amount", type: "NUMERIC(15,2)", required: false }
      - { name: "line_amount", type: "NUMERIC(15,2)", required: true }
      - { name: "total_amount", type: "NUMERIC(15,2)", required: true }
      - { name: "quotation_ask_code", type: "VARCHAR", required: false }
      - { name: "product_id", type: "BIGINT", required: false }
    relationships:
      - { target: "PurchaseOrder", type: "many_to_one", description: "purchase_order_id liên kết item với PO." }
    invariants:
      - "Event PurchaseOrderStatusChanged chỉ lấy item có quantity > 0."
      - "calculateAllAmounts tính amount/tax/total khi thêm hoặc cập nhật item direct PO."

  - name: "PurchaseOrderAttachment"
    type: "entity"
    description: "Attachment của direct purchase order."
    attributes:
