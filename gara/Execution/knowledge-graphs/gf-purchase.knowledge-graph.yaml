      - { name: "file_name", type: "VARCHAR(255)", required: false }
      - { name: "file_type", type: "VARCHAR(10)", required: false }
      - { name: "type", type: "AttachmentType", required: true }
      - { name: "deleted", type: "BOOLEAN", required: true }
    relationships:
      - { target: "PurchaseOrder", type: "logical_reference", description: "purchase_order_id liên kết attachment với PO." }
    invariants:
      - "Update attachments của direct PO sync bằng soft delete URL không còn trong request và thêm URL mới."

  - name: "POProduct"
    type: "entity"
    description: "Dòng product legacy/ecommerce của purchase order, liên kết quotation ask, supplier và product inventory."
    attributes:
      - { name: "id", type: "BIGINT", required: true }
      - { name: "po_id", type: "BIGINT", required: true }
      - { name: "product_id", type: "BIGINT", required: true }
      - { name: "requested_product_name", type: "VARCHAR", required: true }
      - { name: "quantity", type: "BIGINT", required: false }
      - { name: "unit_price", type: "NUMERIC", required: false }
      - { name: "unit", type: "VARCHAR", required: false }
      - { name: "segment", type: "Segment", required: false }
      - { name: "supplier_id", type: "BIGINT", required: true }
      - { name: "quotation_ask_code", type: "VARCHAR", required: false }
      - { name: "sku", type: "VARCHAR", required: false }
      - { name: "genuine_code", type: "VARCHAR", required: false }
    relationships:
      - { target: "PurchaseOrder", type: "logical_reference", description: "po_id liên kết POProduct với PO." }
    invariants:
      - "placeOrder/confirm có thể removeFromPurchase cho product không được chọn."

  - name: "POSupplier"
    type: "entity"
