events:
  produces: []
  consumes: []

data:
  entities: []
  relationships: []

business_rules:
  - { id: "BR-AGG-GARAGE-GRAPH-001", description: "Data enrichment: hầu hết queries gọi gf-erp-mdm /api/v1/catalog/find-by-code để map vehicle codes → full names, UoM codes → display names, insurance codes → names, geographic codes → province/ward names. Pattern lặp lại ~30+ resolvers.", cornerstone: true, enforcement_point: "catalogHandlers.findByCode() trong quotation/order/mdm/gf-sales/gf-customer/supplier resolvers" }
  - { id: "BR-AGG-GARAGE-GRAPH-002", description: "Status normalization: service order status PRICING được map thành CHECKED cho frontend display.", cornerstone: false, enforcement_point: "gf-sales resolvers service order status mapping" }
  - { id: "BR-AGG-GARAGE-GRAPH-003", description: "Multi-version API routing: header Garage-App-Version switch v1/v2/v3 downstream endpoint. getEndpointsByVersion(garageAppVersion) chọn path phù hợp. Ảnh hưởng tenant, payment, booking, service-order resolvers.", cornerstone: true, enforcement_point: "getEndpointsByVersion() trong tenant/payment/gf-sales resolvers" }
  - { id: "BR-AGG-GARAGE-GRAPH-004", description: "Token propagation: JWT từ client forwarded verbatim qua Authorization header tới mọi downstream service. BFF KHÔNG validate token — delegation cho backend services.", cornerstone: true, enforcement_point: "ApiClient context.token → Authorization header forwarding" }
  - { id: "BR-AGG-GARAGE-GRAPH-005", description: "Error handling: ApiClientError wrapper capture backend HTTP errors, ErrorResponse union type cho GraphQL response, distributed tracing context (requestId, traceId) inject vào error payload.", cornerstone: true, enforcement_point: "ApiClientError + ErrorResponse type + GraphQL error formatter" }
  - { id: "BR-AGG-GARAGE-GRAPH-006", description: "Parallel downstream fetching: Promise.all() cho multi-service aggregation. Example: getServiceOrderByIdV3 gọi song song gf-sales + gf-erp-mdm + gf-purchase + gf-inventory + gf-accounting + gf-hrms.", cornerstone: true, enforcement_point: "Promise.all() trong complex resolvers (gf-sales, mdm, gf-accounting)" }

workflows: []

integrations:
  inbound:
    - type: API
      source: "garage-web frontend"
      purpose: "All UI queries/mutations via GraphQL POST /graphql"
    - type: API
      source: "garage-mobile (if reused)"
      purpose: "Mobile client GraphQL requests"

  outbound:
    - type: API
      target: "gf-sales"
      purpose: "booking, booking-v3, service-orders, service-orders-v3, customers, vehicles, quotation-ask, dashboard-realtime (gf-sales endpoints: SO debt + SO in-progress + booking arrived) modules"
    - type: API
      target: "gf-customer"
      purpose: "gf-customer module (customer master data resolvers)"
    - type: API
      target: "gf-purchase"
      purpose: "order, purchase, quotation, supplier, payment (partial), user, dashboard, direct-purchase-order, enable-payment-method-mobile, dashboard-realtime (gf-purchase endpoints: QA asking + PO delivering) resolvers"
    - type: API
      target: "gf-inventory"
      purpose: "mdm module (deliveries, receipts, stocks), warehouse module"
    - type: API
      target: "gf-accounting"
      purpose: "gf-accounting module (settlements)"
    - type: API
      target: "gf-erp-mdm"
      purpose: "catalog, mdm (catalog enrichment)"
    - type: API
      target: "gf-marketing"
      purpose: "campaign, voucher modules"
    - type: API
      target: "gf-notification"
      purpose: "notification module"
    - type: API
      target: "gf-system"
      purpose: "gf-system module (tenant-transporter-registry CRUD + search + detail)"
    - type: API
      target: "gf-hrms"
      purpose: "hrms, user modules"
    - type: API
      target: "ct-saas-tenant"
      purpose: "tenant module + gf-system tenant context enrichment"
    - type: API
      target: "ct-file-storage"
      purpose: "uploadFile module (REST + multipart)"
    - type: API
      target: "cp-cms-index"
      purpose: "Configured for /health probe only — no resolver downstream calls cp-cms-index (service instance + healthcheck wiring exists but unused by operations)"
    - type: API
      target: "ac-payment-gateway"
      purpose: "payment module (createPayment, getPaymentByPurchase) — 3rd-party, x-api-key-feedback"
    - type: API
      target: "policy-agent"
      purpose: "policy-agent module (roles, resources, permissions)"
    - type: API
      target: "Superset"
      purpose: "supper-set module (BI guest token via admin user/pass + CSRF cookie chain)"

dependencies:
  - { name: "Apollo Server 4", type: "framework", purpose: "GraphQL server compose 26 module schemas; expose POST /graphql/graphql; resolve query/mutation tới 14 backend service.", config_ref: "GRAPHQL_PUBLIC_PATH, apolloConfig.*, module-schema loaders" }
  - { name: "Express", type: "framework", purpose: "HTTP runtime cho Apollo Server, middleware auth, multipart upload, CSRF.", config_ref: "server.port, middleware.*" }
  - { name: "HTTP client (axios / fetch)", type: "api_client", purpose: "Gọi REST của 12+ backend service (gf-*, ct-saas-tenant, ct-file-storage, ac-payment-gateway, policy-agent, Superset).", config_ref: "<service>.api.host, <service>.api-key, timeout configs" }
  - { name: "JWT auth", type: "auth", purpose: "Validate access token từ garage-web/mobile; resolve tenant context, permission flags qua policy-agent.", config_ref: "JWT_PUBLIC_KEY, JWT_ISSUER, auth middleware" }
  - { name: "OpenTelemetry", type: "observability", purpose: "Auto-instrumentation Express + HTTP + GraphQL; trace export OTLP HTTP; metrics export OTLP HTTP.", config_ref: "OTEL_ENABLED, OTEL_EXPORTER_OTLP_ENDPOINT, OTEL_SERVICE_NAME" }
  - { name: "Winston + prom-client", type: "logging_metrics", purpose: "Structured logging với distributed tracing context (requestId); Prometheus metrics tại /metrics endpoint.", config_ref: "LOG_LEVEL, winston.*, prom-client collectDefaultMetrics" }
  - { name: "http-proxy-middleware", type: "proxy", purpose: "Catch-all proxy sang Apache Superset cho embedded BI dashboard; pathRewrite ^/supperset → ''; xóa x-frame-options/CSP.", config_ref: "SUPERSET_ENDPOINT, proxy allowlist trong checkPath" }

change_log:
  - { date: "2026-06-30", summary: "W03 (EP-INVENTORY-CATALOG — DESIGN ADR-017/018, contract agg-garage-graph-graphql v7.30) DEV: module mới `gf-inventory/catalog-v2` với 8 Query + 15 Mutation = 23 ops passthrough sang gf-inventory V2-1..V2-23 + gf-erp-mdm `/protected/catalog/v1/inquiry` (Q9 listUnits, directory=UNIT/COUNTRY enrichment). Module file layout: catalog-v2.{schema,resolver,service,types,enrichment}.ts + error-code-map.ts + export-proxy.ts. SDL types mới: `MaterialGroup` (+parentName/createdByName/updatedByName R20/R21), `InternalProduct` (+mainUnitDisplayName/originDisplayName enrichment), `InternalProductConversionUnit/SkuMapping/Attachment`, `Unit`, `SkuSearchResult`, `MaterialGroupTreeNode`, `DeletePayload`, `ExportFileUrlPayload`, `ImportInternalProductsReport/Result/Summary/Row`. Enums: `MaterialGroupStatus`, `InternalProductStatus`, `ProductNature (GOODS|TOOL|SERVICE|OTHER)`, `PricingMethod (PWA|SI|FIFO|MA)`, `SkuMappingStatus`. Enrichment pattern (BR-AGG-GARAGE-GRAPH-001): top-level resolver gom distinct codes/iamUserIds → 1 batch call per directory; shared 5-min in-process cache scoped (directory, tenantId) cho gf-erp-mdm UNIT/COUNTRY; tenant-users không cache cross-request. Defense caps BFF-side: (a) Q2 MAX 1000 nodes → throw ApiClientError `MATERIAL_GROUP_TREE_OVERSIZE` HTTP 413 (hint redirect Q1, mirror backend `ERR-INV-027`); (b) M14/M15 cap 500 rows → `ERR-INV-041` HTTP 400. Export pattern (Q7 R22 Option A): resolver issues short-lived signed token (TTL 60s, single-use, in-memory) → returns `data.downloadUrl: /api/v2/internal-products/export/{token}` → middleware mounted ở `${CONTEXT_PATH}/api/v2/internal-products/export/:token` validate token → replay V2-22 với captured auth → stream binary .xlsx + Content-Disposition pass-through (fallback filename `danh-muc-ma-san-pham-noi-bo-{ts}.xlsx`). Error code map (T15): table ERR-INV-001..047 + ERR-CMN-004..006 → GraphQL `extensions.code` pass-through (BR-AGG-GARAGE-GRAPH-005 — KHÔNG mutate code/message). R29 precision: BFF KHÔNG validate scale conversionRate; backend single source `ERR-INV-047`. Header propagation (additive cross-module): apiClient buildHeaders forward `x-tenant-id` + `x-branch-id` khi caller cung cấp (HEADER_KEYS extended; backward-compat — vẫn null nếu thiếu). Endpoints constants new: MATERIAL_GROUP + INTERNAL_PRODUCT + SKU_SEARCH + GF_ERP_MDM_CATALOG under API_ENDPOINTS_V2. Test: regression `npm run test:catalog-v2-contract` (ts-node self-contained — match precedent W01/W02 insurance.mapper.regression + orchestrator.regression) — 8 scenarios + ~55 assertions all pass: (1) resolver wiring 23 ops, (2/3) TENANT-USERS enrichment paged+single+conditional skip, (4) Q2 tree cap, (5) M14/M15 import cap, (6) UNIT/COUNTRY batch dedup, (7) Q7 token roundtrip + single-use replay 403, (8) error code map pass-through. build+typecheck+lint (new files) PASS. Vitest gap: repo còn chưa có first-party Vitest runner (CLAUDE.md baseline) — coverage ≥80% gate gồm regression chỉ; CR riêng cho Vitest harness deferred (chưa block W03 exit per CLAUDE.md §Build Commands honest-gap rule).", author: "agent-dev-agg-garage-graph (W03)" }
