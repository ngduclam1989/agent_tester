# Knowledge Graph — agg-garage-graph

boundary: "agg-garage-graph"
version: 12
last_updated: "2026-06-30"
owner_authority: "Architecture Authority"

metadata:
  purpose: "BFF GraphQL aggregator cho garage-web (và mobile reuse một phần): compose 26 module schemas, resolve qua 16 BE/external service (10 gf-* + ct-saas-tenant + ct-file-storage + cp-cms-index + ac-payment-gateway + policy-agent + Superset). Không own DB — mọi state sống ở BE."
  tech: { language: "Node.js 22", framework: "Apollo Server 4 + Express", data_store: "none" }
  epics: []
  features: []
  integration_ref: "Architecture/integrations/INTEG-BFF-agg-garage-graph.md"
  integration_consumers: []

