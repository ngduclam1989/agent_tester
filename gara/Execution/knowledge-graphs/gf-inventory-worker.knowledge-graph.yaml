# Knowledge Graph — gf-inventory-worker

boundary: "gf-inventory-worker"
version: 5
last_updated: "2026-05-21"
owner_authority: "Architecture Authority"

metadata:
  purpose: "Stateless Temporal worker điều phối async workflows cho inventory: receipt/delivery fulfillment, reservation TTL, period stock closure. Không own DB — mọi state mutation gọi REST sang gf-inventory (Fat API / Thin Worker pattern, ADR-008)."
  tech: { language: "Java 21", framework: "Spring Boot 3.5.0 + Temporal Java SDK", data_store: "none" }
  epics: []
  features: []
  integration_consumers: []

apis:
  - name: "reservation-expiry-start"
    path: "/protected/workflows/reservation-expiry/start"
    method: POST
    purpose: "Start ReservationExpiryWorkflow (caller gf-inventory.WorkerClient)"
    status: internal-only
    active_callers: ["gf-inventory"]
    replaced_by: null
    request:
      schema:
        tenantId: long
        reservationCode: string
        deliveryCode: string
        warehouseCode: string
        sourceType: string
        ttlMinutes: integer
        expiresAt: instant
        salesOrderCode: string
        serviceOrderCode: string
    response:
      schema:
        success: boolean

  - name: "reservation-expiry-release"
    path: "/protected/workflows/reservation-expiry/{deliveryCode}/release"
    method: POST
    purpose: "Signal release on existing ReservationExpiryWorkflow"
    status: internal-only
    active_callers: ["gf-inventory"]
    replaced_by: null
    request:
      path_params:
        deliveryCode: string
      schema:
        tenantId: long
        userId: string
        reason: string
    response:
      schema:
        success: boolean

  - name: "reservation-expiry-fulfill"
    path: "/protected/workflows/reservation-expiry/{deliveryCode}/fulfill"
    method: POST
    purpose: "Signal fulfill on existing ReservationExpiryWorkflow"
    status: internal-only
    active_callers: ["gf-inventory"]
    replaced_by: null
    request:
      path_params:
        deliveryCode: string
      schema:
        tenantId: long
        userId: string
    response:
      schema:
        success: boolean

  - name: "period-closure-trigger"
    path: "/protected/v2/period-closure/operator/trigger"
    method: POST
    purpose: "Manual start of PeriodClosureCoordinatorWorkflow"
    status: unused  # TODO: admin-only manual trigger
    active_callers: []
    replaced_by: null
    request:
      schema:
        periodCode: string
    response:
      schema:
        workflowId: string

  - name: "period-closure-status"
    path: "/protected/v2/period-closure/operator/status/{workflowId}"
    method: GET
    purpose: "Query workflow execution status"
    status: unused  # TODO: admin-only
    active_callers: []
    replaced_by: null
    request:
      schema:
        workflowId: string
    response:
      schema:
        status: object

  - name: "period-closure-result"
    path: "/protected/v2/period-closure/operator/result/{workflowId}"
    method: GET
    purpose: "Query workflow result"
    status: unused  # TODO: admin-only
    active_callers: []
    replaced_by: null
    request:
      schema:
        workflowId: string
    response:
      schema:
        result: object

  - name: "period-closure-stats"
    path: "/protected/v2/period-closure/operator/stats"
    method: GET
    purpose: "Aggregate stats for period closure runs"
    status: unused  # TODO: admin-only
    active_callers: []
    replaced_by: null
    request:
      query_params:
        periodCode: string
    response:
      schema:
        stats: object

  - name: "period-closure-cancel"
    path: "/protected/v2/period-closure/operator/cancel/{workflowId}"
    method: POST
    purpose: "Cancel running workflow (sends cancel signal — workflow stops spawning new batches)"
    status: unused  # TODO: admin-only
    active_callers: []
    replaced_by: null
    request:
      path_params:
        workflowId: string
    response:
      schema:
        workflowId: string
