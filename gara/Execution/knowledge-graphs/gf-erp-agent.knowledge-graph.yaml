# Knowledge Graph — gf-erp-agent

boundary: "gf-erp-agent"
version: 2
last_updated: "2026-05-18"
owner_authority: "Architecture Authority"

metadata:
  purpose: "Durable message bridge giữa Garage và ERP/COP: nhận protected REST command, lưu outbound_message, publish Kafka, consume inbound Kafka, lưu inbound_message, gọi downstream Garage services, fanout notification và hỗ trợ batch retry thủ công."
  tech: { language: "Java 21", framework: "Spring Boot 3.5.0 + Spring Data JPA + Kafka", data_store: "PostgreSQL" }
  epics: []
  features: []
  integration_ref: "Architecture/api/gf-erp-agent-api.md"
  integration_consumers: []


