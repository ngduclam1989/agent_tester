    status: internal-only  
    active_callers: ["gf-worker"]
    replaced_by: null
    request:
      schema: {}
    response:
      schema:
        data: array  # List<BatchResponse>{key: string, success: boolean}

  - name: "batch-outbound"
    path: "/protected/v1/batch/outbound"
    method: POST
    purpose: "Cron-triggered batch publish of pending outbound_message rows"
    status: internal-only  
    active_callers: ["gf-worker"]
    replaced_by: null
