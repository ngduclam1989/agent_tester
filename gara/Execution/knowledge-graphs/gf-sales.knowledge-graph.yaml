events:
  produces:
    - topic: "AC-DEV-BOOKING-EVENTS"
      payload:
        message_step: "BookingMessageStep — BOOKING.CHANGE.STATUS | BOOKING.CREATE.RESPONSE | BOOKING.UPDATE.RESPONSE"
        tenant_id: long
        booking_id: long
        booking_code: string
        status: string
      meaning: |
        Topic hai chiều (xem thêm consumes), source=GF_SALES, qua outbox pattern. Enum BookingMessageStep (com.actechx.gf.domain.model.enums.BookingMessageStep), 3 step outbound:
          BOOKING.CHANGE.STATUS — BookingStatusChangedEvent: phát mỗi khi booking chuyển trạng thái bất kỳ; emitted by BookingStatusEventProducer.
          BOOKING.CREATE.RESPONSE — BookingCreateResponseEvent: phản hồi Driver+ sau khi tạo booking thành công (AC-1 response), chứa full booking snapshot; emitted by BookingV3Service.publishBookingCreateResponse.
          BOOKING.UPDATE.RESPONSE — BookingCreateResponseEvent: phản hồi Driver+ sau khi cập nhật booking, cùng event class với CREATE_RESPONSE, phân biệt bởi MessageStep header; emitted by BookingV3Service.publishBookingCreateResponse.

    - topic: "AC-NONPROD-DEV-NOTIFICATION-REQUEST"
      payload:
        message_step: "SENT.NOTIFICATION (dùng chung wire value cho cả BookingMessageStep và ServiceOrderMessageStep)"
        notification_type: string
        channel: string
        placeholders: object
      meaning: |
        Gửi notification qua outbox pattern; emitted by NotificationRequestProducer. MessageStep luôn là SENT.NOTIFICATION, MessageGroup header phân biệt nguồn BOOKING vs SERVICE_ORDER.
          MessageGroup=BOOKING — BOOKING_CREATED, BOOKING_CANCELLED_BY_DRIVER, BOOKING_AUTO_CANCELLED_UNCONFIRMED, BOOKING_AUTO_CANCELLED_NO_SHOW.
          MessageGroup=SERVICE_ORDER — QUOTATION_CONFIRMED_BY_DRIVER_PLUS, QUOTATION_DECLINED_BY_DRIVER_PLUS.

    - topic: "AC-NONPROD-DEV-SERVICE-ORDER-EVENTS"
      payload:
        message_step: "'DELIVERED' (hardcoded string, không dùng enum ServiceOrderMessageStep)"
        tenant_id: long
        service_order_code: string
        previous_status: string
        current_status: string
        items: "array (inventory parts: sku, quantity, sellingPrice)"
      meaning: "ServiceOrderStatusChangedEvent — chuyên dùng cho luồng xuất kho inventory. Emitted by ServiceOrderEventPublisher.publishServiceOrderStatusChangedEvent chỉ khi SO thoả 4 điều kiện BR-GF-SALES-011 (feature flag bật, chưa gửi delivery event, trạng thái hợp lệ theo order type, có active part source=INVENTORY); consumed by gf-inventory-worker để tạo phiếu xuất kho. MessageStep hardcoded 'DELIVERED', không qua enum. Topic-drift-risk: worker default dev-inventory-service-order-events (alignment via env override)."

    - topic: "AC-DEV-SERVICE-ORDER-SYNC"
      payload:
        message_step: "ServiceOrderMessageStep — SENT.1 | UPDATE.1 | IN_PROGRESS.1 | COMPLETED.1 | CONFIRMED.1 | DELIVERED.1"
        source: "GF_SALES"
        tenant_id: long
        service_order_code: string
      meaning: |
        Topic hai chiều (xem thêm consumes), source=GF_SALES, qua outbox pattern. Enum ServiceOrderMessageStep (com.actechx.gf.domain.model.enums.ServiceOrderMessageStep), 6 step outbound:
          SENT.1 — ServiceOrderSentEvent (AC-14): gửi báo giá lần đầu sang Driver+, chứa services/parts/totalAmount/quoteSentCount; emitted by ServiceOrderEventPublisher.publishServiceOrderSentEvent.
          UPDATE.1 — ServiceOrderUpdatedEvent (AC-13): gửi lại báo giá sau khi cập nhật SO, cùng payload structure với SENT.1; emitted by ServiceOrderEventPublisher.publishServiceOrderUpdatedEvent.
          IN_PROGRESS.1 — ServiceOrderSyncEvent: SO bắt đầu sửa chữa (start), source=START; emitted by ServiceOrderEventPublisher.publishServiceOrderSyncEvent.
          COMPLETED.1 — ServiceOrderSyncEvent: SERVICE order hoàn thành (IN_PROGRESS → COMPLETED), source=BOOKING hoặc DIRECT tuỳ có booking hay không; emitted by ServiceOrderEventPublisher.publishServiceOrderSyncEvent.
          CONFIRMED.1 — ServiceOrderSyncEvent: RETAIL order xác nhận báo giá (PRICING → CONFIRMED), source=QUOTE_CONFIRMED; emitted by ServiceOrderEventPublisher.publishServiceOrderSyncEvent.
          DELIVERED.1 — ServiceOrderSyncEvent: đồng bộ trạng thái SO sang Driver+, RETAIL order giao hàng (CONFIRMED → DELIVERED), source=DELIVER; emitted by ServiceOrderEventPublisher.publishServiceOrderSyncEvent. Khác với event DELIVERED trên topic AC-NONPROD-DEV-SERVICE-ORDER-EVENTS (chuyên cho luồng xuất kho inventory).

    - topic: "AC-DEV-BOOKING-COMPLETED-TOPIC"
      payload:
        message_step: "'COMPLETED' (hardcoded string, không dùng enum BookingMessageStep)"
        tenant_id: long
        booking_id: long
        customer_id: long
        service_type: string
        completed_at: datetime
      meaning: "BookingCompletedEvent — emitted by BookingV3Service.publishBookingCompletedEvent, gated bởi CRM_INITIAL_VERSION_FFLAG. MessageStep hardcoded 'COMPLETED', không qua enum. Consumed by gf-marketing cho triggered campaigns."

  consumes:
    - topic: "AC-DEV-BOOKING-EVENTS"
      payload:
        message_step: "BookingMessageStep — BOOKING.CREATE.REQUEST | BOOKING.CANCELLED"
        tenant_id: long
        booking_request: object
      action: |
        BookingDriverPlusConsumer, source=DRIVER_PLUS, idempotency qua InboxEvent unique constraint (eventId, eventType). Enum BookingMessageStep, 2 step inbound:
          BOOKING.CREATE.REQUEST — processBookingCreation (AC-1): tạo Booking từ Driver+ → lưu → phát BOOKING.CREATE.RESPONSE (source=GF_SALES) lên cùng topic + phát notification BOOKING_CREATED lên notification-request.
          BOOKING.CANCELLED — processBookingCancellation (AC-3): tìm Booking → cancel() → lưu → phát BOOKING.CHANGE.STATUS (source=GF_SALES) lên cùng topic + phát notification BOOKING_CANCELLED_BY_DRIVER lên notification-request. Yêu cầu OriginTenantId trong header.
        Các step khác (BOOKING.CREATE.RESPONSE, BOOKING.UPDATE.RESPONSE, BOOKING.CHANGE.STATUS) là step do chính gf-sales produce — consumer acknowledge và bỏ qua.

    - topic: "AC-DEV-SERVICE-ORDER-SYNC"
      payload:
        message_step: "ServiceOrderMessageStep — QUOTATION.CONFIRMED | QUOTATION.DECLINED"
        source: string
        tenant_id: long
        service_order_code: string
      action: |
        ServiceOrderDriverPlusConsumer, source=DRIVER_PLUS, bỏ qua nếu source=GF_SALES (event do chính mình produce). Idempotency qua InboxEvent unique constraint (eventId, eventType). Yêu cầu OriginTenantId và MessageStep trong header. Enum ServiceOrderMessageStep, 2 step inbound:
          QUOTATION.CONFIRMED (AC-16) — handleQuotationConfirmed: tìm SO theo code → kiểm tra status=PRICING (bỏ qua nếu đã xử lý) → SO.confirm() (PRICING→CONFIRMED) → lưu → phát notification QUOTATION_CONFIRMED_BY_DRIVER_PLUS lên notification-request.
          QUOTATION.DECLINED (AC-16) — handleQuotationDeclined: tìm SO theo code → SO.decline() (→DECLINED) → lưu → phát notification QUOTATION_DECLINED_BY_DRIVER_PLUS lên notification-request.
        Các step khác (SENT.1, UPDATE.1, IN_PROGRESS.1, COMPLETED.1, CONFIRMED.1, DELIVERED.1) là step do chính gf-sales produce — consumer log warn và bỏ qua.

entities:
  - name: "Booking"
    type: "aggregate_root"
    description: "Lịch hẹn sửa chữa/bảo dưỡng của garage, có snapshot customer/vehicle, trạng thái lifecycle, nguồn lead và lịch sử chuyển trạng thái."
    attributes:
      - { name: "id", type: "BIGINT", required: true }
      - { name: "code", type: "VARCHAR(50)", required: true, constraints: ["unique"] }
      - { name: "tenant_id", type: "BIGINT", required: true }
      - { name: "customer_id", type: "BIGINT", required: false }
      - { name: "customer_code", type: "VARCHAR(50)", required: false }
      - { name: "vehicle_id", type: "BIGINT", required: false }
      - { name: "driver_id", type: "String trong entity / BIGINT trong migration", required: false }
      - { name: "booked_at", type: "TIMESTAMPTZ", required: false }
      - { name: "status", type: "BookingStatus", required: true, constraints: ["BOOKING | BOOKED | ARRIVED | CHECKING | CHECKED | PRICING | CONFIRMED | DECLINED | READY | IN_PROGRESS | COMPLETED | CANCELLED | ABORTED | NO_SHOW"] }
      - { name: "service_type", type: "ServiceType", required: false }
      - { name: "lead_source", type: "LeadSource", required: false }
      - { name: "lead_id", type: "VARCHAR(50)", required: false }
      - { name: "arrived_at", type: "TIMESTAMPTZ", required: false }
      - { name: "notes", type: "VARCHAR(255)", required: false }
      - { name: "status_transition_data", type: "JSONB List<StatusTransition>", required: false }
    relationships:
      - { target: "BookingDetails", type: "one_to_one", description: "Một booking có tối đa một snapshot chi tiết qua booking_id unique." }
      - { target: "BookingStatusHistory", type: "one_to_many", description: "Một booking có nhiều bản ghi lịch sử trạng thái." }
      - { target: "ServiceOrder", type: "one_to_many", description: "Booking có thể được link sang service order qua booking_id." }
    invariants:
      - "Chỉ cho phép chuyển trạng thái theo BookingStatus.canTransitionTo."
      - "Booking từ Garage Care khởi tạo ở BOOKED; walk-in khởi tạo ở ARRIVED; nguồn khác khởi tạo ở BOOKING."
      - "Booking chỉ editable khi trạng thái là BOOKING hoặc BOOKED."
      - "API cancel hiện chặn nếu booking đã link service order và chỉ cho phép hủy từ BOOKED."

  - name: "BookingDetails"
    type: "entity"
    description: "Snapshot customer, vehicle, ảnh xe, tình trạng xe và ghi chú tại thời điểm đặt lịch."
    attributes:
      - { name: "id", type: "BIGINT", required: true }
      - { name: "tenant_id", type: "BIGINT", required: true }
      - { name: "booking_id", type: "BIGINT", required: true, constraints: ["unique"] }
      - { name: "customer_name", type: "VARCHAR(255)", required: false }
      - { name: "customer_phone", type: "VARCHAR(255)", required: false }
      - { name: "customer_email", type: "VARCHAR(255)", required: false }
      - { name: "vehicle_plate", type: "VARCHAR(255)", required: false }
      - { name: "vehicle_brand", type: "VARCHAR(255)", required: false }
      - { name: "vehicle_model", type: "VARCHAR(255)", required: false }
      - { name: "vehicle_version", type: "VARCHAR(255)", required: false }
      - { name: "vehicle_year", type: "VARCHAR(255)", required: false }
      - { name: "vehicle_vin", type: "VARCHAR(255)", required: false }
      - { name: "vehicle_odo", type: "INTEGER", required: false }
      - { name: "vehicle_images", type: "JSONB List<VehicleImage>", required: false }
      - { name: "vehicle_condition_description", type: "VARCHAR(1000)", required: false }
      - { name: "customer_note", type: "VARCHAR(1000)", required: false }
      - { name: "internal_note", type: "VARCHAR(1000)", required: false }
    relationships: []
    invariants:
      - "booking_id là unique để giữ tối đa một details record cho mỗi booking."

  - name: "BookingStatusHistory"
    type: "entity"
    description: "Dòng lịch sử trạng thái booking, gồm trạng thái trước/sau, lý do, actor và metadata hiển thị."
    attributes:
      - { name: "id", type: "BIGINT", required: true }
      - { name: "tenant_id", type: "BIGINT", required: true }
      - { name: "booking_id", type: "BIGINT", required: true }
      - { name: "from_status", type: "BookingStatus", required: false }
      - { name: "to_status", type: "BookingStatus", required: true }
      - { name: "reason", type: "TEXT", required: false }
      - { name: "changed_at", type: "TIMESTAMPTZ", required: true }
      - { name: "changed_by", type: "VARCHAR(100)", required: false }
      - { name: "metadata", type: "TEXT", required: false }
    relationships: []
    invariants:
      - "Mỗi chuyển trạng thái booking append lịch sử để phục vụ audit và lifecycle display."

