      - { name: "completed_at", type: "TIMESTAMPTZ", required: false }
      - { name: "has_insurance", type: "BOOLEAN", required: true }
      - { name: "insurance_company", type: "VARCHAR(255)", required: false, description: "Mã công ty bảo hiểm (v.d. INS_BSH) — lưu code từ mdm_catalog (directory=INSURANCE), KHÔNG phải free-text" }
      - { name: "creator_employee", type: "VARCHAR(255)", required: false }
      - { name: "creator_employee_id", type: "BIGINT", required: false }
      - { name: "insurance_policy_number", type: "VARCHAR(255)", required: false }
      - { name: "insurance_expiry_date", type: "DATE", required: false }
      - { name: "insurance_contact_phone", type: "VARCHAR(255)", required: false }
      - { name: "service_type", type: "ServiceType", required: false }
      - { name: "estimated_complete_at", type: "TIMESTAMPTZ", required: false }
      - { name: "order_type", type: "OrderType", required: false, constraints: ["SERVICE | RETAIL"] }
      - { name: "is_walk_in_retail", type: "BOOLEAN", required: false }
      - { name: "insurance_amount", type: "NUMERIC(15,2)", required: false }
      - { name: "customer_amount", type: "NUMERIC(15,2)", required: false }
      - { name: "settlement_code", type: "VARCHAR(50)", required: false }
      - { name: "settled_by", type: "VARCHAR(255)", required: false }
      - { name: "settled_at", type: "TIMESTAMPTZ", required: false }
      - { name: "assessor_name", type: "VARCHAR(255)", required: false }
      - { name: "cancellation_reason", type: "TEXT", required: false }
      - { name: "delivery_event_sent", type: "BOOLEAN", required: false }
      - { name: "quote_sent_count", type: "INTEGER", required: false }
    relationships:
      - { target: "ServiceOrderItem", type: "one_to_many", description: "Một phiếu có nhiều dòng công/dịch vụ qua service_order_id." }
      - { target: "ServiceOrderPart", type: "one_to_many", description: "Một phiếu có nhiều dòng phụ tùng qua service_order_id." }
      - { target: "ServiceOrderPayment", type: "one_to_many", description: "Một phiếu có nhiều bản ghi thanh toán qua service_order_id." }
      - { target: "ServiceOrderDocument", type: "one_to_many", description: "Một phiếu có nhiều tài liệu/ảnh/chứng từ qua service_order_id." }
      - { target: "ServiceOrderNote", type: "one_to_many", description: "Một phiếu có nhiều ghi chú qua service_order_id." }
      - { target: "QuotationAsk", type: "one_to_many", description: "Một phiếu có thể liên kết nhiều lần hỏi giá qua service_order_id." }
      - { target: "OcrVehicleInfoHistory", type: "one_to_many", description: "Một phiếu có thể có nhiều bản ghi OCR qua service_order_id." }
    invariants:
      - "Chỉ cho phép chuyển trạng thái theo ServiceOrderStatus.canTransitionTo và OrderType."
      - "SERVICE order chuyển COMPLETED rồi mới SETTLED; reopen từ SETTLED về COMPLETED."
      - "RETAIL order chuyển DELIVERED rồi mới SETTLED; reopen từ SETTLED về DELIVERED."
      - "Payment cập nhật paidAmount, debtAmount và paymentStatus; khi debt được clearing thì paymentStatus là PAID và debtAmount về 0."
      - "delivery_event_sent dùng để chặn phát lại event xuất kho inventory cho cùng service order."
      - "quote_sent_count tăng khi gửi hoặc gửi lại quotation sang Driver Plus."

  - name: "ServiceOrderItem"
    type: "entity"
    description: "Dòng công/dịch vụ trong service order."
    attributes:
      - { name: "id", type: "BIGINT", required: true }
      - { name: "tenant_id", type: "BIGINT", required: true }
      - { name: "service_order_id", type: "BIGINT", required: true }
      - { name: "service_code", type: "VARCHAR(255)", required: false }
      - { name: "service_name", type: "VARCHAR(255)", required: false }
      - { name: "description", type: "TEXT", required: false }
      - { name: "quantity", type: "INTEGER", required: true }
      - { name: "unit_price", type: "NUMERIC(15,2)", required: true }
      - { name: "unit", type: "VARCHAR(255)", required: false }
      - { name: "discount_amount", type: "String trong entity", required: false }
      - { name: "discount_percent", type: "NUMERIC(5,2)", required: false }
      - { name: "amount", type: "NUMERIC(15,2)", required: false }
      - { name: "tax_amount", type: "NUMERIC(15,2)", required: false }
      - { name: "final_amount", type: "NUMERIC(15,2)", required: false }
      - { name: "tax_percent", type: "NUMERIC(5,2)", required: false }
      - { name: "technician_id", type: "BIGINT", required: false }
      - { name: "technician_name", type: "VARCHAR(255)", required: false }
      - { name: "is_deleted", type: "BOOLEAN", required: true }
      - { name: "payer", type: "Payer", required: false, constraints: ["CUSTOMER | INSURANCE"] }
    relationships: []
    invariants:
      - "is_deleted là soft delete cho dòng công/dịch vụ."

  - name: "ServiceOrderPart"
    type: "entity"
    description: "Dòng phụ tùng trong service order, có thể đến từ inventory hoặc quotation ask."
    attributes:
      - { name: "id", type: "BIGINT", required: true }
      - { name: "tenant_id", type: "BIGINT", required: true }
      - { name: "service_order_id", type: "BIGINT", required: true }
      - { name: "part_id", type: "BIGINT", required: false }
      - { name: "sku", type: "VARCHAR(100)", required: false }
      - { name: "genuine_code", type: "VARCHAR(100)", required: false }
      - { name: "part_code", type: "VARCHAR(255)", required: false }
      - { name: "part_name", type: "VARCHAR(255)", required: false }
      - { name: "brand", type: "VARCHAR(100)", required: false }
      - { name: "tier", type: "VARCHAR(20)", required: false }
      - { name: "origin", type: "VARCHAR(100)", required: false }
      - { name: "quantity", type: "NUMERIC(15,3) trong DB / BigDecimal scale 2 trong entity", required: true }
      - { name: "unit_price", type: "NUMERIC(15,2)", required: true }
      - { name: "discount_percent", type: "NUMERIC(5,2)", required: false }
      - { name: "discount_amount", type: "NUMERIC(15,2)", required: false }
      - { name: "amount", type: "NUMERIC(15,2)", required: false }
      - { name: "unit", type: "VARCHAR(255)", required: false }
      - { name: "tax_rate", type: "NUMERIC(5,2)", required: false }
      - { name: "tax_amount", type: "NUMERIC(15,2)", required: false }
      - { name: "final_amount", type: "NUMERIC(15,2)", required: false }
      - { name: "source", type: "PartSource", required: false, constraints: ["INVENTORY | QUOTATION_ASK"] }
      - { name: "technician_id", type: "BIGINT", required: false }
      - { name: "technician_name", type: "VARCHAR(255)", required: false }
      - { name: "quotation_ask_code", type: "VARCHAR(50)", required: false }
      - { name: "is_deleted", type: "BOOLEAN", required: true }
      - { name: "payer", type: "Payer", required: false, constraints: ["CUSTOMER | INSURANCE"] }
    relationships:
      - { target: "QuotationAsk", type: "logical_reference", description: "quotation_ask_code liên kết logical tới mã hỏi giá." }
    invariants:
      - "Chỉ part active có source INVENTORY mới được đưa vào event xuất kho inventory."
      - "is_deleted là soft delete cho dòng phụ tùng."

  - name: "ServiceOrderPayment"
    type: "entity"
    description: "Giao dịch thanh toán của service order."
    attributes:
      - { name: "id", type: "BIGINT", required: true }
      - { name: "tenant_id", type: "BIGINT", required: true }
      - { name: "service_order_id", type: "BIGINT", required: true }
      - { name: "amount", type: "NUMERIC(15,2)", required: true }
      - { name: "payment_method", type: "PaymentMethod", required: false }
      - { name: "reference_code", type: "VARCHAR(100)", required: false }
      - { name: "settlement_code", type: "VARCHAR(100)", required: false }
      - { name: "notes", type: "TEXT", required: false }
      - { name: "paid_at", type: "TIMESTAMPTZ", required: true }
      - { name: "payment_status", type: "PaymentTransactionStatus", required: false, constraints: ["PENDING | COMPLETED | FAILED"] }
    relationships: []
    invariants:
      - "ServiceOrderPayment.create mặc định paidAt là thời điểm hiện tại nếu request không truyền và paymentStatus là COMPLETED."

  - name: "ServiceOrderDocument"
    type: "entity"
    description: "Tài liệu/ảnh/chứng từ gắn với service order."
    attributes:
      - { name: "id", type: "BIGINT", required: true }
      - { name: "tenant_id", type: "BIGINT", required: true }
      - { name: "service_order_id", type: "BIGINT", required: true }
      - { name: "document_type", type: "DocumentType", required: true }
      - { name: "file_name", type: "VARCHAR(255)", required: true }
      - { name: "file_url", type: "VARCHAR(500)", required: true }
      - { name: "file_size", type: "BIGINT", required: false }
      - { name: "mime_type", type: "VARCHAR(100)", required: false }
      - { name: "description", type: "TEXT", required: false }
      - { name: "is_deleted", type: "BOOLEAN", required: true }
    relationships: []
    invariants:
      - "is_deleted là soft delete cho tài liệu service order."

  - name: "ServiceOrderNote"
    type: "entity"
    description: "Ghi chú nghiệp vụ, kỹ thuật hoặc nội bộ trên service order."
    attributes:
      - { name: "id", type: "BIGINT", required: true }
      - { name: "tenant_id", type: "BIGINT", required: true }
      - { name: "service_order_id", type: "BIGINT", required: true }
      - { name: "note_type", type: "NoteType", required: true }
      - { name: "priority", type: "NotePriority", required: false }
      - { name: "content", type: "TEXT", required: true }
      - { name: "author_id", type: "BIGINT", required: false }
      - { name: "author_name", type: "VARCHAR(255)", required: false }
    relationships: []
    invariants: []

  - name: "Customer"
    type: "aggregate_root"
    description: "Projection cục bộ của customer phục vụ booking/service order; source of truth nằm ngoài gf-sales."
    attributes:
      - { name: "id", type: "BIGINT", required: true }
      - { name: "tenant_id", type: "BIGINT", required: true }
      - { name: "name", type: "VARCHAR(255)", required: true }
      - { name: "customer_status", type: "CustomerStatus", required: true, constraints: ["ACTIVE | DEACTIVATED"] }
      - { name: "contact_id", type: "BIGINT", required: false }
    relationships:
      - { target: "Contact", type: "logical_reference", description: "Customer projection có thể tham chiếu contact projection qua contact_id." }
    invariants:
      - "Customer là projection cục bộ; dữ liệu master thuộc gf-customer."

  - name: "Contact"
    type: "entity"
    description: "Projection contact theo tenant và phone."
    attributes:
      - { name: "id", type: "BIGINT", required: true }
      - { name: "tenant_id", type: "BIGINT", required: true }
      - { name: "phone", type: "VARCHAR(20)", required: true, constraints: ["unique per tenant"] }
      - { name: "email", type: "VARCHAR(255)", required: false }
      - { name: "latest_customer_id", type: "BIGINT", required: false }
    relationships: []
    invariants:
      - "Một tenant không có hai contact cùng phone."

  - name: "Vehicle"
    type: "aggregate_root"
    description: "Projection cục bộ của xe phục vụ booking/service order; source of truth nằm ngoài gf-sales."
    attributes:
      - { name: "id", type: "BIGINT", required: true }
      - { name: "tenant_id", type: "BIGINT", required: true }
      - { name: "plate", type: "VARCHAR(255)", required: true }
      - { name: "brand", type: "VARCHAR(255)", required: false }
      - { name: "model", type: "VARCHAR(255)", required: false }
      - { name: "version", type: "VARCHAR(255)", required: false }
      - { name: "year", type: "VARCHAR(255)", required: false }
      - { name: "vin", type: "VARCHAR(255)", required: false }
      - { name: "odo", type: "INTEGER", required: false }
      - { name: "images", type: "JSONB List<VehicleImage>", required: false }
      - { name: "vehicle_status", type: "VehicleStatus", required: true, constraints: ["ACTIVE | DEACTIVATED"] }
    relationships: []
    invariants:
      - "Vehicle là projection cục bộ; dữ liệu master thuộc gf-customer/vehicle boundary bên ngoài."

  - name: "VehicleRegistration"
    type: "entity"
    description: "Projection biển số chuẩn hóa, liên kết latest vehicle và contact."
    attributes:
      - { name: "id", type: "BIGINT", required: true }
      - { name: "tenant_id", type: "BIGINT", required: true }
      - { name: "plate", type: "VARCHAR(20)", required: true, constraints: ["unique per tenant"] }
      - { name: "latest_vehicle_id", type: "BIGINT", required: false }
      - { name: "contact_id", type: "BIGINT", required: false }
    relationships:
      - { target: "Vehicle", type: "logical_reference", description: "latest_vehicle_id trỏ tới projection xe mới nhất theo biển số." }
      - { target: "Contact", type: "logical_reference", description: "contact_id liên kết contact theo biển số." }
    invariants:
      - "Một tenant không có hai vehicle_registration cùng plate."

  - name: "QuotationAsk"
    type: "aggregate_root"
    description: "Link hỏi giá phụ tùng từ service order sang purchase quotation."
    attributes:
      - { name: "id", type: "BIGINT", required: true }
      - { name: "code", type: "VARCHAR(50)", required: true, constraints: ["unique"] }
      - { name: "tenant_id", type: "BIGINT", required: true }
      - { name: "service_order_id", type: "BIGINT", required: true }
      - { name: "status", type: "VARCHAR(50)", required: false }
      - { name: "requested_parts", type: "JSONB Map<String,Object>", required: false }
      - { name: "quotation_ask_id", type: "BIGINT", required: false }
    relationships:
      - { target: "ServiceOrder", type: "logical_reference", description: "QuotationAsk thuộc một service order qua service_order_id." }
    invariants:
      - "code là mã hỏi giá unique trong storage hiện tại."

  - name: "OcrVehicleInfoHistory"
    type: "entity"
    description: "Lịch sử gọi OCR thông tin đăng ký xe và raw response."
    attributes:
      - { name: "id", type: "BIGINT", required: true }
      - { name: "service_order_id", type: "BIGINT", required: false }
      - { name: "tenant_id", type: "BIGINT", required: false }
      - { name: "attachment_url", type: "TEXT", required: true }
      - { name: "status_response", type: "VARCHAR(255)", required: false }
      - { name: "json_response", type: "TEXT", required: true }
    relationships:
      - { target: "ServiceOrder", type: "logical_reference", description: "service_order_id liên kết kết quả OCR với phiếu dịch vụ nếu có." }
    invariants:
      - "OCR raw response chứa dữ liệu nhạy cảm nên cần policy retention/masking rõ ở vận hành."

  - name: "OutboxEvent"
    type: "aggregate_root"
    description: "Bảng outbox đảm bảo publish Kafka bền vững cho booking, service order, inventory workflow và notification events."
    attributes:
      - { name: "id", type: "UUID", required: true }
      - { name: "aggregate_type", type: "VARCHAR(100)", required: true }
      - { name: "aggregate_id", type: "VARCHAR(100)", required: true }
      - { name: "event_type", type: "VARCHAR(100)", required: true }
      - { name: "payload", type: "TEXT", required: true }
      - { name: "topic", type: "VARCHAR(200)", required: true }
      - { name: "status", type: "OutboxStatus", required: true, constraints: ["PENDING | PROCESSING | SENT | FAILED"] }
      - { name: "retry_count", type: "INTEGER", required: true }
      - { name: "created_at", type: "TIMESTAMPTZ", required: true }
      - { name: "processed_at", type: "TIMESTAMPTZ", required: false }
      - { name: "error_message", type: "VARCHAR(1000)", required: false }
      - { name: "headers", type: "TEXT", required: false }
    relationships: []
    invariants:
      - "OutboxProcessor dùng RedisLockRegistry để chỉ một instance xử lý batch pending/stale tại một thời điểm."
      - "OutboxEventCreatedEvent có thể publish ngay sau transaction; scheduled processor là fallback retry."
      - "Quá max retries thì event chuyển FAILED."

  - name: "InboxEvent"
    type: "aggregate_root"
    description: "Bảng inbox chống xử lý trùng inbound Driver Plus events."
    attributes:
      - { name: "event_id", type: "VARCHAR(100)", required: true, constraints: ["primary key"] }
      - { name: "event_type", type: "VARCHAR(100)", required: false }
      - { name: "source_service", type: "VARCHAR(100)", required: false }
      - { name: "tenant_id", type: "BIGINT", required: false }
      - { name: "received_at", type: "TIMESTAMPTZ", required: false }
      - { name: "processed_at", type: "TIMESTAMPTZ", required: false }
      - { name: "status", type: "VARCHAR(20)", required: false }
    relationships: []
    invariants:
      - "event_id là khóa chính để phát hiện duplicate inbound Kafka event."

  - name: "Sequence"
    type: "entity"
    description: "Bảng SQL sequences và function get_next_number dùng sinh mã nghiệp vụ theo schema."
    attributes:
      - { name: "sequence_name", type: "VARCHAR(100)", required: true, constraints: ["primary key"] }
      - { name: "current_value", type: "BIGINT", required: true }
      - { name: "increment_by", type: "INTEGER", required: true }
      - { name: "created_at", type: "TIMESTAMP", required: true }
      - { name: "updated_at", type: "TIMESTAMP", required: true }
    relationships: []
    invariants:
      - "DBUtils.getNextSequence gọi function get_next_number trong default_schema với transaction REQUIRES_NEW để tăng hoặc khởi tạo sequence."
      - "Constant khai báo booking_code, service_order_code, customer_code, vehicle_code và settlement_code; source runtime hiện thấy gọi getNextSequence cho booking_code và service_order_code."

business_rules:
  - { id: "BR-GF-SALES-001", description: "Booking chỉ được chuyển trạng thái theo BookingStatus.canTransitionTo.", cornerstone: true, enforcement_point: "Booking aggregate + BookingStatus + BookingV3Service" }
  - { id: "BR-GF-SALES-002", description: "Booking từ Garage Care auto-confirm ở BOOKED, walk-in ở ARRIVED, Driver Plus (BookingDriverPlusConsumer) và các nguồn còn lại ở BOOKING.", cornerstone: true, enforcement_point: "Booking.createFromGarageCare + Booking.createWalkIn + BookingV3Service.create + BookingDriverPlusConsumer.processBookingCreation" }
  - { id: "BR-GF-SALES-003", description: "Booking không được hủy qua API nếu đã có service order liên kết; API cancel hiện chỉ cho BOOKED.", cornerstone: true, enforcement_point: "BookingV3Service.cancel" }
  - { id: "BR-GF-SALES-004", description: "Booking quá hạn BOOKING hoặc BOOKED bị scheduler chuyển NO_SHOW, ghi history, publish BookingStatusChanged và notification.", cornerstone: true, enforcement_point: "BookingAutoCancelScheduler" }
  - { id: "BR-GF-SALES-005", description: "Service order chỉ được chuyển trạng thái theo ServiceOrderStatus.canTransitionTo và OrderType SERVICE/RETAIL.", cornerstone: true, enforcement_point: "ServiceOrder aggregate + ServiceOrderStatus" }
  - { id: "BR-GF-SALES-006", description: "SERVICE order settle từ COMPLETED sang SETTLED; RETAIL order settle từ DELIVERED sang SETTLED; reopen quay về trạng thái trước settlement theo OrderType.", cornerstone: true, enforcement_point: "ServiceOrder.settle + reopenFromSettled + ServiceOrderInternalService" }
  - { id: "BR-GF-SALES-007", description: "Reopen service order từ SETTLED bị chặn nếu đã có ServiceOrderPayment.", cornerstone: true, enforcement_point: "ServiceOrderInternalService.reopenFromSettled" }
  - { id: "BR-GF-SALES-008", description: "Payment ghi ServiceOrderPayment, cộng paidAmount, trừ debtAmount và cập nhật paymentStatus; paid đủ thì debtAmount về 0.", cornerstone: true, enforcement_point: "ServiceOrder.recordPayment + ServiceOrderV3Service.processRecordPayment" }
  - { id: "BR-GF-SALES-009", description: "Gửi quotation bị chặn khi quoteSentCount > 0 hoặc không có active item/part để báo giá.", cornerstone: true, enforcement_point: "ServiceOrderV3Service.sendQuotation" }
  - { id: "BR-GF-SALES-010", description: "Cập nhật service order sau khi đã gửi quotation phải tăng quoteSentCount và publish ServiceOrderUpdated.", cornerstone: true, enforcement_point: "ServiceOrderV3Service.handleResendQuotationIfNeeded" }
  - { id: "BR-GF-SALES-011", description: "Event xuất kho inventory chỉ phát khi thoả đồng thời 4 điều kiện: (1) feature flag Inventory:InventoryStockV01 bật, (2) chưa gửi delivery event (isDeliveryEventSent = false), (3) trạng thái hợp lệ theo order type — RETAIL cho phép CONFIRMED/COMPLETED/DELIVERED/SETTLED, SERVICE cho phép IN_PROGRESS/COMPLETED/DELIVERED/SETTLED, order type khác bị từ chối, (4) có ít nhất 1 active part với source INVENTORY. Khi phát event, ghi status transition CHECKED→IN_PROGRESS với eventSource = BOOKING (có bookingId) hoặc DIRECT (không có bookingId), sau đó đánh dấu deliveryEventSent = true. Không phát khi: feature flag tắt, event đã gửi, order type không phải SERVICE/RETAIL, trạng thái ngoài danh sách cho phép, hoặc không có part INVENTORY.", cornerstone: true, enforcement_point: "ServiceOrderV3Service.publishStockExportEventIfNeeded + isEligibleForStockExportEvent + isStatusAllowedForStockExport + hasInventoryParts" }
  - { id: "BR-GF-SALES-012", description: "Inbound Driver Plus events phải ghi InboxEvent trước khi xử lý; duplicate được acknowledge và bỏ qua.", cornerstone: true, enforcement_point: "BookingDriverPlusConsumer + ServiceOrderDriverPlusConsumer" }
  - { id: "BR-GF-SALES-013", description: "Outbound Kafka events đang chạy phải đi qua OutboxEvent và OutboxProcessor/OutboxEventCreatedEvent để retry bền vững.", cornerstone: true, enforcement_point: "AbstractOutboxProducer + OutboxProcessor + OutboxEventListener" }
  - { id: "BR-GF-SALES-014", description: "Customer, contact, vehicle và vehicle registration trong gf-sales là snapshot cục bộ; source of truth nằm ở boundary bên ngoài.", cornerstone: false, enforcement_point: "GfCustomerClient + projection repositories" }
  - { id: "BR-GF-SALES-015", description: "paymentStatus chuyển UNPAID khi paidAmount = 0; PARTIAL khi paidAmount > 0 nhưng chưa cleared; PAID khi debt cleared (unpaidGap ≤ 0, hoặc finalAmount có phần thập phân < 0.5 và unpaidGap ≤ phần thập phân đó — rounding artifact). Khi PAID, debtAmount bị force về 0. Thanh toán vượt debtAmount bị chặn bởi BusinessException ST-01.", cornerstone: false, enforcement_point: "ServiceOrder.updatePaymentStatus + ServiceOrder.isDebtCleared + ServiceOrder.isRoundingArtifactUnderpayment" }
  - { id: "BR-GF-SALES-016", description: "Tạo SERVICE order khi bookingId = null sẽ tự động sinh Booking walk-in với status ARRIVED, leadSource WALK_IN, arrivedAt = now; không áp dụng cho RETAIL order.", cornerstone: true, enforcement_point: "ServiceOrderV3Service.create + ServiceOrderV3Service.autoCreateBookingForServiceOrder + BookingV3Service.bookingCreatedFromServiceOrder + Booking.createWalkIn" }
  - { id: "BR-GF-SALES-017", description: "Booking code sinh theo format LH-{yyyyMMdd}-{00000} qua DBUtils.getNextSequence('booking_code') gọi PostgreSQL function get_next_number trong transaction REQUIRES_NEW.", cornerstone: false, enforcement_point: "BookingV3Service.generateBookingCode + BookingService.generateBookingCode + DBUtils.getNextSequence + Constant.BOOKING_CODE_PREFIX" }
  - { id: "BR-GF-SALES-018", description: "Service order code sinh theo format PDV-{yyyyMMdd}-{00000} qua DBUtils.getNextSequence('service_order_code') gọi PostgreSQL function get_next_number trong transaction REQUIRES_NEW.", cornerstone: false, enforcement_point: "ServiceOrderV3Service.generateServiceOrderCode + ServiceOrderService.generateServiceOrderCode + DBUtils.getNextSequence + Constant.SERVICE_ORDER_CODE_PREFIX" }
  - { id: "BR-GF-SALES-019", description: "Outbox event có eventId = UUID.randomUUID; mỗi Message có messageId = UUID.randomUUID; Kafka message key = message.getMessageId(); partition key = tenantId.toString(). OutboxEventCreatedEvent trigger publish ngay sau commit, OutboxScheduler là fallback retry.", cornerstone: false, enforcement_point: "OutboxService.saveEvent + Message constructor + EventPublishingService.publishEvent + KafkaMessagePublisher" }


workflows:
  - name: "BookingWorkflow"
    type: TEMPORAL
    description: "Manage booking lifecycle from creation to completion — task queue GF-SALES-BOOKING-QUEUE; signals confirmBooking, cancelBooking, customerArrived, quotationConfirmed, quotationDeclined, serviceCompleted; query getStatus()"
    steps:
      - step: 1
        service: "gf-sales"
        action: "Started by gf-sales BookingV3Service.create via WorkflowClient.start (post-commit) khi Booking được persist — schedule confirmation timer (PT24H)"
      - step: 2
        service: "gf-sales"
        action: "BookingActivities.validate / updateTimeslotCount — reserve slot"
      - step: 3
        service: "gf-sales"
        action: "Wait for signal confirmBooking / cancelBooking / customerArrived"
      - step: 4
        service: "gf-sales"
        action: "If no-show timer (PT30M) fires → BookingActivities.markNoShow + releaseTimeslot"
      - step: 5
        service: "gf-sales"
        action: "On serviceCompleted signal → NotificationActivities + emit BookingCompletedEvent"

  - name: "QuotationReminderWorkflow"
    type: TEMPORAL
    description: "Send quotation reminders at PT1H interval after quotation sent"
    steps:
      - step: 1
        service: "gf-sales"
        action: "Started by gf-sales ServiceOrderV3Service.sendQuotation via WorkflowClient.start sau khi quotation đã gửi (BR-GF-SALES-009)"
      - step: 2
        service: "gf-sales"
        action: "Sleep PT1H, check status — if not confirmed/declined, NotificationActivities send reminder"
      - step: 3
        service: "gf-sales"
        action: "Repeat until quotation confirmed/declined or max attempts"

  - name: "NoShowCheckWorkflow"
    type: TEMPORAL
    description: "Check no-show after PT30M for BOOKED bookings"
    steps:
      - step: 1
        service: "gf-sales"
        action: "Started by gf-sales BookingV3Service via WorkflowClient.start khi Booking transition sang BOOKED (BR-GF-SALES-001)"
      - step: 2
        service: "gf-sales"
        action: "Sleep PT30M"
      - step: 3
        service: "gf-sales"
        action: "If not arrived: BookingActivities.markNoShow + NotificationActivities publish notification"

  - name: "BookingAutoCancelScheduler"
    type: CRON_BATCH_PROCESSOR
    description: "Quét Booking quá hạn ở BOOKING/BOOKED, chuyển sang NO_SHOW, ghi history, publish BookingStatusChanged và notification (BR-GF-SALES-004). Service không tự schedule; tick đến từ gf-worker qua REST."
    steps:
      - step: 1
        service: "gf-sales"
        action: "Triggered by gf-worker cron HTTP every ~1m → POST /protected/v1/bookings/auto-cancel"
      - step: 2
        service: "gf-sales"
        action: "BookingAutoCancelScheduler — query Booking quá hạn (BOOKING hoặc BOOKED hết SLA confirm)"
      - step: 3
        service: "gf-sales"
        action: "Cho từng booking: transition sang NO_SHOW + ghi BookingHistory (BR-GF-SALES-001)"
      - step: 4
        service: "gf-sales → Kafka (booking-events) + gf-notification"
        action: "Publish BookingStatusChanged qua OutboxEvent (BR-GF-SALES-013) + send notification BOOKING_AUTO_CANCELLED_UNCONFIRMED/NO_SHOW"

integrations:
  inbound:
    - type: API
      source: "agg-garage-graph"
      purpose: "BFF SO/booking/customer/vehicle queries"
    - type: API
      source: "gf-customer"
      purpose: "POST /protected/v1/service-orders/{tenantId}/vehicle-summaries — aggregate"
    - type: API
      source: "gf-inventory"
      purpose: "GET /protected/v1/service-orders/{tenantId}/detail/{code} — validate delivery"
    - type: API
      source: "gf-accounting"
      purpose: "GET /protected/v1/service-orders/.../for-settlement, PUT /settle, /reopen-from-settled, GET /for-print"
    - type: API
      source: "gf-worker"
      purpose: "POST /protected/v1/bookings/auto-cancel — cron trigger"
    - type: EVENT
      source: "Driver+ external"
      purpose: "Send booking-events, service-order-sync"

  outbound:
    - type: API
      target: "gf-customer"
      purpose: "Vehicle relay, booking-count/visit/spent tracking, interactions — /protected/v1/customers/..."
    - type: API
      target: "gf-inventory"
      purpose: "Inventory part summary — GET /protected/v1/product/so-summary"
    - type: API
      target: "gf-erp-mdm"
      purpose: "Vehicle hierarchy + unit catalog (printing) — /protected/catalog/v1/{get-hierarchy,inquiry}"
    - type: API
      target: "gf-hrms"
      purpose: "Employee/technician info (printing)"
    - type: API
      target: "gf-purchase"
      purpose: "Purchase order linkage"
    - type: API
      target: "ct-saas-tenant"
      purpose: "Tenant/garage info"
    - type: API
      target: "OCR Vehicle Registration"
      purpose: "OCR vehicle reg parsing (INTERNAL_TOKEN_OCR)"
    - type: EVENT
      target: "Kafka — booking-events / notification-request / service-order-events / service-order-sync / booking-completed"
      purpose: "Publish lifecycle events via outbox (Redis-locked OutboxProcessor)"

dependencies:
  - { name: "PostgreSQL", type: "database", purpose: "System of record cho booking, service order, projection, quotation, OCR history, inbox/outbox và sequences.", config_ref: "spring.datasource.*, DB_SCHEMA" }
  - { name: "Redis", type: "cache", purpose: "Cache domain/external lookup và RedisLockRegistry cho OutboxProcessor.", config_ref: "REDIS_HOST, REDIS_PORT, OUTBOX_LOCK_REGISTRY_KEY" }
  - { name: "Kafka", type: "broker", purpose: "Publish/consume booking, service order sync, inventory worker và notification events.", config_ref: "KAFKA_BOOTSTRAP_SERVERS, kafka.topics.*" }
  - { name: "Temporal", type: "workflow", purpose: "BookingWorkflow, NoShowCheckWorkflow và QuotationReminderWorkflow tồn tại trên task queue GF-SALES-BOOKING-QUEUE; worker mặc định tắt qua TEMPORAL_ENABLED=false; activity implementations tồn tại đầy đủ (BookingActivities, NotificationActivities, ConfigActivities với Temporal stubs) — để enable worker set TEMPORAL_ENABLED=true.", config_ref: "TEMPORAL_ENABLED, TEMPORAL_CONNECTION_TARGET, TEMPORAL_NAMESPACE" }
  - { name: "common-printing", type: "printing", purpose: "Render preview/export PDF/image cho service order, repair order và retail order từ template HTML.", config_ref: "templates/serviceorder*, printing config" }
  - { name: "spring-security-starter", type: "auth", purpose: "Dual auth: /protected/* bằng x-api-key (ApiKeyAuthenticationFilter, INTERNAL_API_KEY), /api/* bằng JWT; SecurityUtils cho tenant/user context.", config_ref: "com.actechx.common:spring-security-starter, actechx.security.*" }
  - { name: "spring-feature-flag-starter", type: "feature_flag", purpose: "Gate dashboard, CRM booking completed event, sales management, inventory stock và vehicle management.", config_ref: "feature-flag.*, feature-flags.json" }
  - { name: "SpringDoc OpenAPI", type: "api_documentation", purpose: "Expose OpenAPI UI cho REST controllers.", config_ref: "springdoc-openapi-starter-webmvc-ui:2.8.9" }

change_log:
  - { date: "2026-05-21", summary: "BR-GF-SALES-011: chi tiết hoá điều kiện phát event xuất kho — liệt kê 4 điều kiện đồng thời, ghi rõ trạng thái hợp lệ theo từng order type (RETAIL: CONFIRMED/COMPLETED/DELIVERED/SETTLED; SERVICE: IN_PROGRESS/COMPLETED/DELIVERED/SETTLED), mô tả cả trường hợp phát và không phát event, bổ sung enforcement_point helper methods (isEligibleForStockExportEvent, isStatusAllowedForStockExport, hasInventoryParts). Events produces: phân biệt rõ mục đích 2 event DELIVERED — topic AC-NONPROD-DEV-SERVICE-ORDER-EVENTS chuyên cho luồng xuất kho inventory (ref BR-GF-SALES-011), topic AC-DEV-SERVICE-ORDER-SYNC DELIVERED.1 chuyên đồng bộ trạng thái SO sang Driver+.", author: "Architecture Authority" }
  - { date: "2026-05-20", summary: "Bổ sung đầy đủ MessageStep cho events produces/consumes: liệt kê 6 giá trị BookingMessageStep (3 outbound + 2 inbound + SENT_NOTIFICATION) và 9 giá trị ServiceOrderMessageStep (6 outbound + 2 inbound + SENT_NOTIFICATION), ghi rõ wire value, enum class, hướng, event class, producer/consumer, ý nghĩa nghiệp vụ. Bổ sung 2 hardcoded step (DELIVERED trên service-order-events, COMPLETED trên booking-completed). Bổ sung luồng consume cập nhật: mỗi inbound step ghi rõ chain xử lý (tạo/cập nhật entity → phát event phản hồi + notification). Ghi rõ step nào bị consumer bỏ qua vì là step do chính gf-sales produce.", author: "Architecture Authority" }
