# Knowledge Graph — gf-hrms

boundary: "gf-hrms"
version: 2
last_updated: "2026-05-18"
owner_authority: "Architecture Authority"

metadata:
  purpose: "Quản lý hồ sơ nhân viên theo tenant, lifecycle trạng thái làm việc, lifecycle SSO qua Kafka tenant-user, lịch sử đổi trạng thái/vai trò, validation province/ward bằng cache MDM và migration dữ liệu nhân viên từ tenant/IAM."
  tech: { language: "Java 21", framework: "Spring Boot 3.5.0 + JPA + Kafka ", data_store: "PostgreSQL + Redis" }
  epics: []
  features: []
  integration_ref: "Architecture/integrations/INTEG-BFF-hrms.md"
  integration_consumers: []

